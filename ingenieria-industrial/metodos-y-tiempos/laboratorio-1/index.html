<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#112A46"><title>Laboratorio 1 · Métodos y Tiempos · Mg. Vicky Ruiz</title><style>
:root{--navy:#112A46;--teal:#176B80;--gold:#D6A84B;--ivory:#F7F4EC;--graphite:#303A46;--white:#fff;--muted:#617085;--line:#d9e1e6;--good:#157557;--bad:#a63a42}*{box-sizing:border-box}body{margin:0;background:var(--ivory);color:var(--graphite);font-family:Inter,'Segoe UI',Arial,sans-serif;line-height:1.58}h1,h2,h3,h4{font-family:Manrope,'Segoe UI',Arial,sans-serif;line-height:1.23;color:var(--navy)}h1{font-size:clamp(2rem,4vw,3.4rem)}h2{font-size:clamp(1.55rem,3vw,2.4rem)}h3{font-size:1.2rem}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:3px}button:disabled{opacity:.43;cursor:not-allowed}.shell{max-width:1250px;margin:auto;min-height:100vh;display:grid;grid-template-columns:260px minmax(0,1fr)}aside{background:var(--navy);color:white;padding:27px 16px;position:sticky;top:0;height:100vh;overflow:auto}aside .brand{font-weight:800;letter-spacing:.08em;font-size:.78rem;color:#f6d48a}aside h2{color:white;font-size:1.12rem;margin:10px 4px 22px}.scene-link{width:100%;text-align:left;border:0;background:transparent;color:#d6e2e9;border-radius:10px;padding:11px 12px;display:flex;gap:10px;align-items:center;font-size:.85rem;margin:3px 0}.scene-link:hover,.scene-link.active{background:#1c4767;color:white}.scene-link.done .num{background:#357d69}.num{background:#274c68;color:white;display:grid;place-items:center;min-width:27px;height:27px;border-radius:8px;font-size:.78rem}main{min-width:0;display:flex;flex-direction:column}.topbar{padding:16px clamp(20px,4vw,50px);background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:15px;justify-content:space-between}.progress{height:7px;background:#e5e9e9;border-radius:99px;overflow:hidden;margin:14px 0}.progress>div{height:100%;width:0;background:var(--gold);transition:width .25s}.main-inner{padding:30px clamp(20px,4vw,56px) 35px;flex:1;max-width:1040px;width:100%;margin:auto}.eyebrow{color:var(--teal);font-size:.78rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.lead{font-size:1.12rem;color:#44586a;max-width:780px}.panel{padding:clamp(18px,3vw,30px);background:white;border:1px solid var(--line);border-radius:20px;margin:18px 0;box-shadow:0 6px 22px #112a4608}.soft{background:#eaf2f2}.dark{background:var(--navy);color:#fff;border:0}.dark h2,.dark h3,.dark strong{color:white}.goldline{border-left:5px solid var(--gold)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.metric{border:1px solid var(--line);background:#f5f9fa;border-radius:13px;padding:15px}.metric strong{display:block;font-size:1.8rem;color:var(--navy);line-height:1.1}.metric small{color:var(--muted)}.pill{display:inline-block;padding:4px 10px;border-radius:99px;background:#e8f1f3;color:#155e71;font-size:.77rem;font-weight:750}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{background:var(--teal);border:1px solid var(--teal);border-radius:10px;color:white;padding:10px 15px;font-weight:750}.btn:hover{filter:brightness(.92)}.btn.secondary{background:white;color:var(--navy);border-color:#b9c6d0}.btn.gold{background:var(--gold);color:var(--navy);border-color:var(--gold)}.question{padding:20px;background:#f5f8f9;border:1px solid #cedde2;border-radius:16px;margin:20px 0}.answer{display:block;width:100%;text-align:left;border:1px solid #cbd8dc;background:white;border-radius:10px;padding:11px 14px;margin:8px 0;color:var(--graphite)}.answer:hover{border-color:var(--teal)}.answer.selected{background:#daeff0;border-color:var(--teal)}.feedback{margin:12px 0;padding:13px 15px;border-radius:10px;background:#e9f4eb;border:1px solid #b6d5be;color:#155c43}.feedback.warn{background:#fff1eb;border-color:#f4c8b1;color:#8a3f28}label{display:block;font-weight:650;margin:10px 0 5px}input[type=number],input[type=text],textarea,select{width:100%;padding:11px 12px;border:1px solid #bacad4;border-radius:10px;color:var(--graphite);background:white}textarea{min-height:100px;resize:vertical}.formula{background:#f0f5f6;border-radius:12px;padding:17px;font-size:1.1rem;text-align:center;font-weight:700;color:var(--navy);overflow:auto}.data-table{width:100%;border-collapse:collapse;margin:12px 0;font-size:.94rem}.data-table th{background:#e8f0f1;color:var(--navy);text-align:left}.data-table td,.data-table th{padding:10px 11px;border-bottom:1px solid var(--line)}.table-wrap{overflow-x:auto}.layout-diagram{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:17px;background:#f2eee6;border-radius:15px}.zone{padding:18px 8px;text-align:center;border:2px dashed #b69b65;border-radius:12px;background:white;color:var(--navy);min-height:88px}.zone button{margin-top:6px}.arrow{text-align:center;color:var(--teal);font-size:1.5rem}.checkline{display:flex;align-items:flex-start;gap:10px;margin:10px 0;padding:11px;background:white;border:1px solid var(--line);border-radius:12px}.checkline input{margin-top:7px;accent-color:var(--teal)}.checkline label{margin:0;font-weight:500}.bars{display:grid;gap:9px;margin:16px 0}.barrow{display:grid;grid-template-columns:115px 1fr 45px;align-items:center;gap:8px;font-size:.85rem}.bartrack{height:17px;border-radius:99px;background:#e5ebec;overflow:hidden}.barfill{height:100%;background:var(--teal);border-radius:99px}.barfill.after{background:var(--gold)}.footbar{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--line);background:white;padding:20px clamp(20px,4vw,50px)}.signature{color:#718496;font-size:.8rem}.small{font-size:.86rem;color:var(--muted)}.muted{color:var(--muted)}.mini{font-size:.8rem}.hidden{display:none!important}.result{background:#f5faf8;border:1px solid #b9d7c7;border-radius:14px;padding:15px;margin:12px 0}.comparison{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.scenario{border:1px solid #b7c9ce;border-radius:12px;padding:13px;background:white}.scenario h4{margin:0}.step{background:#eaf2f2;border-left:4px solid var(--teal);padding:14px 16px;border-radius:0 10px 10px 0;margin:12px 0}details{margin:12px 0;padding:12px 14px;background:#f3f7f8;border:1px solid var(--line);border-radius:12px}summary{font-weight:750;cursor:pointer;color:var(--navy)}.toast{font-size:.9rem;font-weight:650}.mobile-only{display:none}.result h3{margin-top:0}ul li,ol li{margin-bottom:7px}.divider{height:1px;background:var(--line);margin:22px 0}@media(max-width:900px){.shell{grid-template-columns:1fr}aside{height:auto;position:static;padding:12px 16px}aside .brand,aside h2,aside .progress,aside .small{display:none}nav{display:flex;overflow-x:auto;gap:4px;scrollbar-width:thin}.scene-link{flex:0 0 auto;width:46px;height:44px;padding:8px;justify-content:center}.scene-link .link-name{display:none}.topbar{padding:12px 20px}.main-inner{padding-top:18px}.mobile-only{display:inline}}@media(max-width:600px){.grid,.grid3,.comparison{grid-template-columns:1fr}.layout-diagram{grid-template-columns:1fr}.barrow{grid-template-columns:80px 1fr 38px}.footbar{flex-wrap:wrap}.scene-link{width:40px}.panel{border-radius:14px}}@media print{aside,.topbar,.footbar,.btn{display:none!important}.shell{display:block}body{background:white}.panel{break-inside:avoid}}
</style></head><body><div class="shell"><aside><div class="brand">AULAESCENA · LABORATORIO</div><h2>Métodos y Tiempos</h2><div class="small" style="color:#d6e2e9">Tu recorrido</div><div class="progress"><div id="sideProgress"></div></div><nav aria-label="Índice de escenas" id="nav"></nav></aside><main><div class="topbar"><span><strong>LAB 01</strong> · <span id="topTitle">Misión: mejorar el trabajo</span></span><span class="pill" id="progressText">0 / 12 escenas</span></div><div class="main-inner" id="content" tabindex="-1" aria-live="polite"></div><footer class="footbar"><button class="btn secondary" id="prevBtn">← Anterior</button><span class="signature">Mg. Vicky Ruiz</span><button class="btn" id="nextBtn">Siguiente →</button></footer></main></div><script>
'use strict';
const names=['La misión','Ingeniería del trabajo','Trabajar mejor','Inspecciona el puesto','Pioneros del trabajo','Productividad','Indicadores de desempeño','Caso El Roble','¿Funcionó la mejora?','Simulador de métodos','Defiende tu propuesta','Cierre de misión'];
const s={page:0,done:new Set(),responses:{},calc:{},choices:[],scenarios:[],report:{},simRuns:0};
const fmt=(x,d=2)=>Number(x).toLocaleString('es-CO',{maximumFractionDigits:d,minimumFractionDigits:d});const $=id=>document.getElementById(id);const safe=t=>String(t??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));const para=(a)=>a.map(t=>`<p>${t}</p>`).join('');
function panel(inner,cl=''){return `<section class="panel ${cl}">${inner}</section>`}function heading(n,title,desc){return `<div class="eyebrow">Escena ${n+1} / 12 · Laboratorio 1</div><h1>${title}</h1><p class="lead">${desc}</p>`}function metrics(a){return `<div class="grid">${a.map(([n,l])=>`<div class="metric"><strong>${n}</strong><small>${l}</small></div>`).join('')}</div>`}function table(rows){return `<div class="table-wrap"><table class="data-table">${rows.map((r,i)=>`<tr>${r.map(c=>`<${i?'td':'th'}>${c}</${i?'td':'th'}>`).join('')}</tr>`).join('')}</table></div>`}
function mc(id,q,options,correct,exp){let v=s.responses[id];return `<div class="question"><strong>${q}</strong>${options.map((o,i)=>`<button class="answer ${v===i?'selected':''}" onclick="choose('${id}',${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}${v!==undefined?`<div class="feedback ${v===correct?'':'warn'}">${v===correct?'✓ Muy bien. ':'Reconsidera tu elección. '}${exp}</div>`:''}</div>`}window.choose=(id,i)=>{s.responses[id]=i;render(false)};function textArea(id,label,ph='Escribe tu respuesta...'){return `<label for="${id}">${label}</label><textarea id="${id}" placeholder="${ph}">${safe(s.report[id]||'')}</textarea>`}function saveTexts(ids){ids.forEach(id=>{const el=$(id);if(el)s.report[id]=el.value})}function note(text){return `<div class="step">${text}</div>`}
const interventions=[{k:'tools',n:'Organizar herramientas',t:-2,detail:'Búsqueda de herramientas y piezas'},{k:'materials',n:'Acercar materiales',t:-1,detail:'Recorridos innecesarios'},{k:'template',n:'Utilizar plantilla',t:-2,detail:'Medición y marcado'},{k:'light',n:'Mejorar iluminación',t:-1,detail:'Condiciones de visibilidad'},{k:'inspection',n:'Verificación intermedia',t:1,detail:'Control durante el ensamble'}];
function simulate(arr){let time=35+interventions.filter(i=>arr.includes(i.k)).reduce((a,b)=>a+b.t,0),capacity=Math.floor(840/time),rejection=Math.max(0,16.67-(arr.includes('template')?4:0)-(arr.includes('light')?2:0)-(arr.includes('inspection')?4:0)),rejects=Math.floor(capacity*rejection/100+.5),good=capacity-rejects;return{time,capacity,rejection,rejects,good,prod:good/14,eff:28/time*100,efficacy:capacity/30*100,effectiveness:good/30*100}};
function scene(n){switch(n){
case 0:return heading(n,'Misión: mejorar el trabajo','Todos parecen ocupados. Sin embargo, los pedidos llegan tarde y algunos productos salen defectuosos.')+panel(`<span class="pill">Tu rol: ingeniero industrial</span><h2>¿Qué está ocurriendo?</h2><p>Una empresa tiene trabajadores, herramientas y equipos en funcionamiento. Al final del día no cumple sus pedidos y desperdicia materiales. El propietario piensa contratar más personal o exigir mayor velocidad.</p><p><strong>Tu desafío:</strong> comprender el proceso, identificar dificultades y proponer cambios demostrables.</p>`, 'dark')+panel(`<h3>Primera decisión</h3>${mc('opening','¿Qué debería hacer primero el ingeniero industrial?',['Comprar una máquina nueva','Observar, registrar y analizar el método actual','Exigir que todos trabajen más rápido','Contratar otro operario'],1,'El análisis debe comenzar con evidencia sobre actividades, recursos, tiempos y condiciones antes de intervenir.')}`)+note('<strong>Pregunta orientadora:</strong> ¿Cómo mejorar la productividad sin limitarse a exigir más esfuerzo a las personas?')+panel(`<h3>Al terminar podrás…</h3><ol><li>Comprender cómo se estudia el trabajo.</li><li>Identificar problemas de organización y condiciones laborales.</li><li>Calcular e interpretar indicadores.</li><li>Comparar métodos en una simulación.</li><li>Sustentar una propuesta con resultados.</li></ol>`);
case 1:return heading(n,'¿Qué estudia la ingeniería del trabajo?','Observa la relación entre personas, recursos y procesos.')+panel(`<h2>Estudiar antes de mejorar</h2><p>La ingeniería del trabajo analiza cómo se realizan las actividades laborales para encontrar métodos más sencillos, seguros y eficientes. Un proceso puede funcionar mal aunque cada trabajador se esfuerce mucho.</p><div class="grid3"><div class="metric"><h3>Personas</h3>Conocimientos, habilidades, seguridad, experiencia y condiciones laborales.</div><div class="metric"><h3>Recursos</h3>Materiales, herramientas, equipos, espacio, energía e información.</div><div class="metric"><h3>Procesos</h3>Actividades, movimientos, secuencias y tiempos para transformar entradas en resultados.</div></div>`)+panel(`<h3>Una panadería, dos métodos</h3><p>El operario A organiza ingredientes y herramientas cerca de su mesa. El operario B camina repetidamente al almacén y comparte utensilios que no siempre están disponibles. No podemos atribuir los resultados únicamente a la habilidad de las personas: también cuenta la organización.</p><div class="formula">¿Cómo se hace? → ¿Puede hacerse mejor? → ¿Cuánto tiempo debería tomar?</div><p>Primero analizamos y definimos el método. Después estudiamos su duración en condiciones establecidas.</p>`)+panel(`<h3>Aplica la idea</h3>${mc('systems','Una máquina moderna está detenida porque no llegan los materiales. ¿Qué muestra este caso?',['Que la experiencia del operario es el único factor relevante','Que basta medir la velocidad nominal de la máquina','Que los componentes del sistema de trabajo están relacionados','Que no se necesita conocer la secuencia del proceso'],2,'La disponibilidad de materiales, la organización y los equipos deben analizarse como un sistema.')}`);
case 2:return heading(n,'Trabajar mejor no es correr más','Distingue el trabajo necesario de las pérdidas que pueden evitarse.')+panel(`<h2>Dos puestos, un mismo producto</h2><div class="grid"><div class="metric"><span class="pill">Método A</span><h3>Elementos dispersos</h3><ul><li>Las cajas están lejos.</li><li>Se busca la cinta repetidamente.</li><li>Las instrucciones no están claras.</li></ul></div><div class="metric"><span class="pill">Método B</span><h3>Elementos organizados</h3><ul><li>Los materiales están cerca.</li><li>Las herramientas tienen ubicación definida.</li><li>La secuencia está documentada.</li></ul></div></div><p>Una mejora debe reducir movimientos, recorridos, errores y reprocesos, sin sacrificar la calidad ni la seguridad.</p>`)+panel(`<h3>Los siete propósitos</h3><div class="grid3">${['Simplificar el trabajo','Reducir desperdicios','Mejorar productividad','Reducir costos','Mejorar calidad','Mejorar condiciones laborales','Estandarizar actividades'].map(x=>`<div class="metric">${x}</div>`).join('')}</div>`)+panel(`<h3>Decide</h3>${mc('improve','¿Cuál modificación requiere especial precaución?',['Ubicar herramientas frecuentes cerca del puesto','Separar tornillos por medida','Eliminar la inspección final para terminar más rápido','Aclarar la secuencia de empaque'],2,'La inspección ayuda a detectar defectos. Antes de eliminarla hay que demostrar que la calidad sigue controlada.')}`);
case 3:return heading(n,'Inspecciona el puesto de trabajo','Un diagnóstico distingue observaciones, causas posibles y propuestas de comprobación.')+panel(`<h2>Recorre el taller virtual</h2><p>Selecciona cada zona para examinar una observación. Luego clasifica los problemas. Este ejercicio simula una inspección inicial, no reemplaza una evaluación técnica de seguridad y salud en el trabajo.</p><div class="layout-diagram"><div class="zone">Almacén<br><button class="btn secondary" onclick="showZone(0)">Examinar</button></div><div class="zone">Mesa de ensamble<br><button class="btn secondary" onclick="showZone(1)">Examinar</button></div><div class="zone">Control de calidad<br><button class="btn secondary" onclick="showZone(2)">Examinar</button></div></div><div id="zoneFeedback" class="result" aria-live="polite">Selecciona una zona para comenzar.</div>`)+panel(`<h3>Ruta de diez pasos</h3><div class="grid">${['Comprender el proceso','Analizar el factor humano','Evaluar orden y limpieza (5S)','Evaluar la iluminación','Evaluar ventilación','Analizar ruido y vibraciones','Verificar agua potable','Verificar equipos de protección personal','Evaluar higiene y primeros auxilios','Elaborar diagnóstico'].map((x,i)=>`<div class="metric"><span class="pill">Paso ${i+1}</span><br>${x}</div>`).join('')}</div><details><summary>¿Qué significan las 5S?</summary><p>Clasificar: separar lo necesario. Ordenar: asignar lugares. Limpiar: conservar el área. Estandarizar: definir prácticas. Mantener: sostener hábitos y revisar su cumplimiento.</p></details>`)+panel(`<h3>De la observación a la mejora</h3>${mc('diagnostic','Se observan búsquedas repetidas de tornillos. ¿Cuál es la afirmación más rigurosa?',['Está demostrado que los trabajadores son descuidados','La posible causa es que los tornillos carecen de ubicación definida; conviene verificarlo','La iluminación es necesariamente la única causa','No es necesario registrar datos'],1,'El hallazgo es la búsqueda repetida; la falta de ubicación es una hipótesis que debe comprobarse.')}<div class="divider"></div>${textArea('diagnosis','Describe un hallazgo, una posible causa y cómo comprobarías tu propuesta.') }<button class="btn secondary" onclick="saveAndNotice(['diagnosis'])">Guardar reflexión</button>`);
case 4:return heading(n,'¿Quiénes transformaron el estudio del trabajo?','Los autores aportaron perspectivas complementarias, no recetas universales.')+panel(`<div class="grid3">${[['Frederick Taylor','Observación, tiempos, métodos y estandarización.'],['Frank y Lillian Gilbreth','Análisis de movimientos y esfuerzo humano.'],['Henry Ford','Producción en masa y líneas de ensamblaje móviles.'],['Henry Gantt','Planificación y seguimiento de tareas sobre una escala temporal.'],['Henri Fayol','Planeación, organización, coordinación y control.'],['Max Weber','Reglas, responsabilidades y estructuras de autoridad.']].map(([a,b])=>`<div class="metric"><h3>${a}</h3>${b}</div>`).join('')}</div>`)+panel(`<h3>Conecta aportes con problemas</h3>${mc('history','En un taller se repiten movimientos innecesarios al alcanzar herramientas. ¿Qué enfoque histórico resulta especialmente relacionado?',['Programación de Gantt','Estudios de movimientos de los Gilbreth','Estructuras de autoridad de Weber','Funciones administrativas de Fayol'],1,'Los Gilbreth investigaron movimientos humanos durante la ejecución de tareas.')} ${mc('history2','Una empresa necesita programar y dar seguimiento a las tareas de un proyecto. ¿Cuál herramienta es pertinente?',['Diagrama de Gantt','Plantilla para medir perforaciones','Estudio de movimientos manuales','Control visual de iluminación'],0,'El diagrama de Gantt representa actividades en una escala de tiempo.')}`);
case 5:return heading(n,'¿Cómo se mide la productividad?','Compara resultados obtenidos y recursos utilizados, con unidades explícitas.')+panel(`<h2>Producir mucho no equivale a ser productivo</h2><div class="formula">Productividad = Producción obtenida ÷ Recursos utilizados</div><p>Si el recurso es el tiempo humano, utilizamos <strong>unidades por hora-persona</strong>. Dos trabajadores con siete horas efectivas cada uno aportan 14 horas-persona.</p><div class="step"><strong>Ejemplo del capítulo:</strong> 120 cajas ÷ 8 horas-persona = 15 cajas/hora-persona.<br>Después: 144 ÷ 8 = 18 cajas/hora-persona.<br>Variación = ((18 − 15) ÷ 15) × 100 = <strong>20 %</strong>.</div><p>La productividad parcial estudia un recurso específico. La productividad global considera diferentes recursos expresados en unidades comparables, usualmente valores económicos.</p>`)+panel(`<h3>Calculadora de productividad</h3><div class="grid3"><div><label for="c-output">Unidades producidas</label><input id="c-output" type="number" min="0" step="1" value="120"></div><div><label for="c-workers">Trabajadores</label><input id="c-workers" type="number" min="1" step="1" value="2"></div><div><label for="c-hours">Horas efectivas por trabajador</label><input id="c-hours" type="number" min="0.01" step="0.25" value="4"></div></div><button class="btn" onclick="calculateProductivity()">Calcular</button><div id="calcResult" class="result" aria-live="polite">Introduce datos y presiona Calcular.</div>`)+panel(`<h3>Comprueba lo aprendido</h3>${mc('prod','Si una empresa fabrica 150 unidades con 10 horas-persona, ¿cuál es su productividad laboral?',['10 unidades/hora-persona','15 unidades/hora-persona','20 unidades/hora-persona','150 unidades/hora-persona'],1,'150 ÷ 10 = 15 unidades por hora-persona.')}`);
case 6:return heading(n,'Eficiencia, eficacia y efectividad','Tres preguntas distintas: ¿cómo usamos recursos?, ¿cumplimos la cantidad?, ¿entregamos lo requerido?')+panel(`<div class="grid3"><div class="metric"><h3>Eficiencia respecto al tiempo objetivo</h3><p>(Tiempo objetivo ÷ tiempo real) × 100</p><strong>28 ÷ 35 = 80 %</strong></div><div class="metric"><h3>Eficacia de ensamble</h3><p>(Unidades ensambladas ÷ meta de ensamble) × 100</p><strong>24 ÷ 30 = 80 %</strong></div><div class="metric"><h3>Efectividad del resultado</h3><p>(Unidades buenas ÷ meta de unidades buenas) × 100</p><strong>20 ÷ 30 = 66,67 %</strong></div></div><p class="small">Estas son definiciones operativas del capítulo, no fórmulas universales para todos los contextos.</p>`)+panel(`<h3>Práctica de indicadores</h3><p>Una empresa busca ensamblar 40 productos buenos. Ensambla 40, pero 5 son rechazados. Calcula la eficacia de cantidad y la efectividad de resultado.</p><div class="grid"><div><label>Eficacia (%)</label><input type="number" id="e-efficacy" step="any" placeholder="%"></div><div><label>Efectividad (%)</label><input type="number" id="e-effectiveness" step="any" placeholder="%"></div></div><button class="btn" onclick="checkIndicators()">Comprobar</button><div id="indicatorFeedback" aria-live="polite"></div><details><summary>Ver explicación paso a paso</summary><p>La eficacia se calcula con todas las unidades ensambladas frente a la meta de ensamble. La efectividad utiliza únicamente las que cumplen requisitos. Aquí: 40/40 × 100 = 100 % y 35/40 × 100 = 87,5 %.</p></details>`)+panel(`<h3>Interpreta</h3>${mc('effective','Una empresa alcanza su meta de unidades ensambladas, pero entrega menos unidades buenas de las solicitadas. ¿Qué interpretación corresponde?',['La eficacia de cantidad puede ser 100 %, aunque la efectividad sea menor','La productividad siempre cae a cero','No existen defectos porque se alcanzó la meta','Se demuestra que la empresa usó menos recursos'],0,'La eficacia frente a la cantidad y la efectividad frente a los productos aceptados miden resultados distintos.')}`);
case 7:return heading(n,'Caso aplicado: Carpintería El Roble','Diagnostica un proceso de ensamble con datos del capítulo (caso académico ilustrativo).')+panel(`<h2>El proceso actual</h2><p>Dos trabajadores con 7 horas efectivas cada uno (14 horas-persona por día). Meta: 30 sillas buenas. El estudio se limita al ensamble: excluye corte, lijado, pintura y secado.</p>${table([['Actividad','Tiempo por silla'],['Buscar piezas y herramientas','5 min'],['Medir y marcar','4 min'],['Ensamblar patas y travesaños','10 min'],['Fijar asiento','6 min'],['Instalar respaldo','6 min'],['Inspeccionar y ajustar','4 min'],['<strong>Total</strong>','<strong>35 min</strong>']])}${metrics([['24','Sillas ensambladas/día'],['20','Sillas buenas/día'],['4','Sillas rechazadas'],['28 min','Tiempo objetivo por silla']])}`)+panel(`<h3>Resuelve el diagnóstico</h3><p>Calcula la productividad laboral, eficiencia respecto al objetivo, eficacia de ensamble, efectividad y tasa de rechazo.</p><div class="grid">${[['p','Productividad (sillas buenas/h-persona)'],['ef','Eficiencia de tiempo (%)'],['ea','Eficacia de ensamble (%)'],['et','Efectividad (%)'],['rej','Tasa de rechazo (%)']].map(([id,t])=>`<div><label for="roble-${id}">${t}</label><input id="roble-${id}" type="number" step="any" placeholder="Escribe el valor"></div>`).join('')}</div><button class="btn" onclick="checkRoble()">Comprobar mis cálculos</button><div id="robleFeedback" aria-live="polite"></div><details><summary>Consultar solución razonada</summary><p>7 × 60 = 420 min/operario. 420 ÷ 35 = 12 sillas por operario; 2 operarios = 24 sillas. Productividad: 20 ÷ 14 = 1,43 buenas/hora-persona. Eficiencia de tiempo: 28 ÷ 35 × 100 = 80 %. Eficacia: 24 ÷ 30 × 100 = 80 %. Efectividad: 20 ÷ 30 × 100 = 66,67 %. Rechazo: 4 ÷ 24 × 100 = 16,67 %.</p></details>`)+panel(`<h3>Prioriza una oportunidad</h3>${mc('robledecision','¿Por qué no se debe intervenir automáticamente la actividad de mayor duración?',['Porque toda operación larga agrega desperdicio','Porque solo las inspecciones deben mejorarse','Porque una actividad larga puede ser necesaria y otra más breve puede tener pérdidas fáciles de evitar','Porque los tiempos no aportan al diagnóstico'],2,'Los diez minutos de ensamble pueden ser necesarios; los cinco de búsqueda de herramientas merecen investigar una posible reducción.')}`);
case 8:return heading(n,'¿Realmente mejoró la carpintería?','Compara el antes y el después sin confundir cumplir una cantidad con entregar productos buenos.')+panel(`<h2>Resultados del capítulo</h2>${table([['Indicador','Antes','Después'],['Tiempo por silla','35 min','28 min'],['Ensambladas','24','30'],['Buenas','20','28'],['Rechazadas','4','2'],['Horas-persona','14','14'],['Productividad','1,43','2,00'],['Eficacia ensamble','80 %','100 %'],['Efectividad','66,67 %','93,33 %'],['Tasa de rechazo','16,67 %','6,67 %']])}<div class="bars"><div class="barrow">Buenas antes<div class="bartrack"><div class="barfill" style="width:66.67%"></div></div>20</div><div class="barrow">Buenas después<div class="bartrack"><div class="barfill after" style="width:93.33%"></div></div>28</div></div><p><strong>Tiempo:</strong> (35−28)/35 × 100 = 20 % de reducción. <strong>Productividad:</strong> ((28/14)−(20/14))/(20/14) × 100 = 40 % de aumento. <strong>Rechazos:</strong> de 4 a 2, reducción de 50 % en cantidad.</p>`)+panel(`<h3>Interpreta los resultados</h3>${mc('comparison','El taller ensambló 30 sillas, pero 2 fueron rechazadas. ¿Se solucionó completamente el problema?',['Sí, porque la eficacia fue 100 %','No, porque la demanda era 30 sillas buenas y solo se obtuvieron 28','Sí, porque se redujo el tiempo por silla','No, porque el número de operarios disminuyó'],1,'La meta del cliente es de 30 sillas buenas. Faltan dos y se deben investigar sus causas.')} ${mc('percentages','¿Por qué aumentó 40 % la productividad de unidades buenas aunque el tiempo por silla bajó 20 %?',['Porque se aumentaron las horas-persona','Porque se duplicó la jornada','Porque se produjo más y también se redujeron los rechazos','Porque se eliminó toda inspección'],2,'La productividad utiliza las sillas buenas: pasan de 20 a 28 con las mismas 14 horas-persona.')}`);
case 9:return heading(n,'Simulador: mejora el método','Experimenta con decisiones. Los efectos adicionales son supuestos didácticos, no mediciones empresariales.')+panel(`<span class="pill">Modelo determinista · Caso hipotético</span><h2>El reto de las 30 sillas buenas</h2><p>Dispones de 840 minutos-persona efectivos diarios y dos operarios. El tiempo inicial es 35 minutos por silla y la tasa base de rechazo modelada es 16,67 %.</p><div class="layout-diagram"><div class="zone">▣ Almacén<br><small>Materiales</small></div><div class="zone">⚙ Mesa de trabajo<br><small>Ensamble</small></div><div class="zone">✓ Control<br><small>Inspección</small></div></div><p><strong>Selecciona modificaciones:</strong></p>${interventions.map(x=>`<div class="checkline"><input type="checkbox" id="sim-${x.k}" ${s.choices.includes(x.k)?'checked':''} onchange="toggleIntervention('${x.k}',this.checked)"><label for="sim-${x.k}"><strong>${x.n}</strong> · ${x.t<0?'−'+Math.abs(x.t):'+'+x.t} min/silla<br><span class="small">${x.detail}</span></label></div>`).join('')}<div class="actions"><button class="btn gold" onclick="runSimulation()">▶ Ejecutar escenario</button><button class="btn secondary" onclick="resetInterventions()">Reiniciar controles</button></div><div id="simLive" class="result" aria-live="polite">Selecciona cambios y ejecuta una simulación.</div>`)+panel(`<h3>Reglas transparentes del simulador</h3><p>Tiempo por silla = 35 minutos + suma de modificaciones seleccionadas. Capacidad teórica = parte entera de 840 ÷ tiempo por silla, suponiendo operarios independientes y tareas ejecutables en esas condiciones.</p><p>Tasa supuesta de rechazo = máximo entre 0 y 16,67 % menos 4 puntos porcentuales por plantilla, 2 por iluminación y 4 por verificación intermedia. Rechazos simulados = capacidad × tasa, redondeados al entero más cercano (mitades hacia arriba). Unidades buenas = capacidad − rechazos.</p><p>La verificación intermedia añade un minuto por silla y puede reducir defectos en el modelo function showZone(i){const z=[['Almacén','Se encuentran tornillos de diversas medidas mezclados y las piezas más utilizadas están alejadas.','Hipótesis: la distribución genera búsquedas y desplazamientos. Registrar frecuencia y tiempo de búsqueda.'],['Mesa de ensamble','Una lámpara produce sombras sobre el área de medición. Un trabajador informa que algunas marcas deben repetirse.','Hipótesis: las sombras dificultan la medición. Observar y, cuando corresponda, medir iluminación mediante instrumentos y procedimientos apropiados.'],['Control de calidad','Al terminar la jornada se identifican sillas rechazadas, pero no se dispone de clasificación de defectos.','Registrar tipo, frecuencia y momento en que aparece cada defecto antes de señalar una causa.']][i];$('zoneFeedback').innerHTML=`<h3>${z[0]}</h3><p><strong>Hallazgo:</strong> ${z[1]}</p><p><strong>Qué investigar:</strong> ${z[2]}</p>`}
function calculateProductivity(){let a=+$('c-output').value,b=+$('c-workers').value,c=+$('c-hours').value;if(!Number.isInteger(a)||a<0||!Number.isInteger(b)||b<1||!(c>0)){$('calcResult').innerHTML='<div class="feedback warn">Introduce unidades enteras no negativas, trabajadores enteros positivos y horas efectivas mayores que cero.</div>';return}$('calcResult').innerHTML=`<h3>Resultado</h3><strong>${fmt(a/(b*c))} unidades/hora-persona</strong><p>${a} ÷ (${b} × ${fmt(c)}) = ${fmt(a/(b*c))}. Se utilizaron ${fmt(b*c)} horas-persona.</p>`}
function checkIndicators(){let a=+$('e-efficacy').value,b=+$('e-effectiveness').value;let ok=Math.abs(a-100)<.11&&Math.abs(b-87.5)<.11;$('indicatorFeedback').innerHTML=`<div class="feedback ${ok?'':'warn'}">${ok?'Correcto.':'Revisa tus resultados.'} Eficacia = 40/40 × 100 = 100 %. Efectividad = (40−5)/40 × 100 = 87,5 %.</div>`}
function checkRoble(){let ans=[20/14,80,80,20/30*100,4/24*100],ids=['p','ef','ea','et','rej'];let detail=ids.map((id,i)=>{let value=$('roble-'+id).value,n=Number(value),ok=value!==''&&Math.abs(n-ans[i])<.12;return `<li>${['Productividad','Eficiencia','Eficacia','Efectividad','Rechazos'][i]}: <strong>${ok?'✓':'Revisar'}</strong> (esperado: ${fmt(ans[i])}${i?' %':''})</li>`}).join('');$('robleFeedback').innerHTML=`<div class="feedback">${'<ul>'+detail+'</ul>'}</div>`}
function toggleIntervention(k,v){s.choices=v?[...new Set([...s.choices,k])]:s.choices.filter(x=>x!==k)}function resetInterventions(){s.choices=[];render(false)}function runSimulation(){let res=simulate(s.choices),entry={id:s.scenarios.length+1,choices:[...s.choices],...res};s.scenarios.push(entry);s.simRuns++;s.responses.simSelected=s.scenarios.length-1;$('simLive').innerHTML=simResultHTML(entry);$('scenarioHistory').innerHTML=renderScenarioHistory();markProgress();}function simResultHTML(x){return `<h3>Escenario ${x.id} · resultado calculado</h3>${metrics([[x.time+' min','Tiempo por silla'],[x.capacity,'Sillas ensambladas estimadas'],[x.good,'Sillas buenas estimadas'],[fmt(x.prod),'Buenas/hora-persona']])}<p>Tasa de rechazo supuesta: <strong>${fmt(x.rejection)} %</strong>. Rechazos estimados: <strong>${x.rejects}</strong>. Eficacia de cantidad: <strong>${fmt(x.efficacy)} %</strong>. Efectividad: <strong>${fmt(x.effectiveness)} %</strong>.</p><p>${x.good>=30?'En este modelo se alcanza la meta de 30 buenas. No es garantía para una empresa real.':'Este escenario no alcanza la meta de 30 sillas buenas. Investiga otras combinaciones.'}</p>`}function renderScenarioHistory(){return s.scenarios.length?`<div class="comparison">${s.scenarios.map((x,i)=>`<article class="scenario"><h4>Escenario ${x.id}</h4><p class="mini">${x.choices.length?x.choices.map(k=>interventions.find(t=>t.k===k)?.n).join(', '):'Sin intervenciones'}</p><strong>${x.time} min · ${x.good} buenas</strong><p class="mini">${fmt(x.prod)} buenas/hora-persona</p><label class="mini"><input type="radio" name="bestScenario" ${s.responses.simSelected===i?'checked':''} onchange="selectScenario(${i})"> Recomendar este</label></article>`).join('')}</div>`:'<p class="muted">Todavía no has ejecutado escenarios.</p>'}function selectScenario(i){s.responses.simSelected=i;if($('selectedScenario'))$('selectedScenario').innerHTML=selectedScenarioHTML()}
function selectedScenarioHTML(){let e=s.scenarios[s.responses.simSelected];return e?`<div class="result">Seleccionado: <strong>Escenario ${e.id}</strong>. Tiempo ${e.time} min/silla, producción estimada ${e.capacity}, buenas ${e.good}, rechazos ${e.rejects}, productividad ${fmt(e.prod)} buenas/hora-persona.</div>`:'<div class="feedback warn">No hay escenario seleccionado. Ve a la escena 10, ejecútalo y selecciónalo.</div>'}
function saveReport(){saveTexts(['diagFinal','proposalFinal','resultsFinal','validationFinal']);let n=['diagFinal','proposalFinal','resultsFinal','validationFinal'].filter(k=>s.report[k]?.trim()).length;$('reportFeedback').innerHTML=`<div class="feedback ${n<4?'warn':''}">${n} de 4 apartados diligenciados. ${n<4?'Completa todos para dejar tu argumentación lista.':'Informe registrado en esta sesión. Puedes descargarlo.'}</div>`;markProgress()}
function downloadReport(){saveTexts(['diagFinal','proposalFinal','resultsFinal','validationFinal']);let chosen=s.scenarios[s.responses.simSelected],out=`LABORATORIO 1 - MÉTODOS Y TIEMPOS\nMisión: mejorar el trabajo\nMg. Vicky Ruiz\n\nCASO ACADÉMICO\nEl Roble: 2 operarios, 14 horas-persona, 24 ensambladas, 20 buenas y 4 rechazadas.\n\nESCENARIOS SIMULADOS (hipótesis didácticas, NO observaciones reales)\n${s.scenarios.map(x=>`Escenario ${x.id}: cambios=${x.choices.map(k=>interventions.find(t=>t.k===k)?.n).join(', ')||'Ninguno'}; tiempo=${x.time} min; ensambladas=${x.capacity}; buenas=${x.good}; rechazos=${x.rejects}; productividad=${fmt(x.prod)} buenas/h-persona`).join('\n')}\n\nESCENARIO RECOMENDADO: ${chosen?'Escenario '+chosen.id:'Ninguno'}\n\nDIAGNÓSTICO\n${s.report.diagFinal||'(Sin completar)'}\n\nPROPUESTA\n${s.report.proposalFinal||'(Sin completar)'}\n\nRESULTADOS E INTERPRETACIÓN\n${s.report.resultsFinal||'(Sin completar)'}\n\nCOMPROBACIÓN REAL\n${s.report.validationFinal||'(Sin completar)'}\n\nNota: las simulaciones no sustituyen observaciones, mediciones técnicas ni validaciones reales.\n`;let blob=new Blob(['\ufeff'+out],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Laboratorio_1_Metodos_y_Tiempos_reporte.txt';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function saveAndNotice(ids){saveTexts(ids);alert('Reflexión guardada durante esta sesión.')}function statusHTML(){return `<p><strong>${s.scenarios.length}</strong> escenarios ejecutados. <strong>${['diagFinal','proposalFinal','resultsFinal','validationFinal'].filter(k=>s.report[k]?.trim()).length}/4</strong> apartados de informe diligenciados.</p><p><strong>${s.done.size}/12</strong> escenas marcadas como visitadas/completadas.</p>`}
function markProgress(){s.done.add(s.page);let validSim=s.scenarios.length>=3&&['diagFinal','proposalFinal','resultsFinal','validationFinal'].every(k=>s.report[k]?.trim());if(validSim){s.done.add(9);s.done.add(10)}updateNavigation()}function updateNavigation(){let nav=$('nav');nav.innerHTML=names.map((name,i)=>`<button class="scene-link ${s.page===i?'active':''} ${s.done.has(i)?'done':''}" aria-label="Ir a escena ${i+1}: ${name}" ${s.page===i?'aria-current="step"':''} onclick="goto(${i})"><span class="num">${s.done.has(i)?'✓':i+1}</span><span class="link-name">${name}</span></button>`).join('');$('sideProgress').style.width=(100*s.done.size/12)+'%';$('progressText').textContent=s.done.size+' / 12 visitadas';$('topTitle').textContent=names[s.page];$('prevBtn').disabled=s.page===0;$('nextBtn').textContent=s.page===11?'Volver al inicio ↺':'Siguiente →'}function goto(n){if(s.page===10)saveTexts(['diagFinal','proposalFinal','resultsFinal','validationFinal']);if(s.page===3)saveTexts(['diagnosis']);s.done.add(s.page);s.page=n;render(true)}function render(scroll=true){$('content').innerHTML=scene(s.page);updateNavigation();if(scroll){window.scrollTo({top:0,behavior:'instant'});$('content').focus({preventScroll:true})}}$('prevBtn').onclick=()=>goto(Math.max(0,s.page-1));$('nextBtn').onclick=()=>goto(s.page===11?0:s.page+1);document.addEventListener('keydown',e=>{if(e.altKey&&e.key==='ArrowRight')goto(Math.min(11,s.page+1));if(e.altKey&&e.key==='ArrowLeft')goto(Math.max(0,s.page-1))});window.addEventListener('beforeunload',e=>{if(s.scenarios.length||Object.values(s.report).some(Boolean)){e.preventDefault();e.returnValue=''}});render();
</script></body></html>
