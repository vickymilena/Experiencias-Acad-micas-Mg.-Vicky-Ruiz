ound:#fbf4e4}.panel.dark{background:var(--navy);color:white}.panel.dark h1,.panel.dark h2,.panel.dark h3{color:white}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.card{border:1px solid var(--line);border-radius:12px;padding:16px;background:white}.card h3{margin:0 0 8px}button,.button{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:9px;padding:10px 15px;border:1px solid var(--teal);background:var(--teal);color:#fff;cursor:pointer;font-weight:700;font-size:13px;font-family:inherit;text-decoration:none}button:hover{filter:brightness(.94)}button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:white;color:var(--teal)}.goldbtn{background:var(--gold);border-color:var(--gold);color:#162c40}input,select,textarea{font:inherit;width:100%;min-width:0;border:1px solid #aebdc7;border-radius:8px;padding:9px;color:var(--ink);background:white}textarea{min-height:84px;resize:vertical}label{display:block;font-size:13px;font-weight:750;margin:11px 0 4px}.muted{color:var(--muted);font-size:13px}.small{font-size:12px}.ok{color:var(--good);font-weight:700}.error{color:var(--bad);font-weight:700}.notice{border-left:4px solid var(--teal);background:#edf6f7;padding:12px 14px;border-radius:5px;margin:13px 0}.warning{border-color:var(--gold);background:#fff8e7}.stickyfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;padding:13px 0 0;border-top:1px solid var(--line)}.sig{color:#76808b;font-size:12px;text-align:right;margin:20px 4px 0;font-weight:600}.tablewrap{overflow-x:auto;margin:14px 0}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border:1px solid #d7e0e4;padding:9px;vertical-align:top}th{background:var(--navy);color:#fff;text-align:left;font-weight:700}tbody tr:nth-child(even){background:#f7f9fa}.lefthead{background:#dce8f1!important;color:#112A46!important}.righthead{background:# ay:none!important}details{border:1px solid var(--line);border-radius:9px;padding:10px;margin:10px 0}summary{cursor:pointer;font-weight:700}.tickrow{display:flex;gap:8px;flex-wrap:wrap}.tickrow>label{font-weight:400;margin:0}input[type=checkbox],input[type=radio]{width:auto}#toast{position:fixed;right:20px;bottom:20px;max-width:360px;background:#112A46;color:white;padding:13px 16px;border-radius:10px;box-shadow:0 8px 32px #0004;z-index:10;display:none}.timeline{max-width:100%;overflow:auto}.timeline svg{min-width:610px;width:100%;background:#f9fbfb;border:1px solid var(--line);border-radius:11px}.pillbad{background:#fff0ea;color:#aa3f30}.radio-row{display:flex;gap:7px;align-items:start;margin:8px 0}.footnote{font-size:12px;color:#677380}a:focus,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}@media(max-width:960px){.shell{display:block}.sidebar{display:none;position:fixed;z-index:9;top:0;left:0;width:275px;height:100vh;box-shadow:0 0 0 100vmax #0006}.sidebar.open{display:block}#menu-toggle{display:inline-flex}.grid3{grid-template-columns:repeat(2,1fr)}}@media(max-width:610px){.grid,.grid3,.therb-grid{grid-template-columns:1fr}.main{padding:14px}.scene{padding:17px}.controls button{flex:1}.top{align-items:start}}

</style></head><body><div class="shell"><aside class="sidebar" id="sidebar"><div class="brand">AulaEscena <small>Métodos y Tiempos · Ingeniería Industrial</small></div><div id="nav"></div></aside><main class="main"><div class="top"><button class="secondary" id="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰ Índice</button><span class="tag">Therbligs · economía de movimientos</span><span id="studentbar" class="muted"></span></div><div class="progress"><div id="progressfill"></div></div><section class="scene" id="scene" aria-live="polite"></section><div class="stickyfoot"><button class="secondary" onclick="go(-1)" id="prev">← Anterior</button><span id="counter" class="muted"></span><button onclick="go(1)" id="next">Siguiente →</button></div><div class="sig">Mg. Vicky Ruiz</div></main></div><div id="toast" role="status"></div>
<script>
'use strict';
const titles=['El movimiento invisible','¿Qué son los Therbligs?','Los 18 Therbligs','Movimientos en acción','Efectivos e inefectivos','Detective de movimientos','Cinco clases de movimiento','Geometría del puesto','Diseño ergonómico','Diagnóstico ergonómico','Caso escrito: el sándwich','Diagrama del sándwich','Taller: ensamble eléctrico','Resultados del estudio','Propuesta de mejora','Informe y descargas'];
const T=[['B','Buscar','I','#1e293b','ojo'],['EN','Encontrar','I','#555555','punto'],['SE','Seleccionar','I','#88909a','flecha'],['T','Tomar','E','#dc4747','arco'],['AL','Alcanzar','E','#6c833b','curva'],['M','Mover','E','#199b62','arco2'],['SO','Sostener','I','#c9a034','hold'],['SL','Soltar','E','#aa3d45','soltar'],['P','Colocar en posición','I','#3562ae','nueve'],['PP','Precolocar en posición','E','#50a6ce','pre'],['I','Inspeccionar','I','#a56d33','elipse'],['E','Ensamblar','E','#6332a3','hash'],['DE','Desensamblar','E','#ad8acd','hash'],['U','Usar','E','#9a35ae','u'],['DI','Demora inevitable','I','#bd8f1e','reloj'],['DEV','Demora evitable','I','#c6ba13','descanso'],['PL','Planear','I','#885637','plan'],['DES','Descansar','I','#d07831','descanso']];
const therb=Object.fromEntries(T.map(x=>[x[0],{code:x[0],name:x[1],group:x[2],color:x[3],shape:x[4]}]));
const sandwich=[
[0,.8,'AL','AL','Alcanza la lechuga','Alcanza el plato'],[.8,1.1,'T','T','Toma la lechuga','Toma el plato'],[1.1,2.1,'M','M','Mueve la lechuga hacia el pan','Mueve el plato al centro'],[2.1,2.6,'P','SO','Coloca la lechuga','Sostiene el plato'],[2.6,2.9,'SL','SO','Suelta la lechuga','Continúa sosteniendo el plato'],[2.9,3.4,'AL','SL','Alcanza el pan superior','Suelta el plato'],[3.4,3.7,'T','AL','Toma el pan superior','Alcanza el tomate'],[3.7,4,'SO','T','Sostiene el pan','Toma el tomate'],[4,4.8,'SO','M','Continúa sosteniendo el pan','Mueve el tomate'],[4.8,5.4,'SO','P','Continúa sosteniendo el pan','Coloca el tomate'],[5.4,5.7,'SO','SL','Continúa sosteniendo el pan','Suelta el tomate'],[5.7,6.3,'M','AL','Mueve el pan superior','Alcanza el plato'],[6.3,6.7,'P','SO','Coloca el pan superior','Sostiene el plato'],[6.7,7,'SL','SL','Suelta el pan superior','Suelta el plato']];
const initial=()=>({name:'',scene:0,highest:0,answers:{},sandwich:{},records:[],diagnosis:{},positions:{screws:'outer',tool:'outer',product:'normal'},ergoclass:1,desk:'high',improvements:['','',''],reflection:'',initialOpinion:'',finalized:false});
const KEY='AulaEscena_Therbligs_v1';let state=initial(),runtime={start:null,end:null,playing:false,animation:'AL',sandwichShow:false};try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s==='object')state={...initial(),...s};}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));document.getElementById('studentbar').textContent=state.name?'Estudiante: '+state.name:'Registro pendiente';}catch(e){toast('El navegador no permitió guardar automáticamente. Descarga tu avance.') }}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.display='none',3200)}
function escapeHTML(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(x){return Number(x).toLocaleString('es-CO',{minimumFractionDigits:1,maximumFractionDigits:2})}
function symbol(code){let t=therb[code];if(!t)return '<span class="muted">—</span>';let s=t.shape,p='';if(s==='ojo')p='<path d="M4 19 Q20 3 36 19 Q20 35 4 19Z"/><circle cx="20" cy="19" r="5"/>';else if(s==='punto')p='<circle cx="20" cy="19" r="7"/>';else if(s==='flecha')p='<path d="M4 19 H34 M25 11 L34 19 L25 27"/>';else if(s==='arco')p='<path d="M10 30 V12 Q10 5 15 12 L15 24 M30 30 V12 Q30 5 25 12 L25 24"/>';else if(s==='curva')p='<path d="M7 9 Q12 30 20 29 Q29 29 33 9"/>';else if(s==='arco2')p='<path d="M5 17 Q20 38 35 17 M25 24 Q26 10 35 17"/>';else if(s==='hold')p='<path d="M9 30 H31 M20 30 V9 Q20 4 15 9 Q13 13 20 17 Q27 13 25 9 Q20 4 20 9"/>';else if(s==='soltar')p='<path d="M6 25 Q20 4 34 25 M15 17 Q20 29 25 17"/>';else if(s==='nueve')p='<path d="M17 20 Q5 6 20 6 Q31 6 25 19 Q20 30 17 35"/>';else if(s==='pre')p='<circle cx="20" cy="11" r="8"/><path d="M20 19 L12 31 H28Z"/>';else if(s==='elipse')p='<ellipse cx="20" cy="19" rx="8" ry="15"/>';else if(s==='hash')p='<path d="M15 6 L10 33 M29 6 L24 33 M6 14 H35 M4 24 H33"/>';else if(s==='u')p='<path d="M10 8 V23 Q10 35 20 35 Q30 35 30 23 V8"/>';else if(s==='reloj')p='<path d="M8 29 V13 L20 5 L32 13 V29 M32 29 A4 4 0 1 0 32 21"/>';else if(s==='plan')p='<circle cx="14" cy="9" r="5"/><path d="M14 14 V31 H31 M14 19 L30 29"/>';else p='<circle cx="16" cy="9" r="5"/><path d="M16 14 V31 H31 M16 24 L31 24"/>';return `<span class="symbol" title="${escapeHTML(t.name)}" aria-label="Símbolo de ${escapeHTML(t.name)}"><svg viewBox="0 0 40 40" fill="none" stroke="${t.color}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">${p}</svg></span>`}
const opts=(sel='')=>'<option value="">Seleccione…</option>'+T.map(t=>`<option value="${t[0]}" ${sel===t[0]?'selected':''}>${t[1]} (${t[0]})</option>`).join('');
function setAnswer(id,val){state.answers[id]=val;save()}
function qa(id,q,choices,correct,explanation){let selected=state.answers[id]||'';return `<div class="card"><strong>${q}</strong>${choices.map(([v,l])=>`<label class="answer"><input type="radio" name="${id}" ${selected===v?'checked':''} onchange="answerQuestion('${id}','${v}')">${l}</label>`).join('')}<div class="feedback" id="fb-${id}">${selected?feedback(selected===correct,explanation):''}</div></div>`}
function feedback(ok,why){return `<div class="${ok?'ok':'error'}">${ok?'✓ Correcto.':'Revisa tu respuesta.'} ${why}</div>`}
const QUIZ={q3:['AL','M','Una mano vacía se desplaza hacia un objeto.','AL'],q4:['B','SE','Busca visualmente una pieza entre varias.','B'],q5:['T','SO','Mantiene una base inmóvil mientras la otra mano trabaja.','SO'],q6:['M','AL','Traslada un componente que ya tiene sujeto.','M'],q7:['SL','T','Abre los dedos y libera la pieza.','SL'],q8:['P','U','Ajusta una pieza en la ubicación exacta requerida.','P']};
function answerQuestion(id,val){setAnswer(id,val);const el=document.getElementById('fb-'+id);if(!el)return;if(id.startsWith('c')){let q=CLASSQ[Number(id.slice(1))];el.innerHTML=feedback(val===String(q.answer),q.why)}else if(id==='eff'){el.innerHTML=feedback(val==='b','Inspeccionar puede ser necesario para garantizar calidad, aunque se clasifique como inefectivo en el esquema del curso.')}else if(id.startsWith('quiz')){let n=id.slice(4),q=QUIZ[n];el.innerHTML=feedback(val===q[3],explainCode(q[3]))}else if(id==='d7')el.innerHTML=feedback(val==='b','Acercar la herramienta utilizada en cada ciclo reduce alcances excesivos.');else if(id==='d10')el.innerHTML=feedback(val==='b','Se debe actuar sobre el puesto sin eliminar la función de la herramienta.');else if(id==='origin')el.innerHTML=feedback(val==='b','El análisis de Therbligs profundiza la descripción bimanual.');else if(id==='q4')el.innerHTML=feedback(val==='b','Un movimiento de alcanzar se realiza sin transportar una pieza.');else if(id==='q1')el.innerHTML=feedback(val==='b','El estudio de métodos identifica oportunidades incluso cuando el producto es correcto.');}
function explainCode(c){let x=therb[c];return `Corresponde a ${x.name} (${x.code}). Observa qué hace la mano y si transporta un objeto.`}
function htmlSections(){return [scene1,scene2,scene3,scene4,scene5,scene6,scene7,scene8,scene9,scene10,scene11,scene12,scene13,scene14,scene15,scene16]}
function navigate(n){if(!state.name&&n!==0){toast('Ingresa tu nombre y apellido antes de continuar.');return;}state.scene=Math.max(0,Math.min(15,n));state.highest=Math.max(state.highest,state.scene);save();render();window.scrollTo({top:0,behavior:'instant'})}
function go(delta){navigate(state.scene+delta)}
function render(){document.getElementById('nav').innerHTML=titles.map((t,i)=>`<button class="nav-item ${i===state.scene?'active':''}" onclick="navigate(${i})"><span class="num">${String(i+1).padStart(2,'0')}</span><span>${escapeHTML(t)}</span></button>`).join('');document.getElementById('scene').innerHTML=htmlSections()[state.scene]();document.getElementById('prev').disabled=state.scene===0;document.getElementById('next').textContent=state.scene===15?'Volver al inicio ↩':'Siguiente →';document.getElementById('next').onclick=()=>state.scene===15?navigate(0):go(1);document.getElementById('counter').textContent=`Escena ${state.scene+1} de 16`;document.getElementById('progressfill').style.width=((state.scene+1)/16*100)+'%';document.getElementById('sidebar').classList.remove('open');save();if(state.scene===8)deskVisual();if(state.scene===7)renderWorkspace();if(state.scene===13)renderResults();if(state.scene===11)drawSandwich();}
function header(n,kicker,sub){return `<div class="tag">Escena ${n} · ${kicker}</div><h2>${titles[n-1]}</h2><p class="lead">${sub}</p>`}
function scene1(){return `<div class="panel dark"><div class="tag" style="color:var(--gold)">Laboratorio interactivo · Ingeniería Industrial</div><h1>THERBLIGS Y ECONOMÍA DE MOVIMIENTOS</h1><p style="font-size:19px">¿Cuántos movimientos realizas sin darte cuenta?</p><p>Observarás ambas manos, identificarás sus movimientos, medirás tiempos y propondrás una forma de trabajar mejor.</p></div><div class="grid"><div><h3>Registro obligatorio</h3><label for="name">Nombre y apellido</label><input id="name" value="${escapeHTML(state.name)}" autocomplete="name" placeholder="Escribe tus nombres y apellidos"><div class="footer-flex"><button onclick="register()">Guardar y comenzar →</button></div><p class="muted">Tu avance se guardará en este navegador. Puedes descargarlo incluso antes de terminar el laboratorio.</p></div><div class="panel"><h3>Pregunta inicial</h3>${qa('q1','Si una persona termina correctamente un producto, ¿significa que ya utiliza el mejor método?',[['a','Sí, si el resultado es correcto no hace falta revisar los movimientos.'],['b','No, siempre es posible estudiar si existen esfuerzos o acciones evitables.']],'b','Un producto correcto no garantiza que el método utilizado sea el más adecuado.')}</div></div><h3>Lo que conseguirás</h3><p>Reconocer los 18 Therbligs, interpretar símbolos, estudiar economía de movimientos, construir el diagrama de ambas manos, medir tiempos del video y descargar el informe final.</p>`}
function register(){let v=document.getElementById('name').value.trim().replace(/\s+/g,' ');if(v.split(' ').length<2){toast('Escribe nombre y apellido completos para comenzar.');document.getElementById('name').focus();return}state.name=v;save();navigate(1)}
function scene2(){return header(2,'Fundamentos','Del diagrama bimanual al análisis de cada movimiento elemental.')+`<p>Los <strong>Therbligs</strong> son elementos del estudio de movimientos asociados a Frank y Lillian Gilbreth. Permiten describir con mayor detalle las acciones físicas y auxiliares que forman una operación manual.</p><div class="panel gold"><strong>Relación con el laboratorio anterior:</strong> el diagrama bimanual identifica qué hace cada mano; los Therbligs permiten descomponer esas actividades en movimientos elementales y estudiar dónde existen oportunidades de mejora.</div><div class="grid"><div class="card"><h3>Diagrama bimanual</h3><p>«Mano derecha: toma un tornillo y lo lleva a la base».</p></div><div class="card"><h3>Análisis de Therbligs</h3><p>${symbol('AL')} Alcanzar → ${symbol('T')} Tomar → ${symbol('M')} Mover → ${symbol('P')} Colocar en posición.</p></div></div><h3>Para qué sirve</h3><p>Permite observar detalladamente cómo se realiza una tarea, estudiar acciones repetidas y evaluar cambios en la distribución del puesto, la secuencia y las herramientas. El objetivo no es exigir que una persona se mueva más rápido, sino revisar el método.</p>${qa('origin','¿Qué aporta el análisis de Therbligs al diagrama bimanual?',[['a','Sustituye completamente la observación de las manos.'],['b','Descompone las acciones de cada mano en elementos más detallados.']],'b','Permite describir los movimientos elementales.')}`}
function scene3(){let sel=state.answers.therbselected||'AL',t=therb[sel];return header(3,'Catálogo visual','Explora los 18 movimientos. Los símbolos se presentan con trazos ilustrativos inspirados en los convencionales; verifica la referencia gráfica de tu material.')+`<div class="notice warning">El artículo académico adjunto documenta 17 Therbligs; esta experiencia utiliza una versión ampliada de 18 que diferencia «Encontrar». Los códigos y símbolos se muestran como referencia didáctica y no deben confundirse con una norma gráfica única.</div><div class="therb-grid">${T.map(x=>`<button class="therb ${sel===x[0]?'selected':''}" onclick="selectTherb('${x[0]}')">${symbol(x[0])}<span><b>${escapeHTML(x[1])}</b><small>${x[0]} · ${x[2]==='E'?'Efectivo':'Inefectivo'}</small></span></button>`).join('')}</div><div class="panel" id="therbdetail"><h3>${symbol(sel)} ${t.name} (${sel})</h3>${therbInfo(sel)}</div><p class="footnote">La clasificación efectiva/inefectiva es la adoptada para este laboratorio. Un Therblig inefectivo no necesariamente debe eliminarse: inspeccionar o descansar puede ser necesario.</p>`}
const INFO={B:'La mano o la atención intentan localizar una pieza. Ejemplo: buscar un tornillo entre varios tamaños mezclados.',EN:'Se reconoce el objeto que se buscaba. Es un evento de reconocimiento difícil de medir por separado en algunos videos.',SE:'Se elige una pieza entre alternativas disponibles. Ejemplo: seleccionar una arandela adecuada.',T:'Los dedos adquieren control de un objeto. Ejemplo: tomar un tornillo.',AL:'La mano vacía se desplaza hacia un objeto. Ejemplo: alcanzar la herramienta.',M:'La mano transporta un objeto que ya está sujeto. Ejemplo: mover una base al centro.',SO:'La mano mantiene sujeto un objeto durante una acción. Ejemplo: sostener una base mientras la otra mano ensambla.',SL:'La mano deja de sujetar un objeto. Ejemplo: soltar el tornillo.',P:'Se ajusta un objeto a la orientación o ubicación necesaria. Ejemplo: alinear una pieza en su alojamiento.',PP:'Se prepara un objeto para facilitar la siguiente acción. Ejemplo: orientar previamente una herramienta.',I:'Se comprueba una característica. Ejemplo: verificar que la tapa esté bien colocada.',E:'Se unen componentes. Ejemplo: acoplar dos partes.',DE:'Se separan componentes ensamblados. Ejemplo: retirar una tapa instalada.',U:'Se utiliza una herramienta u objeto para cumplir su función. Ejemplo: accionar un destornillador.',DI:'Espera causada por una circunstancia que no puede suprimirse en las condiciones actuales.',DEV:'Espera que puede evitarse mediante organización o modificación del método.',PL:'La persona decide la acción siguiente o su secuencia. Puede ser difícil de observar directamente.',DES:'Interrupción para recuperarse de la fatiga. Puede ser necesaria para proteger la salud.'};
function therbInfo(code){return `<p>${INFO[code]}</p><p><strong>Grupo:</strong> ${therb[code].group==='E'?'Efectivo':'Inefectivo'}. <strong>Color de referencia:</strong> <span style="display:inline-block;width:14px;height:14px;background:${therb[code].color};vertical-align:middle;border-radius:3px"></span></p>`}
function selectTherb(c){state.answers.therbselected=c;save();document.getElementById('therbdetail').innerHTML=`<h3>${symbol(c)} ${therb[c].name} (${c})</h3>${therbInfo(c)}`;document.querySelectorAll('.therb').forEach(x=>x.classList.toggle('selected',x.textContent.includes('('+c+')')))}
function videoHTML(name,id){return `<div class="videobox"><video id="${id}" playsinline controls preload="metadata"><source src="assets/${name}.mp4" type="video/mp4">Tu navegador no reproduce este video. Descárgalo desde la carpeta assets.</video></div><div class="controls"><label style="display:flex;align-items:center;gap:6px;margin:0;color:var(--muted)">Velocidad <select onchange="document.getElementById('${id}').playbackRate=Number(this.value)"><option value="1">1×</option><option value="0.75">0,75×</option><option value="0.5">0,5×</option><option value="0.25">0,25×</option></select></label><button class="secondary" onclick="seek('${id}',-2)">↶ 2 s</button><button class="secondary" onclick="seek('${id}',2)">2 s ↷</button><button class="secondary" onclick="frame('${id}',-1)">◀ Fotograma aprox.</button><button class="secondary" onclick="frame('${id}',1)">Fotograma aprox. ▶</button></div><p class="footnote">El avance por fotogramas es aproximado; depende del navegador y del formato. Los tiempos se registran sobre la escala original del video, no sobre su velocidad de reproducción.</p>`}
function seek(id,n){let v=document.getElementById(id);v.currentTime=Math.max(0,Math.min(v.duration||1e5,v.currentTime+n))}function frame(id,sign){let v=document.getElementById(id);v.pause();v.currentTime=Math.max(0,Math.min(v.duration||1e5,v.currentTime+sign/30))}
function scene4(){return header(4,'Observación guiada','Observa los movimientos antes de clasificarlos.')+`<p>Este video demuestra 17 movimientos básicos. Nuestro catálogo de clase comprende 18, al incluir también Encontrar.</p>${videoHTML('demostracion','vdemo')}<div class="panel"><strong>Consigna:</strong> observa dos veces. La primera reconoce las acciones; la segunda diferencia alcanzar de mover y tomar de sostener.</div>${qa('q4','La mano se desplaza vacía hacia una pieza. ¿Qué ocurre?',[['a','Mover, porque cambia de posición.'],['b','Alcanzar, porque no transporta objeto.']],'b','La mano está vacía.')}${qa('eff','Un movimiento clasificado como inefectivo, por ejemplo inspeccionar, ¿siempre debe eliminarse?',[['a','Sí, sin excepciones.'],['b','No. Puede ser necesario para la calidad y debe justificarse.']],'b','La categoría no equivale a desperdicio automático.')}`}
function scene5(){let codes=['B','AL','SO','E','I','SL','DEV','U','PP','DES'];return header(5,'Clasificación','Antes de clasificar, comprende qué significa cada categoría en este laboratorio.')+`<div class="panel"><h3>¿Qué son los Therbligs efectivos?</h3><p>Son movimientos elementales que intervienen directamente en la manipulación y transformación de una pieza o en la ejecución física de la tarea. En nuestro esquema: <strong>Alcanzar, Tomar, Mover, Soltar, Precolocar en posición, Usar, Ensamblar y Desensamblar</strong>. Que un movimiento sea efectivo no significa que su distancia o repetición sean las mejores: también puede simplificarse.</p><h3>¿Qué son los Therbligs inefectivos?</h3><p>Son movimientos o condiciones de carácter auxiliar, mental, de comprobación, sujeción o espera. En esta clasificación: <strong>Buscar, Encontrar, Seleccionar, Sostener, Colocar en posición, Inspeccionar, Planear, Demora evitable, Demora inevitable y Descansar</strong>.</p><div class="notice warning"><strong>Atención:</strong> «inefectivo» <em>no significa siempre desperdicio</em>. Inspeccionar puede proteger la calidad, sostener puede ser indispensable y descansar puede prevenir fatiga. Primero se identifica la función; después se decide si conviene reducir, simplificar o mantener el movimiento.</div><p><strong>Ejemplo:</strong> el operario alcanza un tornillo (efectivo), lo busca entre tamaños mezclados (inefectivo) y lo toma (efectivo). Una mejora razonable es separar y organizar los tornillos: no eliminar la acción necesaria de tomarlos.</p></div><h3>Comprueba lo aprendido</h3><p>Clasifica cada Therblig. Recibirás retroalimentación y podrás corregir sin perder tus aciertos.</p><div class="grid">${codes.map(c=>`<div class="card"><div style="display:flex;align-items:center;gap:10px">${symbol(c)}<strong>${therb[c].name}</strong></div><label for="cl-${c}">Clasifica</label><select id="cl-${c}" onchange="setAnswer('class-${c}',this.value);document.getElementById('cf-${c}').innerHTML=''"><option value="">Seleccionar…</option><option value="E" ${state.answers['class-'+c]==='E'?'selected':''}>Efectivo</option><option value="I" ${state.answers['class-'+c]==='I'?'selected':''}>Inefectivo</option></select><div id="cf-${c}" class="feedback"></div></div>`).join('')}</div><button onclick="checkClasses()">Comprobar clasificación</button><div id="classresult" class="feedback"></div><div class="panel gold"><strong>Pregunta de análisis:</strong> ¿por qué no sería correcto eliminar todas las inspecciones solo porque aparecen como inefectivas?</div>`}
function checkClasses(){let codes=['B','AL','SO','E','I','SL','DEV','U','PP','DES'],ok=0;codes.forEach(c=>{let v=document.getElementById('cl-'+c).value;state.answers['class-'+c]=v;let good=v===therb[c].group;ok+=good?1:0;document.getElementById('cf-'+c).innerHTML=v?feedback(good,good?'Clasificación correcta.':`Revisa la categoría de ${therb[c].name}.`):'<span class="error">Pendiente de clasificar.</span>'});save();document.getElementById('classresult').textContent=`Aciertos: ${ok} de ${codes.length}. Puedes corregir las respuestas pendientes.`}
function handSVG(code){const actions={AL:['M 45 106 Q 87 107 150 68','M 148 67 L 169 61'],T:['M 65 118 Q 109 75 158 64','M 158 64 q 8 -2 7 11'],M:['M 60 110 Q 110 65 177 65','M 175 62 L 202 52'],P:['M 66 112 Q 132 70 180 90','M 183 89 L 208 101'],SL:['M 69 111 Q 125 80 177 80','M 195 78 L 208 69'],SO:['M 105 112 L 153 89','M 154 90 L 176 86']};let a=actions[code]||actions.AL;let motion={AL:"translate(35px,-18px)",T:"translate(54px,-18px)",M:"translate(85px,-29px)",P:"translate(87px,-12px)",SL:"translate(75px,-16px)",SO:"translate(0px,0px)"}[code]||"translate(35px,-18px)";return `<svg viewBox="0 0 320 178" role="img" aria-label="Animación esquemática de la mano para identificar un Therblig"><rect width="320" height="178" rx="12" fill="#F7F4EC"/><rect x="201" y="46" width="64" height="64" rx="8" fill="#d6a84b" stroke="#aa8738"/><text x="233" y="81" text-anchor="middle" font-size="12" fill="#112A46">Pieza</text><path d="M 20 142 H300" stroke="#adb9c4" stroke-width="3"/><g id="hand-anim" style="animation: handmove 3s ease-in-out infinite alternate;--delta:${motion}"><path d="M 45 136 L 78 123 L 112 96 L 141 83 Q148 78 153 87 L155 95 L169 84 Q176 79 181 87 L180 95 L190 89 Q197 87 199 94 Q200 102 189 107 L175 115 L154 121 L117 144 L79 153 Z" fill="#e4bfa2" stroke="#936e58" stroke-width="2"/><path d="M 45 136 L 78 123" stroke="#936e58" fill="none"/></g><circle cx="220" cy="80" r="2" fill="#112A46"/></svg>`}
function renderAnimation(){let el=document.getElementById('animated');if(el)el.innerHTML=handSVG(runtime.animation)}
function scene6(){return header(6,'Detective de movimientos','Identifica el Therblig a partir de una situación precisa. Se han retirado las animaciones que repetían el mismo gesto y no permitían reconocer el movimiento con claridad.')+`<div class="panel"><h3>¿Cómo razonar antes de responder?</h3><p>Identifica si la mano está vacía o sostiene una pieza; si la está localizando, tomando, trasladando, ubicando o soltando. Cada pregunta se refiere a una <strong>acción concreta</strong> y no debes inferir movimientos adicionales.</p></div><div class="grid">${Object.entries(QUIZ).map(([n,q],i)=>`<div><div class="tag">Situación ${i+1} de 6</div>${qa('quiz'+n,q[2],[[q[0],therb[q[0]].name],[q[1],therb[q[1]].name]],q[3],explainCode(q[3]))}</div>`).join('')}</div><div class="panel gold">Cuando termines, compara las diferencias entre <strong>Alcanzar y Mover</strong>, entre <strong>Tomar y Sostener</strong>, y entre <strong>Buscar y Seleccionar</strong>. El video demostrativo sigue disponible en la escena 4.</div>`}
const CLASSQ=[{q:'Una persona acomoda una pequeña pieza moviendo solo los dedos.',answer:1,why:'El movimiento puede ejecutarse principalmente con los dedos.'},{q:'Un operario gira una pequeña pieza mediante la muñeca.',answer:2,why:'El movimiento principal ocurre en la muñeca.'},{q:'Acerca una pieza flexionando el codo sin desplazar el hombro.',answer:3,why:'El antebrazo se desplaza a través del codo.'},{q:'Extiende el brazo completo desde el hombro.',answer:4,why:'Interviene el hombro para desplazar el brazo.'},{q:'Inclina el torso para alcanzar el material.',answer:5,why:'Al intervenir el tronco corresponde a la clase cinco.'}];
function scene7(){return header(7,'Biomecánica','Las cinco clases clásicas describen qué segmentos corporales participan en los movimientos.')+`<img class="image" src="assets/clases.png" alt="Infografía aportada sobre cinco clases de movimiento: dedos, muñeca, codo, hombro y tronco"><div class="notice warning">Las clases describen la amplitud corporal, no representan por sí solas un diagnóstico de fatiga. Se debe considerar además fuerza, frecuencia, postura, precisión y duración.</div><div class="tablewrap"><table><thead><tr><th>Clase</th><th>Partes que intervienen</th><th>Ejemplo</th></tr></thead><tbody><tr><td>1</td><td>Dedos</td><td>Acomodar una pieza pequeña</td></tr><tr><td>2</td><td>Dedos y muñeca</td><td>Girar una pieza pequeña</td></tr><tr><td>3</td><td>Dedos, muñeca y codo</td><td>Acercar una pieza con el antebrazo</td></tr><tr><td>4</td><td>Brazo desde el hombro</td><td>Alcanzar un material alejado</td></tr><tr><td>5</td><td>Brazo y tronco</td><td>Inclinarse para recoger algo</td></tr></tbody></table></div><h3>Clasifica las situaciones</h3><div class="grid">${CLASSQ.map((q,i)=>`<div class="card"><strong>${i+1}. ${q.q}</strong><label>Clase predominante</label><select onchange="answerQuestion('c${i}',this.value)" ><option value="">Elegir…</option>${[1,2,3,4,5].map(n=>`<option value="${n}" ${state.answers['c'+i]===String(n)?'selected':''}>Clase ${n}</option>`).join('')}</select><div class="feedback" id="fb-c${i}">${state.answers['c'+i]?feedback(state.answers['c'+i]===String(q.answer),q.why):''}</div></div>`).join('')}</div>`}
function scene8(){return header(8,'Zona normal y máxima','No basta con conocer el movimiento: importa dónde están los materiales.')+`<img class="image" src="assets/alcances.png" alt="Diagrama aportado de áreas normales y máximas de alcance sobre una mesa"><p>La <strong>zona normal</strong> favorece accesos más cómodos y frecuentes; la <strong>zona máxima</strong> requiere mayor extensión de los brazos. Estas áreas son orientativas: dependen del cuerpo, la postura y la tarea.</p><div class="panel"><h3>Organiza la estación</h3><p>Los tornillos y la herramienta se usan en cada ciclo. El producto terminado se retira al finalizar. Decide dónde ubicar cada elemento.</p><div id="workspace"></div><div class="grid3">${[['screws','Tornillos'],['tool','Herramienta'],['product','Producto terminado']].map(([key,label])=>`<div><label>${label}</label><select onchange="state.positions.${key}=this.value;save();renderWorkspace()"><option value="normal" ${state.positions[key]==='normal'?'selected':''}>Zona normal</option><option value="outer" ${state.positions[key]==='outer'?'selected':''}>Zona máxima</option><option value="outside" ${state.positions[key]==='outside'?'selected':''}>Fuera de alcance cómodo</option></select></div>`).join('')}</div><div id="zonefb" class="feedback"></div></div><p class="footnote">La figura no está a escala y no permite calcular distancias físicas. En un estudio real se medirían los alcances y las características de la persona.</p>`}
function renderWorkspace(){const el=document.getElementById('workspace');if(!el)return;let coords={normal:[[112,125],[180,120],[250,130]],outer:[[72,75],[181,54],[287,78]],outside:[[19,24],[166,18],[318,20]]};const labels=[['screws','T'],['tool','H'],['product','P']];el.innerHTML=`<svg viewBox="0 0 340 210" style="width:100%;max-width:650px;background:#F7F4EC;border:1px solid #d7dfe2;border-radius:12px"><path d="M20 167 A150 150 0 0 1 320 167Z" fill="#f2d99f" stroke="#bb974e"/><path d="M86 167 A84 84 0 0 1 254 167Z" fill="#a1c2aa" stroke="#63846d"/><line x1="10" y1="169" x2="330" y2="169" stroke="#303A46" stroke-width="3"/><rect x="136" y="176" width="68" height="23" rx="10" fill="#112A46"/><text x="170" y="191" font-size="11" fill="white" text-anchor="middle">Operario</text>${labels.map(([k,c],i)=>{let [x,y]=coords[state.positions[k]||'outer'][i];return `<circle cx="${x}" cy="${y}" r="14" fill="${['#176B80','#b98933','#526f86'][i]}" stroke="white" stroke-width="2"/><text x="${x}" y="${y+4}" text-anchor="middle" fill="white" font-size="12" font-weight="bold">${c}</text>`}).join('')}</svg>`;let good=state.positions.screws==='normal'&&state.positions.tool==='normal';document.getElementById('zonefb').innerHTML=good?'<div class="ok">Bien: los dos elementos frecuentes están en la zona normal. Verifica que no invadan el espacio de ensamble.</div>':'<div class="notice warning">Pista: los elementos usados en cada ciclo deberían ubicarse en zonas accesibles, sin obstruir el ensamble.</div>'}
function scene9(){return header(9,'Puesto de trabajo','La persona no debe adaptarse forzosamente a una superficie mal dimensionada.')+`<img class="image" src="assets/puesto.png" alt="Ilustración OIT 1998 aportada con orientaciones de altura de silla, mesa y espacio libre de piernas"><p>La altura de la mesa, la posición de los codos, el espacio de las piernas, el asiento y la iluminación influyen en la postura del operario. Las medidas de la figura son orientativas y no universales.</p><div class="card"><h3>Explora tres configuraciones</h3><div class="controls">${[['high','Mesa alta'],['low','Mesa baja'],['fit','Ajuste apropiado']].map(([v,l])=>`<button class="${state.desk===v?'':'secondary'}" onclick="state.desk='${v}';save();render()">${l}</button>`).join('')}</div><div id="desk-visual"></div><div id="desk-fb"></div></div><h3>Decisión profesional</h3><p>Una operaria se inclina continuamente para observar un ensamble pequeño. ¿Qué analizarías antes de intervenir? Registra una respuesta en la siguiente escena de diagnóstico.</p>`}
function deskVisual(){let d=state.desk,el=document.getElementById('desk-visual');if(!el)return;let y=d==='high'?53:d==='low'?148:102;el.innerHTML=`<svg viewBox="0 0 360 215" style="width:100%;max-height:280px"><rect width="360" height="215" rx="12" fill="#F7F4EC"/><path d="M20 194 H342" stroke="#8d9ba5" stroke-width="2"/><rect x="108" y="137" width="84" height="10" rx="4" fill="#176B80"/><path d="M124 143 V181 M180 143 V181" stroke="#176B80" stroke-width="5"/><circle cx="125" cy="66" r="17" fill="#dfb799" stroke="#765d4b" stroke-width="2"/><path d="M120 85 L113 129 L146 145 M113 129 L120 186" stroke="#303A46" stroke-width="12" fill="none" stroke-linecap="round"/><path d="M119 96 L146 ${d==='high'?63:d==='low'?136:103} L198 ${y+1}" stroke="#176B80" stroke-width="9" stroke-linejoin="round" fill="none" stroke-linecap="round"/><rect x="186" y="${y}" width="147" height="10" rx="3" fill="#D6A84B"/><rect x="309" y="${y+9}" width="9" height="${185-y}" fill="#ad8436"/></svg>`;document.getElementById('desk-fb').innerHTML=d==='high'?'<p>Una mesa demasiado alta puede favorecer la elevación de hombros y aumentar la incomodidad.</p>':d==='low'?'<p>Una mesa demasiado baja puede obligar a inclinar el tronco o flexionar excesivamente el cuello.</p>':'<p class="ok">Ajuste ilustrativo más cómodo. Debe comprobarse con la persona, la herramienta y las exigencias de la tarea.</p>'}
function scene10(){return header(10,'Diagnóstico','Observa una estación de trabajo y explica qué cambiarías y por qué.')+videoHTML('ergonomia','vergo')+`<div class="panel gold"><strong>Consigna:</strong> identifica tres oportunidades de mejora. Cada una debe contener una evidencia observable, el problema que genera y una propuesta concreta. No inventes hechos que no aparecen en el video.</div><div class="grid3">${[0,1,2].map(i=>`<div class="card"><h3>Hallazgo ${i+1}</h3><label>Problema observado</label><textarea oninput="state.diagnosis['p${i}']=this.value;save()">${escapeHTML(state.diagnosis['p'+i]||'')}</textarea><label>Evidencia en el video</label><textarea oninput="state.diagnosis['e${i}']=this.value;save()">${escapeHTML(state.diagnosis['e'+i]||'')}</textarea><label>Propuesta y principio aplicado</label><textarea oninput="state.diagnosis['s${i}']=this.value;save()">${escapeHTML(state.diagnosis['s'+i]||'')}</textarea></div>`).join('')}</div>${qa('d10','Si una herramienta obliga a extender repetidamente el brazo, ¿cuál es la mejor alternativa inicial?',[['a','Exigir que el trabajador alcance más rápido.'],['b','Evaluar si puede acercarse la herramienta sin interferir con otras tareas.'],['c','Eliminar la herramienta, aunque sea necesaria.']],'b','Debe modificarse el puesto manteniendo la función de la herramienta.')}`}
function scene11(){return header(11,'Caso resuelto','La cafetería Buen Sabor prepara un sándwich sencillo. Aprende primero con tiempos conocidos.')+`<div class="panel"><strong>Contexto ficticio.</strong> Una rebanada inferior ya está sobre el plato. A la izquierda se encuentran la lechuga y el pan superior; a la derecha, el tomate. Todos los ingredientes están listos. El ciclo comienza al alcanzar los ingredientes y termina cuando se suelta el pan superior. Los tiempos siguientes son <strong>didácticos, no mediciones reales</strong>.</div><div class="work-area"><svg viewBox="0 0 400 230"><rect width="400" height="230" fill="#F7F4EC"/><rect x="17" y="19" width="105" height="57" rx="8" fill="#d6e8c8" stroke="#7ba46d"/><text x="70" y="45" text-anchor="middle" fill="#28552d">Lechuga</text><rect x="274" y="19" width="108" height="57" rx="8" fill="#f5d8d1" stroke="#cb9179"/><text x="328" y="45" text-anchor="middle" fill="#773e31">Tomate</text><circle cx="201" cy="93" r="64" fill="#ebeff0" stroke="#9aa7b2" stroke-width="3"/><rect x="171" y="65" width="60" height="57" rx="9" fill="#e5c08b" stroke="#bb935e"/><text x="201" y="142" text-anchor="middle" font-size="12">Pan inferior + plato</text><rect x="19" y="155" width="110" height="50" rx="9" fill="#edd6ae" stroke="#bb935e"/><text x="74" y="184" text-anchor="middle" font-size="12">Pan superior</text><circle cx="174" cy="208" r="11" fill="#176B80"/><circle cx="229" cy="208" r="11" fill="#176B80"/><text x="157" y="212" text-anchor="end" font-size="11">MI</text><text x="247" y="212" font-size="11">MD</text></svg></div><h3>Secuencia observada y tiempos asignados</h3><div class="tablewrap"><table><thead><tr><th>Inicio</th><th>Fin</th><th>Mano izquierda</th><th>Mano derecha</th></tr></thead><tbody>${sandwich.map(r=>`<tr><td>${fmt(r[0])}</td><td>${fmt(r[1])}</td><td>${r[4]}</td><td>${r[5]}</td></tr>`).join('')}</tbody></table></div><div class="notice">Ejemplo: 0,0 a 0,8 s. Ambas manos se desplazan vacías hacia sus objetos: <strong>Alcanzar</strong>. El tiempo del ciclo transcurrido es 0,8 s, no 1,6 s, porque actúan simultáneamente.</div><p>De 3,7 a 5,7 s, la mano izquierda sostiene el pan: representa <strong>una acción continua de 2,0 segundos</strong>, aunque se muestre en cuatro filas. La operación completa dura <strong>7,0 segundos</strong>.</p>`}
function scene12(){return header(12,'Práctica guiada','Completa el diagrama de ambas manos. Los tres primeros intervalos están resueltos como ejemplo.')+`<div class="notice">Revisa la secuencia escrita en la escena anterior. Selecciona el Therblig que corresponda a cada mano. La aplicación conservará los aciertos y los resultados se calcularán al finalizar.</div><div class="tablewrap"><table><thead><tr><th>N.º</th><th>Intervalo</th><th class="lefthead">Izquierda · descripción</th><th class="lefthead">Therblig MI</th><th class="righthead">Derecha · descripción</th><th class="righthead">Therblig MD</th></tr></thead><tbody>${sandwich.map((r,i)=>{let a=state.sandwich[i]||{};let fixed=i<3;return `<tr><td>${i+1}</td><td>${fmt(r[0])}–${fmt(r[1])} s</td><td>${r[4]}</td><td>${fixed?symbol(r[2])+r[2]:`<select aria-label="Mano izquierda fila ${i+1}" onchange="setSand(${i},'left',this.value)">${opts(a.left||'')}</select>`}</td><td>${r[5]}</td><td>${fixed?symbol(r[3])+r[3]:`<select aria-label="Mano derecha fila ${i+1}" onchange="setSand(${i},'right',this.value)">${opts(a.right||'')}</select>`}</td></tr>`}).join('')}</tbody></table></div><div class="footer-flex"><button onclick="checkSandwich()">Comprobar y calcular</button><button class="secondary" onclick="downloadSandwich()">Descargar ejemplo en Excel</button></div><div id="sandout" class="feedback"></div><div id="sanddiag" class="timeline"></div>`}
function setSand(i,side,v){state.sandwich[i]=state.sandwich[i]||{};state.sandwich[i][side]=v;save()}
function sandwichActions(){let arr=[];for(let side of ['left','right']){let last=null;for(let i=0;i<sandwich.length;i++){let r=sandwich[i],code=side==='left'?r[2]:r[3],s=r[0],e=r[1];if(last&&last.code===code&&Math.abs(last.end-s)<1e-6){last.end=e;last.description+=' / '+(side==='left'?r[4]:r[5]);}else{last={side,start:s,end:e,code,description:side==='left'?r[4]:r[5]};arr.push(last)}}}return arr}
function checkSandwich(){let ok=0,pend=0;for(let i=3;i<sandwich.length;i++){let r=sandwich[i],a=state.sandwich[i]||{};for(let [key,c] of [['left',r[2]],['right',r[3]]]){if(!a[key])pend++;else if(a[key]===c)ok++}}let el=document.getElementById('sandout');el.innerHTML=`<div class="${pend?'error':'ok'}">Aciertos: ${ok} de 22. Pendientes: ${pend}. ${ok===22?'¡Diagrama completo!':'Revisa las filas e intenta de nuevo. El ejemplo contiene acciones continuas de sostener.'}</div>`;if(ok===22){let acts=sandwichActions();let summary=metrics(acts);el.innerHTML+=metricHTML(summary)+`<p class="notice">Importante: 24 Therbligs entre ambas manos, 18 efectivos y 6 inefectivos. El ciclo dura 7,0 s. En esta clasificación, «Colocar en posición» y «Sostener» se contabilizan como inefectivos, aunque pueden ser necesarios. No sumes las duraciones de ambas manos como duración del ciclo.</p>`;document.getElementById('sanddiag').innerHTML=timelineSVG(acts,7)}else{document.getElementById('sanddiag').innerHTML='';}}
function validAction(a){return a&&therb[a.code]&&a.side&&Number.isFinite(+a.start)&&Number.isFinite(+a.end)&&+a.end>+a.start}
function normalizedActions(actions){const ordered=actions.filter(validAction).map(a=>({...a})).sort((a,b)=>a.side.localeCompare(b.side)||a.start-b.start);const out=[];for(let a of ordered){let prev=out[out.length-1];if(prev&&prev.side===a.side&&prev.code===a.code&&['SO','DI','DEV','DES'].includes(a.code)&&Math.abs(prev.end-a.start)<.011){prev.end=a.end;prev.description=prev.description||a.description;}else out.push(a)}return out}
function metrics(actions){let x={left:{E:0,I:0,Et:0,It:0},right:{E:0,I:0,Et:0,It:0},E:0,I:0,Et:0,It:0,total:0,duration:0,detail:{}};for(let a of normalizedActions(actions)){let g=therb[a.code].group,d=+a.end-(+a.start);x[a.side][g]++;x[a.side][g+'t']+=d;x[g]++;x[g+'t']+=d;x.total++;x.duration=Math.max(x.duration,+a.end);if(!x.detail[a.code])x.detail[a.code]={count:0,time:0};x.detail[a.code].count++;x.detail[a.code].time+=d;}return x}
function metricHTML(m){return `<div class="grid3"><div class="metric"><strong>${m.E}</strong><span>Efectivos</span></div><div class="metric"><strong>${m.I}</strong><span>Inefectivos</span></div><div class="metric"><strong>${m.total}</strong><span>Total de Therbligs</span></div><div class="metric"><strong>${fmt(m.duration)} s</strong><span>Fin del último movimiento registrado (no necesariamente duración comprobada de todo el video)</span></div><div class="metric"><strong>${m.total?fmt(m.E/m.total*100):'0'} %</strong><span>Frecuencia de efectivos</span></div><div class="metric"><strong>${m.total?fmt(m.I/m.total*100):'0'} %</strong><span>Frecuencia de inefectivos</span></div></div><div class="tablewrap"><table><thead><tr><th>Indicador</th><th>Izquierda</th><th>Derecha</th></tr></thead><tbody><tr><td>Efectivos</td><td>${m.left.E}</td><td>${m.right.E}</td></tr><tr><td>Inefectivos</td><td>${m.left.I}</td><td>${m.right.I}</td></tr><tr><td>Tiempo en efectivos</td><td>${fmt(m.left.Et)} s</td><td>${fmt(m.right.Et)} s</td></tr><tr><td>Tiempo en inefectivos</td><td>${fmt(m.left.It)} s</td><td>${fmt(m.right.It)} s</td></tr></tbody></table></div>`}
function timelineSVG(acts,duration){let end=Math.max(duration,.1),w=960,h=100+acts.length*28;let left=130,width=800;let items=acts.map((a,i)=>{let y=75+i*28,x=left+width*a.start/end,rw=Math.max(3,width*(a.end-a.start)/end),t=therb[a.code];return `<text x="12" y="${y+13}" font-size="12" fill="#303A46">${a.side==='left'?'MI':'MD'} · ${a.code}</text><rect x="${x}" y="${y}" width="${rw}" height="19" rx="3" fill="${t.color}"/><title>${escapeHTML(t.name)}: ${fmt(a.start)}–${fmt(a.end)} s (${a.side})</title>`}).join('');return `<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagrama de Therbligs sobre una línea temporal compartida" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}"><rect width="${w}" height="${h}" fill="#f9fbfb"/><text x="15" y="24" font-family="Arial" font-size="16" font-weight="bold" fill="#112A46">Diagrama temporal de Therbligs</text><line x1="${left}" y1="59" x2="${left+width}" y2="59" stroke="#64748b"/>${Array.from({length:9},(_,i)=>{let x=left+i*width/8;return `<line x1="${x}" y1="54" x2="${x}" y2="${h-7}" stroke="#e3e8ea"/><text x="${x}" y="49" fill="#52606e" font-size="11" text-anchor="middle">${fmt(i*end/8)} s</text>`}).join('')}${items}<text x="15" y="${h-8}" fill="#64748b" font-size="11">MI: izquierda · MD: derecha · Ancho del bloque = duración</text></svg>`}
function downloadSandwich(){exportXlsx(sandwichActions(),'Ejemplo_Sandwich_Therbligs.xlsx')}
function scene13(){return header(13,'Taller individual','Analiza el ensamble eléctrico. Registra qué hacen la mano izquierda y la mano derecha en el mismo intervalo, y agrega tantas actividades como necesites.')+`<div class="notice warning"><strong>Cómo trabajar:</strong> observa el video, disminuye su velocidad, marca <strong>inicio y final</strong> y describe lo que hace cada mano <strong>en ese intervalo simultáneo</strong>. Si una mano continúa sosteniendo mientras la otra realiza varias acciones, divide los intervalos cuando sea necesario; la aplicación agrupará después las acciones continuas iguales para el conteo. No inventes movimientos no visibles.</div>${videoHTML('taller','vtaller')}<div class="panel"><h3>Agregar una actividad de ambas manos</h3><div class="controls"><button onclick="markTime('start')">⏱ Marcar inicio</button><button onclick="markTime('end')">⏱ Marcar final</button><button class="secondary" onclick="loopInterval()">↻ Repetir intervalo</button><button class="secondary" onclick="stopLoop()">Detener repetición</button></div><div class="grid"><div><label for="regstart">Inicio del intervalo (s)</label><input id="regstart" type="number" step="0.01" min="0" value="${runtime.start??''}" oninput="runtime.start=this.value"></div><div><label for="regend">Final del intervalo (s)</label><input id="regend" type="number" step="0.01" min="0" value="${runtime.end??''}" oninput="runtime.end=this.value"></div></div><p class="muted">Los tiempos corresponden a la línea temporal original del video, aunque lo reproduzcas a 0,25× o 0,5×.</p><div class="bimanual-input"><div class="hand-panel hand-left"><h3>✋ Mano izquierda</h3><label for="regdescL">¿Qué hace?</label><input id="regdescL" placeholder="Ej.: sostiene la base durante el montaje"><label for="regcodeL">Therblig</label><select id="regcodeL">${opts()}</select></div><div class="hand-panel hand-right"><h3>✋ Mano derecha</h3><label for="regdescR">¿Qué hace?</label><input id="regdescR" placeholder="Ej.: toma un tornillo con los dedos"><label for="regcodeR">Therblig</label><select id="regcodeR">${opts()}</select></div></div><label for="regnote">Observación (opcional)</label><input id="regnote" placeholder="Ej.: revisar entre 12,40 y 12,80 s"><p class="muted">Si no puedes identificar actividad de una mano, deja sus dos campos vacíos. El intervalo quedará pendiente de completar por ese lado; no se inventará un Therblig de espera.</p><div class="footer-flex"><button onclick="addRecordPair()">+ Agregar actividad de ambas manos</button><button class="secondary" onclick="exportXlsx(state.records,'Avance_Registro_Therbligs.xlsx')">↓ Descargar avance Excel</button></div><div id="regfeedback" class="feedback" role="status"></div></div><h3>Registro bimanual de la operación</h3><p class="muted">La tabla presenta ambas manos una junto a la otra y crece automáticamente. Puedes editar o eliminar las acciones de cada mano sin perder el resto del trabajo.</p><div id="recordtable">${recordTable()}</div>`}
function markTime(key){let v=document.getElementById('vtaller');if(!v||!Number.isFinite(v.currentTime))return;let t=Math.round(v.currentTime*100)/100;runtime[key]=t;document.getElementById(key==='start'?'regstart':'regend').value=t;toast(`Tiempo ${key==='start'?'inicial':'final'} marcado: ${fmt(t)} s`)}
let loopController=null;function stopLoop(){let v=document.getElementById('vtaller');if(v&&loopController){v.removeEventListener('timeupdate',loopController);loopController=null}}function loopInterval(){let v=document.getElementById('vtaller'),s=Number(document.getElementById('regstart').value),e=Number(document.getElementById('regend').value);if(!(e>s&&s>=0&&e<=v.duration)){toast('Marca un intervalo válido del video antes de repetirlo.');return}stopLoop();loopController=()=>{if(v.currentTime>=e)v.currentTime=s};v.addEventListener('timeupdate',loopController);v.currentTime=s;v.play().catch(()=>toast('Pulsa reproducir para iniciar el intervalo.'))}
function addRecord(){let v=document.getElementById('vtaller'),s=+document.getElementById('regstart').value,e=+document.getElementById('regend').value,side=document.getElementById('regside').value,code=document.getElementById('regcode').value,desc=document.getElementById('regdesc').value.trim(),note=document.getElementById('regnote').value.trim();let fb=document.getElementById('regfeedback');if(!code||!desc||!Number.isFinite(s)||!Number.isFinite(e)||e<=s||s<0||e>(v.duration||91.44)+.02){fb.innerHTML='<span class="error">Completa mano, Therblig y descripción. Inicio y final deben estar dentro del video y el final debe ser mayor.</span>';return}let overlaps=state.records.some(a=>a.side===side&&s<a.end-.005&&e>a.start+.005);if(overlaps){fb.innerHTML='<span class="error">Este intervalo se superpone con otro de la misma mano. Revisa si el movimiento anterior continúa o si necesitas modificarlo.</span>';return}let rec={id:Date.now()+Math.random(),side,code,start:s,end:e,description:desc,note};state.records.push(rec);state.records.sort((a,b)=>a.start-b.start||a.side.localeCompare(b.side));save();fb.innerHTML='<span class="ok">Registro guardado. Puedes observar el siguiente movimiento.</span>';document.getElementById('recordtable').innerHTML=recordTable();document.getElementById('regdesc').value='';document.getElementById('regnote').value='';}
function addRecordPair(){const startEl=document.getElementById('regstart'),endEl=document.getElementById('regend'),fb=document.getElementById('regfeedback'),video=document.getElementById('vtaller');const s=Number(startEl.value),e=Number(endEl.value);if(startEl.value===''||endEl.value===''||!Number.isFinite(s)||!Number.isFinite(e)||s<0||e<=s||e>(video?.duration||91.44)+.02){fb.innerHTML='<div class="error">Marca un inicio y un final válidos dentro del video; el final debe ser mayor.</div>';return}const note=document.getElementById('regnote').value.trim();let additions=[];for(let [side,suffix] of [['left','L'],['right','R']]){let code=document.getElementById('regcode'+suffix).value,desc=document.getElementById('regdesc'+suffix).value.trim();if(Boolean(code)!==Boolean(desc)){fb.innerHTML='<div class="error">Completa tanto la descripción como el Therblig de cada mano que hayas observado.</div>';return}if(code){const overlaps=state.records.some(a=>a.side===side&&s<a.end-.005&&e>a.start+.005);if(overlaps){fb.innerHTML=`<div class="error">El intervalo de la mano ${side==='left'?'izquierda':'derecha'} se superpone con uno ya registrado. Edita ese movimiento o marca otro intervalo.</div>`;return}additions.push({id:Date.now()+Math.random()+additions.length,side,code,start:s,end:e,description:desc,note})}}if(!additions.length){fb.innerHTML='<div class="error">Describe al menos una de las dos manos para agregar la actividad.</div>';return}state.records.push(...additions);state.records.sort((a,b)=>a.start-b.start||a.side.localeCompare(b.side));save();fb.innerHTML=`<div class="ok">Actividad agregada: ${additions.length} movimiento(s) en el intervalo ${fmt(s)}–${fmt(e)} s. Puedes seguir agregando filas.</div>`;document.getElementById('recordtable').innerHTML=recordTable();for(let suffix of ['L','R']){document.getElementById('regcode'+suffix).value='';document.getElementById('regdesc'+suffix).value=''}document.getElementById('regnote').value='';runtime.start=e;runtime.end=null;startEl.value=e;endEl.value='';}

function pairedRows(records){let actions=records.filter(validAction).sort((a,b)=>a.start-b.start||a.end-b.end);let boundaries=[...new Set(actions.flatMap(r=>[Number(r.start.toFixed(3)),Number(r.end.toFixed(3))]))].sort((a,b)=>a-b);let out=[];for(let i=0;i<boundaries.length-1;i++){let st=boundaries[i],en=boundaries[i+1];let left=actions.find(r=>r.side==='left'&&r.start<=st+.0005&&r.end>=en-.0005);let right=actions.find(r=>r.side==='right'&&r.start<=st+.0005&&r.end>=en-.0005);if(left||right)out.push({start:st,end:en,left,right,leftContinues:!!left&&left.start<st-.0005,rightContinues:!!right&&right.start<st-.0005})}return out}

function recordTable(){const rows=pairedRows(state.records);return `<div class="tablewrap"><table class="bimanual-table"><thead><tr><th rowspan="2">N.º</th><th rowspan="2">Inicio</th><th rowspan="2">Fin</th><th rowspan="2">Duración</th><th class="lefthead" colspan="4">MANO IZQUIERDA</th><th class="righthead" colspan="4">MANO DERECHA</th></tr><tr><th class="lefthead">Descripción</th><th class="lefthead">Therblig</th><th class="lefthead">Tiempo</th><th class="lefthead">Editar</th><th class="righthead">Descripción</th><th class="righthead">Therblig</th><th class="righthead">Tiempo</th><th class="righthead">Editar</th></tr></thead><tbody>${rows.length?rows.map((r,i)=>`<tr><td>${i+1}</td><td>${fmt(r.start)}</td><td>${fmt(r.end)}</td><td>${fmt(r.end-r.start)} s</td>${pairedCell(r.left,r.leftContinues,r)}${pairedCell(r.right,r.rightContinues,r)}</tr>`).join(''):'<tr><td colspan="12">Aún no hay actividades registradas. Marca un intervalo y registra las acciones de ambas manos.</td></tr>'}</tbody></table></div><p class="muted">${rows.length} intervalos visibles · ${state.records.length} acciones registradas. Los movimientos de sostener o demora que continúan sin interrupción en intervalos consecutivos se contabilizan una sola vez. Las dos manos comparten la misma escala de tiempo.</p><div class="footer-flex"><button class="secondary" onclick="exportXlsx(state.records,'Avance_Registro_Therbligs.xlsx')">↓ Descargar tabla bimanual</button></div>`}
function pairedCell(r,continuous,row){if(!r)return '<td class="pending">Sin registro</td><td>—</td><td>—</td><td>—</td>';return `<td>${continuous?'<span class="small muted">↳ Continúa: </span>':''}${escapeHTML(r.description)}</td><td>${symbol(r.code)} <strong>${r.code}</strong>${continuous?'<br><span class="small muted">Continuación</span>':''}</td><td>${fmt(row.end-row.start)} s</td><td><button class="secondary slim" onclick="editRecord(${r.id})">Editar</button><button class="secondary slim" onclick="removeRecord(${r.id})">×</button></td>`}
function removeRecord(id){if(!confirm('¿Eliminar este movimiento?'))return;state.records=state.records.filter(r=>r.id!==id);save();render()}
function editRecord(id){let a=state.records.find(r=>r.id===id);if(!a)return;if(!confirm('¿Cargar esta acción para editarla? Se retirará temporalmente del registro; vuelve a guardarla después.'))return;state.records=state.records.filter(r=>r.id!==id);save();runtime.start=a.start;runtime.end=a.end;render();const suffix=a.side==='left'?'L':'R';document.getElementById('regcode'+suffix).value=a.code;document.getElementById('regdesc'+suffix).value=a.description;document.getElementById('regnote').value=a.note||'';document.getElementById('regfeedback').innerHTML='<div class="notice warning">Editando la acción seleccionada. Corrige sus datos y pulsa «Agregar actividad de ambas manos» para guardarla otra vez.</div>';}
function scene14(){return header(14,'Diagrama y cálculos','Comprueba los registros, las frecuencias y los tiempos antes de interpretar resultados.')+`<div id="results"></div><div class="footer-flex"><button class="secondary" onclick="downloadDiagram()">↓ Descargar diagrama SVG</button><button class="secondary" onclick="exportXlsx(state.records,'Analisis_Therbligs.xlsx')">↓ Descargar Excel</button></div><div class="notice warning">No confundas la suma de segundos de ambas manos con la duración de la operación: las manos pueden trabajar simultáneamente. El último tiempo registrado solo indica el fin del análisis registrado, no necesariamente que el video se haya analizado por completo.</div>`}
function renderResults(){let el=document.getElementById('results');if(!el)return;if(!state.records.length){el.innerHTML='<div class="notice warning">Todavía no registraste movimientos del video. Vuelve a la escena 13 para empezar.</div>';return}let m=metrics(state.records),ends=state.records.map(r=>r.end),max=Math.max(91.44,...ends);let coverage=coverageInfo(state.records);el.innerHTML=metricHTML(m)+`<h3>Diagrama temporal</h3><div class="timeline" id="graphic">${timelineSVG(state.records,max)}</div><p class="muted">La escala gráfica muestra los 91,44 s del video. Cada bloque representa un movimiento de una mano.</p><h3>Símbolos presentes en el registro</h3><div class="therb-grid">${Object.keys(m.detail).map(c=>`<div class="card" style="display:flex;gap:8px;align-items:center">${symbol(c)} <span><strong>${therb[c].name}</strong><br><span class="muted">${c} · ${therb[c].group==='E'?'Efectivo':'Inefectivo'}</span></span></div>`).join('')}</div><h3>Movimientos por tipo</h3><div class="tablewrap"><table><thead><tr><th>Therblig</th><th>Categoría</th><th>Frecuencia</th><th>Tiempo registrado</th></tr></thead><tbody>${Object.entries(m.detail).sort((a,b)=>b[1].time-a[1].time).map(([c,z])=>`<tr><td>${symbol(c)} ${therb[c].name}</td><td>${therb[c].group==='E'?'Efectivo':'Inefectivo'}</td><td>${z.count}</td><td>${fmt(z.time)} s</td></tr>`).join('')}</tbody></table></div><div class="panel"><strong>Comprobación de cobertura por mano</strong><p>Intervalos no analizados MI: ${fmt(coverage.left)} s · MD: ${fmt(coverage.right)} s sobre la duración de video de 91,44 s.</p><p class="footnote">Los intervalos sin registro requieren revisión: pueden contener espera, sujeción, inactividad fuera del alcance de la tarea o acciones no visibles. No se clasifican automáticamente.</p></div>`}
function coverageInfo(records){function missing(side){let intervals=records.filter(a=>a.side===side).sort((a,b)=>a.start-b.start),t=0;for(let a of intervals){if(a.start>t)t+=0; t=Math.max(t,a.end)}let covered=intervals.reduce((sum,a)=>sum+a.end-a.start,0);return Math.max(0,91.44-covered)}return {left:missing('left'),right:missing('right')}}
function downloadDiagram(){let svg=document.getElementById('graphic')?.querySelector('svg');if(!svg){toast('Primero registra movimientos para generar el diagrama.');return}let txt=svg.outerHTML.replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" ');downloadBlob('Diagrama_Therbligs.svg',new Blob([txt],{type:'image/svg+xml;charset=utf-8'}))}
function scene15(){return header(15,'Propuesta de mejora','La clasificación es el punto de partida, no la conclusión del estudio.')+`<p>Selecciona al menos tres oportunidades de mejora. En cada caso indica <strong>qué movimiento observaste, cuál es el problema, qué cambiarías y cómo comprobarías su efecto</strong>.</p>${[0,1,2].map(i=>`<div class="card"><h3>Mejora ${i+1}</h3><label>Movimiento y mano · evidencia · propuesta · criterio para verificarla</label><textarea style="min-height:128px" oninput="state.improvements[${i}]=this.value;save()" placeholder="Ejemplo orientador: la mano izquierda sostiene la base durante... Propongo evaluar un soporte... Compararía...">${escapeHTML(state.improvements[i]||'')}</textarea></div>`).join('')}<div class="panel gold"><strong>Pregunta de evaluación:</strong> ¿por qué eliminar un movimiento inefectivo no garantiza siempre una mejora? Piensa en inspección, seguridad, sujeción y recuperación de fatiga.</div><label>Reflexión final</label><textarea oninput="state.reflection=this.value;save()" placeholder="Explica cómo cambió tu forma de observar los movimientos de una operación.">${escapeHTML(state.reflection)}</textarea>`}
function scene16(){let complete=state.name&&state.records.length&&state.improvements.every(x=>x.trim().length>20)&&state.reflection.trim().length>20;return header(16,'Entrega del estudio','Revisa lo que construiste, descarga tus archivos y conserva una copia de tu trabajo.')+`<div class="grid3"><div class="metric"><strong>${state.records.length}</strong><span>Movimientos del video registrados</span></div><div class="metric"><strong>${state.improvements.filter(x=>x.trim().length>20).length}/3</strong><span>Mejoras desarrolladas</span></div><div class="metric"><strong>${Object.keys(state.sandwich).length}/11</strong><span>Filas de práctica del sándwich abordadas</span></div></div><div class="panel ${complete?'':'gold'}"><strong>${complete?'Listo para una revisión final.':'Tu informe puede descargarse como avance.'}</strong><p>${complete?'Has registrado movimientos, redactado tres mejoras y presentado tu reflexión. Verifica la coherencia de los intervalos antes de entregar.':'Puedes descargar tus registros en cualquier momento. Para la entrega final, completa los movimientos, las tres propuestas y la reflexión.'}</p></div><div class="grid"><div class="card"><h3>Informe Word (.docx)</h3><p>Portada con tu nombre, tabla de ambas manos, resultados, hallazgos y propuesta de mejora.</p><button onclick="exportDocx()">↓ Descargar Word</button></div><div class="card"><h3>Registro Excel (.xlsx)</h3><p>Todos los movimientos, intervalos, códigos, tiempos, categoría e indicadores.</p><button onclick="exportXlsx(state.records,'Registro_Therbligs_Final.xlsx')">↓ Descargar Excel</button></div><div class="card"><h3>Diagrama (.svg)</h3><p>Gráfico vectorial del análisis temporal de ambas manos.</p><button onclick="exportSvgFromRecords()">↓ Descargar diagrama</button></div><div class="card"><h3>Respaldo (.json)</h3><p>Archivo de recuperación con tus respuestas y registros. No contiene el video.</p><div class="footer-flex"><button onclick="downloadBackup()">↓ Respaldo</button><button class="secondary" onclick="document.getElementById('backupinput').click()">Importar</button></div><input id="backupinput" type="file" accept=".json,application/json" hidden onchange="importBackup(this)"></div></div><div class="panel"><strong>Importante:</strong> abrir el laboratorio desde GitHub Pages o Netlify no envía automáticamente respuestas ni notas a Moodle. Debes entregar los archivos descargados según las instrucciones de la docente.</div><div class="footer-flex"><button onclick="if(confirm('¿Marcar tu trabajo como revisado?')){state.finalized=true;save();toast('Trabajo marcado como revisado; descarga tus archivos para entregar.')}" ${complete?'':'disabled'}>Marcar como revisado</button><button class="secondary" onclick="if(confirm('¿Borrar todos los avances de este dispositivo? Esta acción no se puede deshacer.')){localStorage.removeItem(KEY);state=initial();render()}">Nuevo estudiante / borrar datos</button></div>`}
