function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){notify('El navegador no pudo guardar el progreso. Puedes descargar tu trabajo.');} updateProgress()}
function notify(message){const x=id('toast');x.textContent=message;x.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>x.classList.add('hidden'),4300)}
const intro=(n,title,desc,time=10)=>`<div class="topline"><span>${STAGES[n<6?0:n<11?1:2]} · Escena ${n+1} de 15</span><span>◷ ${time} min</span></div><div class="brief"><div><div class="eyebrow">Laboratorio virtual · POE</div><h2>${title}</h2><p class="muted">${desc}</p></div><div class="stage-number">${String(n+1).padStart(2,'0')}</div></div>`;
const box=(title,content,clazz='')=>`<section class="paper ${clazz}">${title?`<h3>${title}</h3>`:''}${content}</section>`;
function feedback(ok,msg){return `<div class="feedback ${ok===false?'bad':ok===null?'neutral':''}" role="status">${msg}</div>`}
function fld(id,label,value='',hint='',type='text',attrs=''){return `<div class="field"><label for="${id}">${label}</label>${type==='textarea'?`<textarea id="${id}" ${attrs}>${esc(value)}</textarea>`:`<input id="${id}" type="${type}" value="${esc(value)}" ${attrs}>`}${hint?`<div class="micro">${hint}</div>`:''}</div>`}
function sel(id,label,options,selected,attrs=''){return `<div class="field"><label for="${id}">${label}</label><select id="${id}" ${attrs}><option value="">Seleccionar</option>${options.map(x=>`<option value="${esc(x[0])}" ${selected===x[0]?'selected':''}>${esc(x[1])}</option>`).join('')}</select></div>`}
function chradio(group,options,selected,inline=false){return options.map(([value,label])=>`<label class="choice ${selected===value?'checked':''}"><input type="radio" name="${group}" value="${esc(value)}" ${selected===value?'checked':''}> <span>${label}</span></label>`).join('')}
function stepsFooter(){return `<nav class="step-buttons" aria-label="Navegación de escenas"><button class="btn secondary" type="button" data-go="${Math.max(0,state.scene-1)}" ${state.scene===0?'disabled':''}>← Anterior</button><span class="micro">${state.completed[state.scene]?'✓ Actividad completada':'Puedes regresar a revisar tu trabajo'}</span><button class="btn gold" type="button" data-go="${Math.min(14,state.scene+1)}" ${state.scene===14?'disabled':''}>Siguiente →</button></nav><div class="scene-footer">Mg. Vicky Ruiz</div>`}
function complete(n){state.completed[n]=true;persist()}
function canNavigate(target){if(target!==0&&!state.name.trim()){notify('Registra primero tus nombres y apellidos en la portada.');return false}return true}
function go(n){if(!canNavigate(n))return;state.scene=Math.min(14,Math.max(0,n));persist();render();window.scrollTo({top:0,behavior:'instant'})}
function updateProgress(){const count=Object.keys(state.completed).filter(x=>state.completed[x]).length;id('overallProgress').style.width=(count/15*100)+'%';id('overallLabel').textContent=count+' / 15';id('mobileCounter').textContent=(state.scene+1)+' / 15';const nav=id('sceneIndex');nav.innerHTML=TITLES.map((t,i)=>`<button type="button" class="scene-link ${state.scene===i?'active':''} ${state.completed[i]?'complete':''}" data-go="${i}"><span class="bubble">${state.completed[i]?'✓':i+1}</span><span>${t}</span></button>`).join('');id('sideStudent').textContent=state.name?state.name:'Estudiante sin registrar';}
function render(){const n=state.scene;const methods=[scene1,scene2,scene3,scene4,scene5,scene6,scene7,scene8,scene9,scene10,scene11,scene12,scene13,scene14,scene15];S.innerHTML=methods[n]()+stepsFooter();updateProgress();bindScene(n);}
function scene1(){return `<div class="hero"><div class="hero-inner"><div class="eyebrow">Laboratorio de Ingeniería Industrial</div><h1>Del caos al estándar</h1><p style="font-size:1.35rem;font-weight:750;color:#f6dc9c">Tú decides cómo se trabaja.</p><p>¿Qué pasaría si cada trabajador hiciera las cosas a su manera? Tu misión es analizar un proceso, elaborar un POE, probar sus instrucciones y evaluar sus resultados.</p><div class="actions"><span class="tag gold">15 escenas</span><span class="tag gold">3 h 22 min aprox.</span><span class="tag gold">Producto: tu propio POE</span></div></div></div>${box('Registra tu nombre para comenzar',`<p>Tu nombre aparecerá en el procedimiento y en las evidencias descargadas. Es obligatorio para continuar.</p>${fld('studentName','Nombres y apellidos',state.name,'Escribe el nombre que quieres que figure en tus archivos.')}<div class="gr"><div class="field"><label>Programa</label><input type="text" value="Ingeniería Industrial" readonly></div><div class="field"><label>Asignatura</label><input type="text" value="Métodos y Tiempos" readonly></div></div><p class="micro">Privacidad: tu avance y tu nombre se conservan localmente en este navegador; esta página no los transmite a ningún servidor. Puedes borrar el progreso desde el índice.</p><button class="btn gold" id="startBtn">Aceptar misión y comenzar →</button>`,'goldline')}${box('¿Qué aprenderás?',`<div class="gr three">${[['01','Comprender','Qué es un POE y cómo se relaciona con los métodos.'],['02','Diseñar','Redactar instrucciones, controles y registros.'],['03','Comprobar','Simular, auditar y mejorar usando evidencias.']].map(r=>`<div><div class="eyebrow">${r[0]}</div><h3>${r[1]}</h3><p class="mini">${r[2]}</p></div>`).join('')}</div>`)}`}
function scene2(){const items=[['noinspect','No revisan el contenido antes de cerrar la bolsa.'],['experience','Cada persona decide a partir de su experiencia.'],['late','Las diferencias se detectan demasiado tarde.'],['moreworkers','Participan varios trabajadores.'],['transparent','Se usan bolsas transparentes.']];const a=state.scene2;return intro(1,'Una empresa, dos formas de trabajar','Primero conoce el problema; después observa los turnos y toma una decisión.',11)
+box('Conoce el caso: Distribuciones Horizonte',`<div class="callout"><b>Situación ficticia:</b> Distribuciones Horizonte prepara kits escolares por lotes, a partir de órdenes de fabricación. Cada kit debe llevar <b>exactamente un lápiz, un borrador y un sacapuntas</b>, en una <b>bolsa transparente, íntegra, cerrada y con etiqueta legible</b> que muestre el código de la orden.</div><p>En las últimas entregas se encontraron kits incompletos y etiquetas incorrectas. El problema no es que todos los trabajadores sean descuidados: <b>la empresa no ha definido ni comprobado un método común de empaque y control</b>.</p><p><b>Tu misión:</b> leer cómo se trabaja en dos turnos, identificar hechos observables y diferenciar un método más controlado de un método realmente probado.</p><div class="coach-step"><strong>Antes de responder</strong><span>Conoce los requisitos → lee las dos situaciones → selecciona únicamente los problemas sustentados en el relato.</span></div>`,'goldline')
+`<div class="gr">${box('Turno A · Trabajo sin controles definidos',`<div class="workbench"><div class="supply">📦<span>Orden recibida</span></div><div class="supply">✏️<span>Empaque</span></div><div class="supply">❔<span>Sin revisión fija</span></div></div><p>Los operarios reciben la orden y empiezan a empacar. Cada persona organiza la tarea según su experiencia. <b>Algunos cierran la bolsa sin verificar las tres piezas</b>; tampoco hay una inspección final asignada. <b>Solo al finalizar el turno</b> se descubren kits incompletos y etiquetas equivocadas, que deben revisarse nuevamente.</p>`)}${box('Turno B · Controles de ejecución definidos',`<div class="workbench"><div class="supply">📄<span>Orden</span></div><div class="supply">🔎<span>Comprobación</span></div><div class="supply">🏷️<span>Etiqueta</span></div><div class="supply">☑️<span>Registro</span></div></div><p>Los operarios consultan la orden, confirman la disponibilidad de materiales y comprueban las piezas antes de cerrar. Un verificador revisa <b>contenido, cierre y etiqueta</b>. Si algo no cumple, el kit se separa para tratamiento y se registra lo ocurrido.</p><p class="micro">Esta comparación ilustra dos maneras de trabajar; todavía no demuestra cuál produce mejores resultados medidos.</p>`)}</div>`
+box('Identifica los hechos del turno A',`<p><b>Instrucción:</b> marca los tres problemas descritos expresamente en el relato del turno A. No selecciones características que, por sí mismas, no son fallas.</p>${items.map(([v,t])=>`<label class="choice"><input type="checkbox" data-problem="${v}" ${a.checked.includes(v)?'checked':''}><span>${t}</span></label>`).join('')}<div class="actions"><button class="btn" id="checkProblems">Comprobar y explicar</button></div><div id="problemsFeedback"></div>`)
+box('Decisión profesional: ¿podemos decir que B es el mejor?',`<p>El turno B tiene controles más claros. <b>Pero todavía no se han comparado suficientes tiempos, resultados, riesgos ni costos</b>. ¿Podemos afirmar que ya utiliza el mejor método posible?</p>${chradio('scene2q',[['yes','Sí, porque un procedimiento escrito demuestra que es el mejor.'],['no','No necesariamente: todavía se debe analizar y probar su desempeño.'],['perfect','Sí, porque usar controles evita todos los errores.']],a.answer)}<div id="s2Feedback">${a.answer?feedback(a.answer==='no',a.answer==='no'?'Correcto: disponer de instrucciones no prueba que el método sea el mejor.':'Un documento o un control no demuestran por sí solos superioridad ni eliminan todos los errores.') : ''}</div>`,'goldline')}


const doctype=[['POE','Procedimiento Operativo Estandarizado'],['INS','Instructivo'],['FMT','Formato en blanco'],['REG','Registro diligenciado'],['FLOW','Diagrama de flujo']];
function scene3(){let a=state.scene3;const types=[['Operativo','Empaque y ensamblaje'],['Administrativo','Revisión y autorización de documentos'],['Calidad','Inspecciones y rechazos'],['Mantenimiento','Revisión planificada de equipos'],['Seguridad','Controles para una tarea definida'],['Saneamiento (POES)','Limpieza y desinfección según el sector'],['Laboratorio','Recepción y manejo de muestras']];const tests=['Documento que establece cómo preparar, verificar y entregar un pedido.','Guía detallada para configurar una impresora de etiquetas.','Hoja vacía para registrar inspecciones.','Hoja diligenciada que evidencia inspecciones efectuadas.','Representación gráfica de rutas de aceptación y rechazo.'];const docs=[['POE','Indica cómo ejecutar y controlar un proceso, sus responsables, registros y respuestas ante fallas.','Procedimiento para recibir, preparar, verificar y despachar kits.'],['Instructivo','Explica con detalle cómo hacer una tarea puntual que puede formar parte de un POE.','Guía para configurar la impresora de etiquetas.'],['Formato','Plantilla todavía vacía, destinada a recoger datos en una actividad futura.','Hoja sin completar con campos: orden, kits revisados, conformes.'],['Registro','Información ya diligenciada y conservada como evidencia de lo que ocurrió.','La misma hoja anterior, con fecha, cantidades y responsable.'],['Diagrama de flujo','Dibuja visualmente actividades y decisiones mediante símbolos y flechas.','Rombo «¿Kit conforme?» y ramas Sí / No.']];return intro(2,'¿Qué es realmente un POE?','Primero compara documentos con ejemplos; después practica su clasificación.',12)
+box('La función del POE',`<p>Un <b>Procedimiento Operativo Estandarizado (POE)</b> es un documento controlado que explica cómo ejecutar una actividad: <b>quién</b> interviene, <b>qué</b> recursos y condiciones se necesitan, <b>cómo</b> actuar, <b>qué</b> verificar, <b>qué registros</b> conservar y <b>cómo</b> responder si algo sale mal.</p><div class="gr three">${[['Estandarizar','Definir un método conocido y sus condiciones.'],['Reproducibilidad','Conseguir ejecuciones consistentes en condiciones equivalentes.'],['Control','Verificar criterios y responder a desviaciones.']].map(x=>`<div class="metric"><b>${x[0]}</b><p class="mini">${x[1]}</p></div>`).join('')}</div><div class="callout warning">El POE puede ayudar a reducir errores, pero <b>no prueba por sí solo que el método sea el mejor</b>, ni existe una plantilla única obligatoria para todos los sectores.</div>`)
+box('Aprende la diferencia entre cinco documentos',`<p><b>Instrucción:</b> abre y lee los cinco tipos. Todos los ejemplos se refieren a la preparación de kits escolares que acabas de conocer.</p><div class="gr">${docs.map((d,i)=>`<div class="definition-card"><div class="eyebrow">${i+1}. ${d[0]}</div><p>${d[1]}</p><div class="micro"><b>Ejemplo:</b> ${d[2]}</div></div>`).join('')}</div><div class="callout"><b>Ejemplo guiado:</b> imagina una hoja que dice «Fecha: ___ / Kits inspeccionados: ___». Mientras esté vacía es un <b>formato</b>. Cuando registras «02/11/2026; 100 kits; 92 conformes a la primera» y la conservas, se convierte en un <b>registro</b>. El documento que indica cuándo y cómo hacer esa inspección es el <b>POE</b>.</div>`)
+box('¿En qué actividades se aplican?',`<div class="gr">${types.map(x=>`<div class="icon-row"><div class="square-icon">◈</div><div><b>${x[0]}</b><div class="mini">${x[1]}</div></div></div>`).join('')}</div><p class="micro">Estas son categorías funcionales de uso común; los requisitos sectoriales dependen de cada actividad.</p>`)
+box('Ahora sí: clasifica los documentos',`<p>Ya conoces las cinco categorías. <b>Lee cada ejemplo</b>, selecciona el tipo y presiona «Evaluar». Si te equivocas, compara con la explicación superior e inténtalo de nuevo.</p>${tests.map((t,i)=>`<div class="check-card"><div><b>${i+1}.</b> ${t}</div>${sel('dtype'+i,'Tipo de documento',doctype,a.classify[i]||'')}</div>`).join('')}<div class="actions"><button class="btn" id="checkDocType">Evaluar clasificación</button></div><div id="dtypeFeedback"></div>`,'petrolline')}


const methodSteps=['Seleccionar la actividad por frecuencia, impacto o riesgo.','Observar y registrar el método real.','Examinar críticamente errores, movimientos y esperas.','Diseñar y probar un método viable y seguro.','Definir responsables, controles y evidencias.','Redactar, revisar y aprobar el POE cuando corresponda.','Capacitar y verificar la aplicación del método.','Medir resultados, corregir y actualizar.'];
function reorderHTML(items,key){return items.map((s,i)=>`<div class="ordered-row"><span class="ord">${i+1}.</span><span class="ord-text">${esc(s)}</span><button class="arrow-btn" type="button" data-up="${key}:${i}" ${i===0?'disabled':''} aria-label="Subir actividad ${i+1}">↑</button><button class="arrow-btn" type="button" data-down="${key}:${i}" ${i===items.length-1?'disabled':''} aria-label="Bajar actividad ${i+1}">↓</button></div>`).join('')}
function ensureOrder(key,source){if(!state[key].order.length){state[key].order=key==='scene4'?[0,2,1,4,3,5,7,6]:[0,2,1,3,5,4,6];persist()}}
function scene4(){ensureOrder('scene4',methodSteps);return intro(3,'Antes de estandarizar, hay que mejorar','Observa el orden técnico, estudia un ejemplo y luego organiza las etapas.',13)
+box('¿Qué hace cada herramienta?',`<div class="gr three">${[['🔎','Estudio de métodos','Analiza el trabajo y propone cómo conviene ejecutarlo.'],['📋','POE','Documenta cómo ejecutar y controlar el método definido.'],['⏱️','Estudio de tiempos','Establece tiempos de referencia mediante la técnica de medición apropiada.']].map(x=>`<div class="metric"><div style="font-size:1.7rem">${x[0]}</div><b>${x[1]}</b><p class="mini">${x[2]}</p></div>`).join('')}</div><p>Los cursogramas y diagramas de recorrido, bimanuales y hombre–máquina ayudan a descubrir operaciones, transportes, esperas y movimientos innecesarios. <b>Primero se analiza y se prueba el método; luego se documenta.</b></p>`)
+box('Así se construye y mantiene un POE',`<p><b>Observa este diagrama de secuencia antes de realizar el ejercicio.</b> La flecha muestra el orden recomendado para pasar de la identificación de un proceso a su revisión continua.</p><div class="sequence-steps">${methodSteps.map((x,i)=>`<div class="sequence-item"><span class="sequence-number">${i+1}</span><div><b>${['Seleccionar','Observar','Examinar','Diseñar y probar','Definir controles','Documentar y aprobar','Capacitar','Medir y mejorar'][i]}</b><p class="mini">${x}</p></div></div>`).join('')}</div><div class="callout"><b>¿Por qué este orden?</b> No podemos examinar lo que no hemos observado; no debemos estandarizar un método antes de probarlo; y después de documentarlo debemos capacitar, verificar y mejorar su aplicación.</div>`)
+box('Ejemplo guiado de dos etapas',`<p><b>Situación:</b> observas que los kits recorren una distancia innecesaria porque los materiales están alejados de la mesa. <b>Primero</b> registras el recorrido (observación) y analizas sus causas (examen crítico). <b>Después</b> pruebas una redistribución (diseño y prueba). Solo cuando se define el método viable se redactan las instrucciones del POE.</p>`)
+box('Tu turno: organiza la secuencia',`<p>Después de consultar el diagrama anterior, utiliza las flechas para poner estas ocho acciones en orden. Puedes volver a mirar el esquema mientras trabajas.</p><div id="methodOrder">${reorderHTML(state.scene4.order.map(i=>methodSteps[i]),'method')}</div><div class="actions"><button class="btn" id="checkMethodOrder">Comprobar secuencia</button><button class="btn secondary" id="resetMethodOrder">Mezclar nuevamente</button></div><div id="methodFeedback"></div>`)
+box('Antes de responder: ¿qué es tiempo estándar?',`<p><b>Tiempo observado:</b> duración medida en una ejecución concreta. Si una persona arma un kit en 95 segundos, 95 s es un dato observado.</p><p><b>Tiempo normal:</b> tiempo de referencia obtenido cuando la técnica requiere valorar el ritmo del operario.</p><p><b>Tiempo estándar:</b> tiempo determinado para un método de trabajo definido, mediante un estudio pertinente que contempla el tiempo normal y los <b>suplementos justificados</b> (por ejemplo, necesidades personales y fatiga), según la técnica y condiciones.</p><div class="mini-process"><span>Definir método</span><b>→</b><span>Medir varias ejecuciones</span><b>→</b><span>Determinar tiempo normal, si aplica</span><b>→</b><span>Incorporar suplementos</span><b>→</b><span>Establecer referencia</span></div><div class="callout"><b>Ejemplo:</b> una única observación de 95 segundos no informa si el ritmo fue representativo ni cuáles suplementos se justifican. No permite declarar un tiempo estándar.</div><p><b>Pregunta:</b> un trabajador tardó 95 segundos en completar un kit. ¿Podemos afirmar que ese es el tiempo estándar?</p>${chradio('timeStandard',[['si','Sí, porque está expresado en segundos.'],['no','No. Una observación aislada no equivale a un tiempo estándar.'],['sup','Sí, si lo dice el supervisor.']],state.scene4.answer)}<div id="s4Feedback"></div>`,'goldline')
+box('¿Qué pasa después de documentar?',`<div class="gr">${[['TWI · Formación en el puesto','Preparar a la persona, demostrar el trabajo y sus puntos clave, permitir que practique y comprobar su ejecución. Sirve para enseñar el método del POE.'],['PHVA · Mejora continua','Planear el método y controles, ejecutarlos, verificar resultados y actuar corrigiendo o actualizando. Sirve para evitar que el POE quede obsoleto.']].map(x=>`<div class="definition-card"><b>${x[0]}</b><p>${x[1]}</p></div>`).join('')}</div><p class="micro">TWI y PHVA no sustituyen al POE: son enfoques complementarios para capacitar y sostener la mejora.</p>`)}


const acts=['Despacho de pedidos','Archivo de facturas','Ajuste de equipo'];
function scene5(){const st=state.scene5;const examples=[['Despacho de pedidos','Se realiza varias veces al día. Hay errores de cantidad y referencias; los turnos no siempre verifican igual. Se presentan devoluciones y reprocesos.','Impacto relevante; alta frecuencia; métodos variables.'],['Archivo de facturas','Se realiza una vez al día. Algunas facturas se archivan mal, con demoras de consulta. La forma de archivar es relativamente uniforme.','Impacto moderado; frecuencia habitual; poca variación.'],['Ajuste de equipo','Se realiza aproximadamente una vez al mes. Diferentes técnicos usan secuencias distintas. Si el ajuste es incorrecto, una persona podría sufrir lesiones graves.','Impacto crítico de seguridad; frecuencia baja; variación importante.']];return intro(4,'¿Qué actividad documentarías primero?','Conoce la empresa, aprende la escala, calcula y justifica tu decisión.',15)
+box('Misión empresarial · Distribuciones Horizonte',`<p><b>Caso ficticio:</b> la empresa despacha pedidos, archiva facturas y ajusta equipos para sus operaciones. La gerencia necesita priorizar qué actividades estudiar y documentar. Tú analizarás <b>tres tareas diferentes</b>, utilizando datos ilustrativos de su funcionamiento.</p><p><b>Importante:</b> una puntuación no reemplaza la identificación de peligros ni los controles de seguridad. Si existe un peligro grave, debe atenderse conforme a su evaluación técnica, con independencia del lugar que ocupe en esta matriz didáctica.</p><div class="gr">${examples.map((x,i)=>`<div class="definition-card"><div class="eyebrow">Actividad ${i+1}</div><h3>${x[0]}</h3><p>${x[1]}</p><div class="micro"><b>Pista para valorar:</b> ${x[2]}</div></div>`).join('')}</div>`)
+box('Aprende los criterios y su escala',`<p>Para este ejercicio, cada criterio se valora de <b>1 a 5</b>. Impacto es la gravedad de una falla, frecuencia es cuántas veces se ejecuta la actividad y variabilidad es cuánto difiere su ejecución entre personas.</p><div class="table-wrap"><table><thead><tr><th>Puntaje</th><th>Impacto (I)</th><th>Frecuencia (F)</th><th>Variabilidad (V)</th></tr></thead><tbody>${[['1','Consecuencia menor','Muy esporádica','Forma de trabajar casi idéntica'],['2','Consecuencia baja','Mensual','Diferencias poco frecuentes'],['3','Consecuencia moderada','Semanal','Algunas diferencias'],['4','Consecuencia alta','Diaria','Diferencias frecuentes'],['5','Consecuencia crítica','Varias veces al día','Diferencias muy marcadas']].map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="micro">Esta escala se diseñó exclusivamente para aprender a priorizar en el caso; no constituye una metodología formal de valoración de riesgos.</p>`)
+box('Primero, un ejemplo resuelto',`<p>Una actividad de revisión de suministros de oficina tiene <b>impacto bajo (2)</b>, se realiza <b>semanalmente (3)</b> y tiene <b>poca variabilidad (2)</b>.</p><div class="equation">Puntaje = I × F × V = 2 × 3 × 2 = <strong>12</strong></div><p>El número 12 sirve para comparar prioridades dentro de <b>esta misma escala</b>; no mide la probabilidad de una lesión ni garantiza que una actividad sea segura.</p>`)

function scene6(){return intro(5,'Anatomía de un POE','Descubre qué debe contener un procedimiento claro y controlado.',10)+box('Un POE responde preguntas concretas',`<p>¿Qué se realiza? ¿Dónde empieza y termina? ¿Quién interviene? ¿Cómo se ejecuta? ¿Qué se controla? ¿Qué hacer si hay problemas? ¿Qué evidencia queda?</p><p>No existe una plantilla universal obligatoria para todas las empresas. La extensión depende de la complejidad, riesgo y requisitos aplicables.</p><div id="anatomyList">${anatomy.map((x,i)=>`<details class="accordion" data-anatomy="${i}" ${state.scene6.seen.includes(i)?'open':''}><summary>${i+1}. ${x[0]}</summary><div>${x[1]}</div></details>`).join('')}</div>`)+box('Ejemplo de identificación',`<div class="doc-preview"><div class="eyebrow">POE-EMP-001 · Versión 00</div><h3>Preparación de kits escolares</h3><p><b>Estado:</b> borrador didáctico pendiente de prueba y aprobación.</p><h4>Objetivo</h4><p>Preparar kits completos, identificados y con registro de conformidad.</p><h4>Alcance</h4><p>Desde la recepción de la orden y los materiales hasta la entrega de kits conformes a despacho y registro del lote.</p></div>`)+box('¿Dónde ubicarías la información?',`${anatomyQ.map(([s],i)=>`<div class="check-card"><span><b>${i+1}.</b> ${s}</span>${sel('anatomy'+i,'Apartado',anatomy.map((x,j)=>[String(j),x[0]]),state.scene6.classify[i]||'')}</div>`).join('')}<div class="actions"><button class="btn" id="checkAnatomy">Revisar clasificación</button></div><div id="anatomyFeedback"></div>`,'petrolline')}
const questions=[{q:'¿Cuál es la finalidad principal de un POE?',o:['Guardar una descripción del trabajo sin revisarla.','Establecer cómo ejecutar y controlar un método definido.','Eliminar toda posibilidad de error.'],a:1,why:'El POE establece instrucciones, responsables y controles. Su existencia no elimina por sí sola los errores.'},{q:'¿Qué debe hacerse antes de documentar un método como estándar?',o:['Analizarlo y probar las mejoras necesarias.','Copiar el procedimiento de otra empresa.','Registrar el método más rápido sin examinarlo.'],a:0,why:'Documentar un método deficiente puede perpetuar sus problemas. Primero se analiza y se prueba.'},{q:'¿Cuál de estos documentos constituye un registro?',o:['Una lista de inspección en blanco.','Una instrucción para empacar.','Una lista diligenciada que evidencia inspecciones.'],a:2,why:'El formato recoge información; el registro conserva evidencia de lo que ocurrió.'},{q:'¿Cuál instrucción es más verificable?',o:['Revisar bien el kit.','Comprobar que contiene un lápiz, un borrador y un sacapuntas.','Verificar que todo esté adecuado.'],a:1,why:'Una instrucción verificable indica acciones y criterios comprobables.'},{q:'Si un producto no cumple un criterio de aceptación, el POE debe indicar:',o:['La respuesta, el responsable y el registro correspondiente.','Solamente que el trabajador tenga cuidado.','Que se entregue y se revise después.'],a:0,why:'Una desviación requiere una ruta clara para evitar que el problema continúe sin control.'},{q:'¿Qué diferencia a un POES?',o:['Es cualquier POE digital.','Es un procedimiento de saneamiento según el sector aplicable.','Es exclusivo de áreas administrativas.'],a:1,why:'Los POES están vinculados al saneamiento y su alcance depende de la regulación aplicable.'},{q:'¿Un tiempo observado se vuelve tiempo estándar al escribirlo en un POE?',o:['Sí, si se expresa en segundos.','Sí, si lo aprueba un supervisor.','No, requiere una determinación técnica pertinente.'],a:2,why:'El tiempo estándar no es simplemente cualquier tiempo observado.'},{q:'¿Qué debe ocurrir cuando se modifica un POE?',o:['Utilizar simultáneamente todas las versiones.','Controlar el cambio, revisarlo, aprobarlo y comunicarlo cuando corresponda.','Cambiar el archivo sin registrar modificaciones.'],a:1,why:'Debe identificarse la versión vigente y mantenerse trazabilidad de los cambios.'}];

function basePOE(){return {organization:'Distribuciones Horizonte · Área de empaque',title:'Preparación y control de kits escolares',code:'POE-EMP-001',version:'00',date:'',valid:'',objective:'',scope:'',definitions:'',responsibles:'',references:'',inputs:'',resources:'',risks:'',outputs:'',deviations:[{s:'Faltante de material',action:'',owner:'',record:''},{s:'Etiqueta incorrecta',action:'',owner:'',record:''},{s:'Kit no conforme después de reinspección',action:'',owner:'',record:''}],indicators:[{name:'Calidad a la primera',formula:'',frequency:'',owner:''},{name:'Tasa de reproceso',formula:'',frequency:'',owner:''}],records:'',annexes:'',location:'',review:'',approval:'',changes:'Emisión inicial como borrador académico.',steps:state.scene9.checked&&state.scene9.order.length?state.scene9.order.map(i=>({who:'',instruction:stepsDefault[i],control:''})):stepsDefault.map(x=>({who:'',instruction:x,control:''}))};}
function ensurePoe(){if(!state.poe)state.poe=basePOE();}
const tabs=['1. Identifica','2. Prepara','3. Ejecuta y controla','4. Demuestra y revisa'];
function editorInput(key,label,hint='',large=false){return fld('poe-'+key,label,state.poe[key]||'',hint,large?'textarea':'text','data-poe="'+key+'"')}
function poeQuality(){const p=state.poe||basePOE(),needed=['organization','title','code','version','objective','scope','responsibles','inputs','resources','risks','outputs','records','changes','location'];const missing=needed.filter(k=>!String(p[k]||'').trim());const fail=p.steps.filter(r=>!r.who.trim()||!r.instruction.trim()||!r.control.trim());const dev=p.deviations.filter(r=>!r.s.trim()||!r.action.trim()||!r.owner.trim()||!r.record.trim());const ind=p.indicators.filter(r=>!r.name.trim()||!r.formula.trim()||!r.frequency.trim()||!r.owner.trim());return {missing,fail,dev,ind,valid:missing.length===0&&fail.length===0&&dev.length===0&&ind.length===0}}
function scene10(){ensurePoe();let p=state.poe,tab=state.editorTab;let content='';if(tab===0)content=`<div class="gr">${editorInput('organization','Organización / área')}${editorInput('title','Nombre del POE')}${editorInput('code','Código')}${editorInput('version','Versión del borrador')}${editorInput('date','Fecha de elaboración (opcional)')}${editorInput('valid','Fecha de vigencia (si estuviera aprobada)','Deja en blanco si aún no existe aprobación.')}</div>${editorInput('objective','Objetivo','¿Qué resultado específico busca asegurar el procedimiento?',true)}${editorInput('scope','Alcance','Indica inicio, fin, áreas y exclusiones del procedimiento.',true)}${editorInput('definitions','Definiciones necesarias','Incluye únicamente términos que podrían interpretarse de varias maneras.',true)}`;
if(tab===1)content=`${editorInput('responsibles','Responsables y autorizaciones','¿Quién ejecuta, verifica y decide ante las fallas?',true)}${editorInput('references','Documentos y referencias aplicables','No inventes requisitos o normas. Puedes escribir “Por verificar”.',true)}${editorInput('inputs','Entradas','Orden, materiales, información requerida.',true)}${editorInput('resources','Recursos y condiciones previas','Herramientas, puesto y condiciones necesarias.',true)}${editorInput('risks','Riesgos y precauciones','Advertencias relevantes antes del paso que presenta el riesgo.',true)}`;
if(tab===2)content=`<div class="callout">Una instrucción insuficiente dice «revisar bien». Una instrucción verificable dice «comparar contenido, cierre y etiqueta con los requisitos de la orden». Cada paso necesita responsable, control y ruta ante desviaciones.</div><div class="table-wrap"><table><thead><tr><th>Pas.</th><th>Responsable</th><th>Instrucción observable</th><th>Control / evidencia / si falla</th><th></th></tr></thead><tbody>${p.steps.map((x,i)=>`<tr><td>${String(i+1).padStart(2,'0')}</td><td><textarea data-step="${i}:who" aria-label="Responsable paso ${i+1}">${esc(x.who)}</textarea></td><td><textarea data-step="${i}:instruction" aria-label="Instrucción paso ${i+1}">${esc(x.instruction)}</textarea></td><td><textarea data-step="${i}:control" aria-label="Control paso ${i+1}">${esc(x.control)}</textarea></td><td><button class="btn danger small" data-remove-step="${i}" aria-label="Eliminar paso ${i+1}">×</button></td></tr>`).join('')}</tbody></table></div><button class="btn secondary small" id="addStep">+ Agregar paso</button><h3 style="margin-top:20px">Tratamiento de desviaciones</h3><div class="table-wrap"><table><thead><tr><th>Situación</th><th>Acción inmediata</th><th>Autoriza</th><th>Registro</th><th></th></tr></thead><tbody>${p.deviations.map((r,i)=>`<tr>${[['s','Situación'],['action','Acción'],['owner','Autoriza'],['record','Registro']].map(([k,label])=>`<td><textarea data-dev="${i}:${k}" aria-label="${label} ${i+1}">${esc(r[k])}</textarea></td>`).join('')}<td><button class="btn danger small" data-remove-dev="${i}">×</button></td></tr>`).join('')}</tbody></table></div><button class="btn secondary small" id="addDev">+ Agregar desviación</button>`;
if(tab===3)content=`${editorInput('outputs','Salidas y criterios de aceptación','Define qué se entrega y cómo se comprueba conformidad.',true)}<h3>Indicadores de seguimiento</h3><div class="table-wrap"><table><thead><tr><th>Indicador</th><th>Fórmula / fuente</th><th>Frecuencia</th><th>Responsable</th></tr></thead><tbody>${p.indicators.map((r,i)=>`<tr>${[['name','Nombre'],['formula','Fórmula y fuente'],['frequency','Frecuencia'],['owner','Responsable']].map(([k,l])=>`<td><textarea data-ind="${i}:${k}" aria-label="${l} ${i+1}">${esc(r[k])}</textarea></td>`).join('')}</tr>`).join('')}</tbody></table></div>${editorInput('records','Registros, custodia y conservación','Identifica formato, ubicación y reglas aplicables sin inventar plazos.',true)}${editorInput('annexes','Anexos','Diagrama, formatos y ayudas visuales.',true)}${editorInput('location','Ubicación del documento maestro y control de versiones','¿Cómo sabrán los trabajadores cuál es la versión vigente?',true)}${editorInput('changes','Historial de cambios','Versión, cambio, razón y responsable.',true)}<div class="gr">${editorInput('review','Revisión técnica (si corresponde)','Indica “Pendiente” si aún no existe.')}${editorInput('approval','Aprobación (si corresponde)','Este ejercicio no confiere aprobación real.')}</div>`;
return intro(9,'Construye tu propio POE','Con el caso completo a la vista, escribe y revisa el procedimiento.',30)+box('Tu caso de trabajo: Distribuciones Horizonte',`<p><b>¿Sobre qué proceso vas a escribir?</b> Preparación y control de kits escolares en el área de empaque de la empresa ficticia <b>Distribuciones Horizonte</b>. El mismo proceso que analizaste en las escenas 8 y 9.</p><p><b>Antes de empezar:</b> descarga el documento Word. Allí se describen materiales, producto, responsables, observaciones del trabajo, decisiones ante errores, datos de registro y condiciones del proceso. <b>Ese documento es tu fuente de datos.</b> No debes inventar límites de seguridad, obligaciones legales ni tiempos estándar.</p><a class="btn gold" href="recursos/Caso_Completo_POE_Kits_Escolares_Escena_10.docx" download>⬇ Descargar el caso completo para elaborar el POE (Word)</a><div class="callout"><b>Cómo utilizar el editor:</b> <b>Identifica</b> (propósito y alcance) → <b>Prepara</b> (responsables, entradas y riesgos) → <b>Ejecuta y controla</b> (pasos del flujo normal y rutas ante fallas) → <b>Demuestra y revisa</b> (salidas, registros, indicadores y control de versiones). <b>Los datos de identificación son referencias de práctica</b>; escribe las partes técnicas con tus palabras.</div>`,'goldline')+box('Tu documento, paso a paso',`<div class="segment" id="editorTabs">${tabs.map((x,i)=>`<button type="button" class="${tab===i?'active':''}" data-editor-tab="${i}">${x}</button>`).join('')}</div><div id="editorContent">${content}</div><div class="actions"><button class="btn" id="poeCheck">Revisar estructura</button><button class="btn secondary" id="poePreviewBtn">Vista previa</button><button class="btn secondary" id="poeWordBtn">Descargar borrador Word</button></div><div id="poeFeedback"></div>`,'petrolline')+box('Estado del documento',`<div id="poeStatus">${poeStatusHtml()}</div><p class="micro">El sistema identifica campos vacíos, pero no certifica la exactitud técnica de tus respuestas. El POE permanecerá en estado de borrador hasta ser probado, revisado y aprobado donde corresponda.</p><div id="poePreview" class="hidden"></div>`)}
function poeStatusHtml(){let a=poeQuality();return `<div class="gr four"><div class="metric"><label>Campos sin completar</label><strong>${a.missing.length}</strong></div><div class="metric"><label>Pasos incompletos</label><strong>${a.fail.length}</strong></div><div class="metric"><label>Desviaciones incompletas</label><strong>${a.dev.length}</strong></div><div class="metric"><label>Indicadores incompletos</label><strong>${a.ind.length}</strong></div></div>`}
const simulations=[{q:'Faltan borradores para completar la orden. ¿Qué debe hacer el operario?',opts:['Iniciar y entregar kits incompletos.','No iniciar la orden incompleta, registrar el faltante y avisar al supervisor.','Cambiar unilateralmente la especificación.'],a:1,why:'Si faltan materiales, la orden no debe iniciarse como si pudiera cumplirse. Se registra la incidencia y se escala.'},{q:'El código de la etiqueta no coincide con la orden. ¿Qué corresponde?',opts:['Entregar porque el contenido está completo.','Separar el kit, corregir la etiqueta y reinspeccionarlo.','Ignorar el código.'],a:1,why:'La identificación es un criterio de aceptación. El kit debe corregirse y verificarse antes de su liberación.'},{q:'Tras la única reinspección permitida, el kit continúa no conforme.',opts:['Reinspeccionar sin límite.','Entregarlo con una observación verbal.','Mantenerlo identificado y pedir decisión al supervisor.'],a:2,why:'La regla del caso permite una reinspección. Después corresponde la decisión del supervisor.'},{q:'El registro muestra cantidades distintas a los kits contabilizados.',opts:['Detener la entrega del lote, verificar cantidades y comunicar la diferencia.','Cambiar el registro para que cuadre.','Entregar sin comprobar.'],a:0,why:'Es necesario aclarar diferencias antes de finalizar para conservar trazabilidad.'},{q:'El verificador confirma contenido, cierre y etiqueta correctos.',opts:['Contarlo como conforme y registrar el resultado.','Reprocesarlo sin motivo.','Eliminar el registro porque no hubo errores.'],a:0,why:'También los resultados conformes requieren la evidencia establecida en el procedimiento.'}];
function scene11(){let x=state.simulation;return intro(10,'Pon a prueba tu procedimiento','Lee cada incidente, consulta tu POE y decide qué acción corresponde.',15)+box('Antes de la simulación',`<p>Revisa el borrador elaborado en la escena 10. Durante la simulación tendrás que elegir qué hacer <b>según las reglas del caso</b>, indicar si tu POE explica la situación y señalar en qué paso se encuentra la instrucción.</p><div class="actions"><button type="button" class="btn secondary" data-go="9">Consultar o corregir mi POE</button><a class="btn secondary" href="recursos/Caso_Completo_POE_Kits_Escolares_Escena_10.docx" download>Consultar caso Word</a></div>`)+box('Operario nuevo · Simulación de situaciones',`<p>Un operario utiliza el POE que redactaste. Elige cómo actuar y revisa la consecuencia de cada decisión.</p>${simulations.map((s,i)=>`<details class="accordion" ${i===Object.keys(x.answers).length?'open':''}><summary>Caso ${i+1}: ${s.q}</summary><div>${s.opts.map((opt,j)=>`<label class="choice ${String(x.answers[i])===String(j)?'checked':''}"><input type="radio" name="sim${i}" value="${j}" ${String(x.answers[i])===String(j)?'checked':''}><span>${String.fromCharCode(65+j)}. ${opt}</span></label>`).join('')}<div>${x.answers[i]!==undefined?feedback(Number(x.answers[i])===s.a,(Number(x.answers[i])===s.a?'Decisión correcta. ':'Revisa la respuesta. ')+s.why):''}</div><div class="divider"></div><div class="field"><label for="simStep${i}">¿En qué paso de tu POE se respalda esta decisión?</label><select id="simStep${i}"><option value="">Selecciona un paso...</option>${(state.poe?.steps||[]).map((r,j)=>`<option value="${j}" ${String(x.stepRefs?.[i])===String(j)?'selected':''}>Paso ${j+1}: ${esc(r.instruction).slice(0,80)}</option>`).join('')}${(state.poe?.deviations||[]).map((r,j)=>`<option value="dev-${j}" ${x.stepRefs?.[i]===('dev-'+j)?'selected':''}>Desviación ${j+1}: ${esc(r.s).slice(0,70)}</option>`).join('')}<option value="none" ${x.stepRefs?.[i]==='none'?'selected':''}>No está documentado, debo corregir mi POE</option></select></div><p><b>¿Tu POE contempla claramente esta situación?</b></p>${sel('simReview'+i,'Revisión del borrador',[['yes','Sí, puedo identificar el paso'],['no','No, debo completarlo'],['unsure','Necesito revisarlo']],x.review[i]||'')}<button class="btn secondary small" data-go="9">Volver al editor</button></div></details>`).join('')}<div class="actions"><button class="btn" id="finishSimulation">Comprobar mi simulación</button></div><div id="simulationFeedback"></div>`,'goldline')}
function calculate(t,r,c){return {fpy:(t-r)/t*100,rework:r/t*100,final:(t-r+c)/t*100,non:r-c}}
function scene12(){let x=state.calc,err=x.rework>x.total||x.recovered>x.rework||x.total<=0||x.rework<0||x.recovered<0,res=err?null:calculate(x.total,x.rework,x.recovered),answers=x.quiz;return intro(11,'Los números también hablan','Calcula e interpreta los resultados del proceso.',10)+box('Indicadores de un lote',`<p>La <b>calidad a la primera</b> considera los kits conformes sin reproceso. La <b>aceptación final</b> incluye también los recuperados.</p><div class="callout"><b>Ejemplo guiado antes de calcular:</b> se preparan 100 kits; 8 requieren reproceso y 7 de esos 8 se recuperan.<br><b>Paso 1.</b> Conformes a la primera = 100 − 8 = <b>92 kits</b>.<br><b>Paso 2.</b> Calidad a la primera = 92 ÷ 100 × 100 = <b>92 %</b>.<br><b>Paso 3.</b> Tasa de reproceso = 8 ÷ 100 × 100 = <b>8 %</b>.<br><b>Paso 4.</b> Aceptación final = (92 + 7) ÷ 100 × 100 = <b>99 %</b>.<br><b>Paso 5.</b> No conformes finales = 8 − 7 = <b>1 kit</b>. El 99 % no es calidad a la primera: incluye unidades corregidas.</div><div class="gr three"><div class="metric"><b>Calidad a la primera</b><div class="micro">Conformes iniciales ÷ procesados × 100</div></div><div class="metric"><b>Tasa de reproceso</b><div class="micro">Reprocesados ÷ procesados × 100</div></div><div class="metric"><b>Aceptación final</b><div class="micro">(Conformes iniciales + recuperados) ÷ procesados × 100</div></div></div><div class="gr three" style="margin-top:15px">${[['total','Kits preparados'],['rework','Reprocesados'],['recovered','Recuperados']].map(([k,l])=>fld('calc'+k,l,x[k],'','number',`data-calc="${k}" min="0" step="1"`)).join('')}</div><div id="calcOutput">${calcOutput(res,err)}</div><div class="actions"><button class="btn secondary" id="resetCalc">Restablecer ejemplo: 100 kits</button></div>`)+box('Ahora resuelve tú',`<p>Otro lote tiene <b>50 kits preparados</b>, <b>5 que requirieron reproceso</b> y <b>3 recuperados</b>. Escribe cada indicador como porcentaje, sin necesidad de escribir el símbolo %.</p><div class="gr three">${[['fpy','Calidad a la primera'],['rework','Tasa de reproceso'],['final','Aceptación final']].map(([k,l])=>fld('calcQuiz'+k,l,answers[k]??'','','number',`data-calc-quiz="${k}" step="0.01"`)).join('')}</div><div class="field"><label for="calcInterpret">¿El porcentaje de aceptación final es igual al de calidad a la primera?</label><select id="calcInterpret"><option value="">Seleccionar</option><option value="no" ${answers.interpret==='no'?'selected':''}>No: los recuperados no fueron conformes al primer intento.</option><option value="yes" ${answers.interpret==='yes'?'selected':''}>Sí: ambos expresan lo mismo.</option></select></div><button class="btn" id="checkCalcQuiz">Comprobar cálculos e interpretación</button><div id="calcQuizFeedback"></div>`,'goldline')}
function calcOutput(r,err){if(err)return feedback(false,'Los datos no son válidos: 0 ≤ recuperados ≤ reprocesados ≤ total y el total debe ser mayor que cero.');return `<div class="gr three"><div class="metric"><label>Calidad a la primera</label><strong>${r.fpy.toFixed(1)} %</strong></div><div class="metric"><label>Tasa de reproceso</label><strong>${r.rework.toFixed(1)} %</strong></div><div class="metric"><label>Aceptación final</label><strong>${r.final.toFixed(1)} %</strong></div></div><div class="chart" style="margin-top:18px">${[['Calidad inicial',r.fpy],['Aceptación final',r.final]].map(([t,v],i)=>`<div class="chartline"><span>${t}</span><div class="bar-bg"><div class="bar-fill ${i?'gold':''}" style="width:${v}%"></div></div><b>${v.toFixed(1)} %</b></div>`).join('')}</div><p class="micro">Kits no conformes finales: ${r.non}. Los indicadores describen resultados, pero no demuestran por sí solos qué los causó.</p>`}
const auditHints=["¿El nombre identifica el proceso de preparación y control de kits escolares sin confundirlo con otro?", "¿Se ve un código único y la versión del borrador, por ejemplo 00?", "¿Está identificado quién elabora o custodia el procedimiento y quién debería autorizarlo? ¿La autorización sigue pendiente?", "¿Hay una fecha de vigencia realmente aprobada? Si no, marca pendiente; no inventes fechas.", "¿Explicas el resultado buscado, inicio, fin y actividades excluidas?", "¿Identificas orden, materiales, kits conformes, registros y no conformes identificados?", "¿Diferencias las responsabilidades del operario, verificador y supervisor?", "¿Mencionas materiales, mesa, orden y condiciones para iniciar?", "¿La secuencia del texto coincide con el método analizado en el caso?", "¿Las acciones se pueden ejecutar y observar? ¿Evitas palabras vagas como «revisar bien»?", "¿Cada control que exige decisión explica qué sucede si cumple y si no cumple?", "¿Es posible comprobar cantidad de piezas, cierre de bolsa y legibilidad de etiqueta?", "¿Se indica qué hacer con faltantes, etiquetas incorrectas y kits que siguen no conformes?", "¿Las precauciones del caso están vinculadas a las tareas que las requieren?", "¿Sabes qué formulario se diligencia, qué datos contiene y quién responde?", "Si utilizas diagrama, ¿coincide con las acciones, responsables y rutas Sí/No del POE?", "¿Una persona que no redactó el POE lo ha ejecutado realmente? En este ejercicio usualmente está pendiente.", "¿Existe verificación documentada de los requisitos aplicables al uso real? No supongas cumplimiento legal.", "¿Corregiste y dejaste registradas las observaciones detectadas en la revisión?", "¿Hay evidencia real de autorización empresarial? Un borrador académico no equivale a POE aprobado.", "¿Está definido cómo se distribuirá la versión autorizada, y no versiones obsoletas?", "¿Se establece cómo se enseñará el método y comprobará la ejecución? No inventes capacitaciones realizadas.", "¿Definiste indicadores claros y sus fuentes de datos, como calidad a la primera y reproceso?", "¿Existe una regla o plan para evitar que se utilicen versiones sustituidas?", "¿Se indica quién custodia los registros y cómo se definirán plazos y próximas revisiones?"];

function scene13(){let counter=0;return intro(12,'Conviértete en auditor','Audita TU POE de la escena 10 con evidencias y un ejemplo guiado.',18)+box('¿Qué vas a auditar y con qué información?',`<p><b>Vas a revisar tu propio borrador de POE para Distribuciones Horizonte, elaborado en la escena 10.</b> No estás evaluando un documento desconocido ni un nuevo caso. Contrasta lo que escribiste con el caso de kits escolares y la lista de criterios.</p><div class="actions"><a class="btn gold" href="recursos/Guia_Auditoria_POE_Escena_13_Estudiantes.docx" download>⬇ Descargar guía de auditoría para estudiantes (Word)</a><a class="btn secondary" href="recursos/Caso_Completo_POE_Kits_Escolares_Escena_10.docx" download>Consultar caso del proceso</a><button type="button" class="btn secondary" data-go="9">Abrir mi POE en el editor</button></div><div class="callout"><b>Antes de evaluar:</b> 1. Lee la guía descargable. 2. Abre tu POE de la escena 10. 3. Revisa un criterio y busca evidencia en tu documento. 4. Marca Sí, No, No aplica o Pendiente de comprobar. 5. Escribe la evidencia o corrección. 6. Si debes modificar tu POE, vuelve al editor.</div>`,'goldline')+box('Aprende con un ejemplo de auditoría',`<p><b>Criterio: «Instrucciones claras y verificables».</b> Imagina que tu POE dice «revisar bien cada kit». Esa frase no indica qué observar. La auditoría debería marcar <b>No</b> y anotar «No especifica el contenido, estado de la bolsa ni etiqueta; corregir la instrucción para describir los tres controles».</p><p>Si el POE sí explica «verificar un lápiz, un borrador y un sacapuntas; bolsa íntegra y cerrada; etiqueta legible con código de orden», y está documentado en un paso, puedes marcar <b>Sí</b> e indicar dónde aparece.</p><p><b>Pendiente</b> se usa cuando todavía falta una comprobación externa, como una prueba con trabajadores reales. <b>No aplica</b> requiere explicar por qué el requisito no corresponde al caso.</p><div class="callout warning">No confundas <b>«sin revisar»</b> con <b>«pendiente de comprobar»</b>. Son estados distintos: el primero significa que aún no evaluaste el criterio; el segundo, que ya lo examinaste pero aún necesitas evidencia.</div>`)+box('Un documento no se aprueba con una simple casilla',`<p>Evalúa tu propio POE. Marca <b>Sí</b> cuando encuentres evidencia documental; <b>No</b> si detectas una falta; <b>No aplica</b> cuando esté justificado; o <b>Pendiente</b> cuando haga falta una comprobación externa. Escribe una evidencia, una explicación o una corrección para cada criterio.</p><div class="callout warning">Una revisión académica no equivale a una prueba real del método ni a una aprobación por parte de la empresa. Los criterios de ejecución, seguridad y autorización pueden requerir evidencias externas.</div><div class="gr four" id="auditStats">${auditStats()}</div>`)+box('Lista de verificación',`${auditGroups.map(([group,labels],gi)=>`<details class="accordion" ${gi===0?'open':''}><summary>${group} · ${labels.length} criterios</summary><div>${labels.map(label=>{const i=counter++;return `<div class="audit-card"><div class="audit-head"><div><b>${i+1}. ${label}</b><div class="micro">${esc(auditHints[i])}</div></div><select aria-label="Estado criterio ${i+1}" data-audit="${i}:status"><option value="" ${!state.audit[i]?.status?'selected':''}>Selecciona estado</option><option value="pending" ${state.audit[i]?.status==='pending'?'selected':''}>Pendiente de comprobar</option>${[['yes','Sí'],['no','No'],['na','No aplica']].map(([v,l])=>`<option value="${v}" ${state.audit[i]?.status===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="audit-notes"><textarea aria-label="Evidencia o corrección criterio ${i+1}" placeholder="Escribe dónde aparece la evidencia en tu POE, qué falta o qué necesitas comprobar..." data-audit="${i}:note">${esc(state.audit[i]?.note||'')}</textarea></div></div>`}).join('')}</div></details>`).join('')}<div class="actions"><button class="btn" id="saveAudit">Guardar revisión y preparar informe</button><button class="btn secondary" data-go="9">Corregir el POE</button></div><div id="auditFeedback"></div>`,'petrolline')}
function auditStats(){const items=Object.values(state.audit);const yes=items.filter(x=>x.status==='yes').length,no=items.filter(x=>x.status==='no').length,pending=items.filter(x=>x.status==='pending').length,unreviewed=25-items.filter(x=>x.status).length;return `<div class="metric"><label>Cumple declarado</label><strong>${yes}</strong></div><div class="metric"><label>Por corregir</label><strong>${no}</strong></div><div class="metric"><label>Pendientes de comprobar</label><strong>${pending}</strong></div><div class="metric"><label>Sin revisar</label><strong>${unreviewed}</strong></div>`}

function scene14(){let x=state.ferreteria;return intro(13,'¿Mejoró realmente el proceso?','Aplica los conceptos al caso de recepción de mercancía en ferretería.',10)+box('Caso ficticio: Ferretería Central',`<p>Algunos faltantes, referencias equivocadas y daños se descubren cuando ya ha vencido el plazo de reclamo del proveedor. Para este <b>ejercicio hipotético</b>, se supone un plazo de 48 horas; no es una regla general.</p><p>Se aplica un piloto con controles adicionales antes de firmar la remisión y registrar la recepción.</p><div class="table-wrap"><table><thead><tr><th>Dato</th><th>Semana 1 · Actual</th><th>Semana 2 · Piloto</th></tr></thead><tbody>${fdata.map(x=>`<tr>${x.map(t=>`<td>${t}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`)+box('Calcula los indicadores y analiza',`<div class="callout"><b>Aprende las fórmulas antes de analizar:</b> detección oportuna = (diferencias detectadas en plazo ÷ diferencias totales) × 100; registro mismo día = (recepciones registradas el mismo día ÷ recepciones observadas) × 100; variación del tiempo = ((31 − 25) ÷ 25) × 100. <b>Ejemplo:</b> semana 1, 2 diferencias detectadas a tiempo de 5 totales: 2 ÷ 5 × 100 = 40 %. El denominador de detección oportuna no es 12, sino 5.</div><div class="gr three"><div class="metric"><label>Detección oportuna</label><strong>40 % → 100 %</strong></div><div class="metric"><label>Registro mismo día</label><strong>58,33 % → 100 %</strong></div><div class="metric"><label>Tiempo promedio</label><strong>25 → 31 min</strong></div></div><p class="micro">Datos de dos semanas, 12 recepciones cada una. No demuestran por sí solos causalidad ni sostenibilidad de los resultados.</p>${[['time','¿El método piloto redujo el tiempo de trabajo?',[['yes','Sí'],['no','No; aumentó seis minutos (24 %).']],'no'],['provider','¿Podemos afirmar que el POE redujo los errores del proveedor?',[['yes','Sí, está demostrado.'],['no','No; estos datos no permiten atribuirle ese efecto.']],'no'],['pilot','¿Debe descartarse el piloto inmediatamente porque demora más?',[['yes','Sí, siempre gana el proceso más corto.'],['no','No necesariamente; se deben considerar los controles, costos y pruebas adicionales.']],'no']].map(([k,q,options,a])=>`<div class="field"><label for="f${k}">${q}</label><select id="f${k}" data-ferreteria="${k}"><option value="">Seleccionar</option>${options.map(([v,l])=>`<option value="${v}" ${x.answers[k]===v?'selected':''}>${l}</option>`).join('')}</select></div>`).join('')}${fld('ferretReason','Tu recomendación para la gerencia',x.reason,'Explica qué datos adicionales solicitarías y por qué.','textarea')}<button class="btn" id="checkFerreteria">Evaluar recomendación</button><div id="ferretFeedback"></div>`,'goldline')}

function composePrompt(mode){let task=['Evalúa la claridad del objetivo, alcance y pasos; responsabilidades; criterios verificables; rutas de decisión; desviaciones; registros; controles y coherencia entre secciones.','Marca las frases ambiguas, adjetivos sin criterio verificable y pasos que no describan una acción observable. Sugiere versiones más claras sin inventar parámetros ni modificar arbitrariamente el método.','Actúa como un trabajador nuevo, competente y sin participación en la redacción. Intenta seguir el procedimiento; identifica paso a paso dudas, omisiones, decisiones sin ruta y evidencias que faltan. No simules haber ejecutado físicamente el procedimiento.'][mode];return `Actúa como ingeniero industrial especializado en estudio de métodos y documentación de POE. Este es un borrador académico ficticio.\n\nTAREA: ${task}\n\nResponde con una tabla: apartado/paso | hallazgo | importancia | corrección sugerida | evidencia faltante. Después plantea cinco preguntas de verificación. No inventes datos, tiempos estándar, límites de seguridad ni normas. Si falta evidencia escribe PENDIENTE. No declares aprobado ni validado el procedimiento.\n\nBORRADOR:\n${poePlain()}`}

<p>OMS (2014), <a href="https://www.who.int/es/publications/m/item/laboratory-quality-manual" target="_blank" rel="noopener">Manual de calidad de laboratorio</a>.</p><p>Los requisitos legales y técnicos se verifican según sector, lugar y vigencia; esta práctica no constituye una aprobación operativa.</p></div>`) }

b.push(H('9. Simulación y referencias al POE'));b.push(T(['SITUACIÓN','RESPUESTA','PRIMER INTENTO','REFERENCIA','JUSTIFICACIÓN'],simulations.map((v,i)=>[v.q,state.simulation.answers[i]!==undefined?v.opts[Number(state.simulation.answers[i])]:'Pendiente',e.simFirst?.[i]!==undefined?v.opts[Number(e.simFirst[i])]:'Pendiente',evidenceLabel(state.simulation.stepRefs[i]),e.simEvidence?.[i]||'Pendiente'])));
b.push(H('10. Indicadores de kits'));if(calcReady()){let r=calculate(state.calc.total,state.calc.rework,state.calc.recovered);b.push(T(['KITS','REPROCESADOS','RECUPERADOS','FPY (%)','REPROCESO (%)','ACEPTACIÓN FINAL (%)'],[[state.calc.total,state.calc.rework,state.calc.recovered,r.fpy.toFixed(2),r.rework.toFixed(2),r.final.toFixed(2)]]))}else b.push(P('Valores pendientes de completar o corregir'));b.push(T(['PREGUNTA DEL SEGUNDO LOTE','RESPUESTA'],[['Calidad a la primera',state.calc.quiz.fpy??'Pendiente'],['Tasa de reproceso',state.calc.quiz.rework??'Pendiente'],['Aceptación final',state.calc.quiz.final??'Pendiente'],['Interpretación',state.calc.quiz.interpret||'Pendiente']]));
b.push(H('11. Auditoría del POE'));b.push(P('Versión auditada: '+(e.auditRevision>=0?'Revisión '+e.auditRevision:'No comprobada / pendiente')));b.push(T(['N.º','CRITERIO','ESTADO','EVIDENCIA / HALLAZGO'],auditCriteria.map((q,i)=>[i+1,q,({yes:'Sí',no:'No',pending:'Pendiente de comprobar',na:'No aplica'})[state.audit[i]?.status]||'Sin revisar',state.audit[i]?.note||'Sin explicación'])));
b.push(H('12. Ferretería Central'));const f=state.ferreteria;b.push(T(['INDICADOR','RESULTADO ESTUDIANTE (%)'],[['Detección oportuna anterior',f.calcs?.op??'Pendiente'],['Detección oportuna piloto',f.calcs?.np??'Pendiente'],['Registro mismo día anterior',f.calcs?.or??'Pendiente'],['Registro mismo día piloto',f.calcs?.nr??'Pendiente'],['Variación relativa del tiempo',f.calcs?.dt??'Pendiente']]));b.push(T(['PREGUNTA','DECISIÓN'],[['Reducción del tiempo',f.answers.tim||'Pendiente'],['Causalidad del proveedor',f.answers.prov||'Pendiente'],['Mantener piloto',f.answers.pil||'Pendiente']]));b.push(P('Recomendación: '+fmt(f.reason)));
b.push(H('13. Análisis crítico de IA'));b.push(P('Decisión ante límite de 30 s: '+({reject:'Rechazar por falta de fundamento',pending:'Dejar pendiente de estudio',accept:'Aceptar inmediatamente'})[state.ai.decision]||'Pendiente'));b.push(P('Justificación: '+fmt(state.ai.reason)));b.push(P('Observaciones externas (si se usaron): '+fmt(state.ai.feedback)));
b.push(P('El informe reproduce datos de respuestas y reglas objetivas, pero las justificaciones escritas requieren valoración académica. Un POE académico completo no equivale a aprobación de la empresa.'));return b;}
// PDF A4 sin bibliotecas externas: tablas con celdas, encabezados repetidos y saltos de página.
function pdfBlob(blocks){
 const pages=[];let commands=[],y=781;const margin=48,contentW=499;
 function textCmd(txt,x,yy,size=9,bold=false){const value=String(txt??'').replace(/[≤]/g,'<= ').replace(/[≥]/g,'>= ').replace(/[^\x00-\xFF\u20AC\u2013\u2014\u2018\u2019\u201C\u201D]/g,'?');commands.push(`0.18 0.23 0.29 rg BT /${bold?'F2':'F1'} ${size} Tf ${x.toFixed(1)} ${yy.toFixed(1)} Td (${pdfEscape(value)}) Tj ET\n`)}
 function page(){if(commands.length)pages.push(commands.join(''));commands=[];y=782;}
 function reserve(h){if(y-h<62)page();}
 function heading(s,title=false){const size=title?17:11.7,lineH=title?22:16,parts=wrap(String(s),title?52:75);reserve(parts.length*lineH+10);for(const line of parts){textCmd(line,margin,y,size,true);y-=lineH}y-=5}
 function paragraph(s){for(const t of String(s??'').split('\n')){const lines=wrap(t,93);for(const l of lines){reserve(13);if(l)textCmd(l,margin,y,9);y-=12.5}}y-=4}
 function pdfTable(rows){if(!rows?.length)return;let cols=rows[0].length;let weights=Array.from({length:cols},(_,i)=>{const vals=rows.slice(0,Math.min(rows.length,20)).map(r=>String(r[i]||'').length);return Math.max(1.0,Math.min(2.0,(Math.max(...vals,12)/22)))});const sum=weights.reduce((a,b)=>a+b,0),widths=weights.map(w=>contentW*w/sum);const left=[margin];for(let i=0;i<cols;i++)left.push(left[i]+widths[i]);
 const fs=cols>=6?6.3:cols===5?7:cols===4?7.6:8.5, lh=fs+3;
 function drawRow(row,header){let lineLists=row.map((v,i)=>{const max=Math.max(7,Math.floor((widths[i]-10)/(fs*.48)));return wrap(String(v??''),max)}),maxLines=Math.max(...lineLists.map(v=>v.length),1);const rowH=Math.max(21,9+maxLines*lh);reserve(rowH+4);commands.push(`${header?'0.92 0.96 0.97':'1 1 1'} rg ${margin.toFixed(1)} ${(y-rowH).toFixed(1)} ${contentW.toFixed(1)} ${rowH.toFixed(1)} re f\n`);commands.push('0.77 0.83 0.86 RG 0.45 w\n');for(let i=0;i<cols;i++){commands.push(`${left[i].toFixed(1)} ${y.toFixed(1)} m ${left[i].toFixed(1)} ${(y-rowH).toFixed(1)} l S\n`);let z=0;for(let line of lineLists[i]){if(z>=maxLines)break;textCmd(line,left[i]+5,y-11-z*lh,fs,header);z++}}commands.push(`${left[cols].toFixed(1)} ${y.toFixed(1)} m ${left[cols].toFixed(1)} ${(y-rowH).toFixed(1)} l S\n${margin} ${y.toFixed(1)} m ${margin+contentW} ${y.toFixed(1)} l S\n${margin} ${(y-rowH).toFixed(1)} m ${margin+contentW} ${(y-rowH).toFixed(1)} l S\n`);y-=rowH;
 }
 let head=rows[0];drawRow(head,true);for(let i=1;i<rows.length;i++){const rough=rows[i].reduce((mx,v,j)=>Math.max(mx,Math.ceil(String(v??'').length/Math.max(9,Math.floor((widths[j]-10)/(fs*.48))))),1)*lh+9;if(y-rough<66){page();drawRow(head,true)}drawRow(rows[i],false)}y-=9;
 }
 for(const b of blocks){if(b.kind==='title')heading(b.text,true);else if(b.kind==='h')heading(b.text,false);else if(b.kind==='table')pdfTable(b.rows);else paragraph(b.text)}page();
 const objects=[''],add=x=>{objects.push(x);return objects.length-1};const helv=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>'),bold=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');const parent=add('');const children=[];
 for(let i=0;i<pages.length;i++){const start=`0.067 0.165 0.275 rg\n0 803 595 39 re f\n1 1 1 rg\nBT /F2 10 Tf 48 817 Td (AulaEscena  |  Metodos y Tiempos) Tj ET\n0.835 0.659 0.294 RG 48 793 m 547 793 l S\n`;const foot=`0.37 0.43 0.48 rg\nBT /F1 8 Tf 48 34 Td (Mg. Vicky Ruiz  |  Pagina ${i+1} de ${pages.length}  |  Borrador academico) Tj ET\n`;let c=start+pages[i]+foot;const stream=add(`<< /Length ${ansiBytes(c).length} >>\nstream\n${asAscii(c)}\nendstream`);children.push(add(`<< /Type /Page /Parent ${parent} 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 ${helv} 0 R /F2 ${bold} 0 R >> >> /Contents ${stream} 0 R >>`));}
 objects[parent]=`<< /Type /Pages /Count ${children.length} /Kids [${children.map(id=>`${id} 0 R`).join(' ')}] >>`;const catalog=add(`<< /Type /Catalog /Pages ${parent} 0 R >>`);let out='%PDF-1.4\n%ãôïó\n',offset=[0];for(let i=1;i<objects.length;i++){offset[i]=ansiBytes(out).length;out+=`${i} 0 obj\n${objects[i]}\nendobj\n`;}let xref=ansiBytes(out).length;out+=`xref\n0 ${objects.length}\n0000000000 65535 f \n`;for(let i=1;i<objects.length;i++)out+=`${String(offset[i]).padStart(10,'0')} 00000 n \n`;out+=`trailer\n<< /Size ${objects.length} /Root ${catalog} 0 R >>\nstartxref\n${xref}\n%%EOF`;
 return new Blob([ansiBytes(out)],{type:'application/pdf'});
}

 const tests=['Documento que establece cómo preparar, verificar y entregar un pedido.','Guía detallada para configurar una impresora de etiquetas.','Hoja vacía para registrar inspecciones.','Hoja ya diligenciada con resultados reales de una inspección.','Diagrama de actividades y rutas de aceptación y rechazo.'];

 if(!rows.length)return '';

 return `<w:tbl><w:tblPr><w:tblW w:w="${total}" w:type="dxa"/><w:tblLayout w:type="fixed"/><w:tblInd w:w="0" w:type="dxa"/>${borders}</w:tblPr><w:tblGrid>${grid}</w:tblGrid>${rowsXML}</w:tbl>`;
