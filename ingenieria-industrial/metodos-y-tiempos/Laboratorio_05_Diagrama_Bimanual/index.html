const PROMPT1=`Actúa como ingeniero industrial experto en estudio de métodos y tiempos, especializado en diagramas bimanuales.\n\nAdjuntaré la descripción de un proceso manual. Ayúdame a construir su diagrama bimanual.\n\nFASE 1 — INFORMACIÓN: lee el documento, define el inicio y final del ciclo, separa acciones de cada mano, identifica actividades simultáneas. Conserva todos los tiempos conocidos; nunca inventes actividades ni valores.\n\nFASE 2 — SÍMBOLOS: ○ Operación (tomar, colocar, ajustar, soltar o actuar sobre una pieza), → Transporte (desplazar mano u objeto), D Espera (mano inactiva sin función necesaria), ▽ Sostenimiento (mantener una pieza o herramienta). Distingue espera de sostenimiento. Justifica casos ambiguos.\n\nFASE 3 — MATRIZ: produce tabla con N.º | Mano izquierda | Símbolo izquierda | Tiempo (s) | Mano derecha | Símbolo derecha | Tiempo (s). Cada fila representa un mismo intervalo compartido. Usa verbo y objeto.\n\nFASE 4 — DIAGRAMA: representa las 4 columnas de símbolos de cada mano y sus conexiones. Si tu herramienta no puede generar un gráfico fiel, produce datos suficientes para llevarlo a Excel, sin fingir que elaboraste una imagen.\n\nFASE 5 — RESULTADOS: cuenta operaciones, transportes, esperas y sostenimientos de cada mano; calcula el tiempo transcurrido del ciclo sin duplicar tiempos simultáneos. Explica oportunidades de mejora sin inventar ahorros. Comprueba consistencia de todos los totales antes de responder.`;
const PROMPT2=`Actúa como ingeniero industrial senior experto en estudio de métodos, diagramas bimanuales y evaluación de mejoras de procesos manuales.\n\nAdjuntaré (1) el proceso original y (2) mi diagrama bimanual, con mi método propuesto si lo tengo. Audita críticamente mi trabajo y no supongas que está correcto.\n\n1. IDENTIFICACIÓN: contrasta cada acción de la mano izquierda y derecha, indica actividades omitidas, duplicadas o mal descritas.\n2. SIMULTANEIDAD: valida que ambas actividades de una fila ocurran durante el mismo intervalo y que la secuencia sea coherente.\n3. SÍMBOLOS: revisa ○ operación, → transporte, D espera y ▽ sostenimiento. Distingue errores claros de clasificaciones justificables y explica cada hallazgo.\n4. TIEMPOS: verifica tiempo por fila, sumas, conteos por mano y duración total. No dupliques intervalos simultáneos.\n5. PROPUESTA: evalúa si los cambios son viables, seguros y compatibles con la calidad; exige evidencia de cualquier ahorro y distingue estimación de tiempo medido.\n\nFORMATO: tabla N.º | Elemento revisado | Mi respuesta | Hallazgo | Corrección sugerida | Justificación. Después presenta aciertos, errores, aspectos inciertos que requieren revisión humana, juicio sobre la mejora y tres preguntas para fortalecer mi análisis. Nunca inventes observaciones o tiempos y no sustituyas la explicación por una respuesta final sin fundamento.`;

function scene0(){return `<div class="hero"><div class="eyebrow" style="color:#e8bd69">LABORATORIO 05 · MÉTODOS Y TIEMPOS</div><h1>Dos manos.<br><span class="accent">Un proceso.</span></h1><p style="font-size:clamp(18px,2.2vw,25px);max-width:650px;font-weight:700">¿Tus manos trabajan en equipo… o una espera mientras la otra hace todo?</p><div class="hands" role="img" aria-label="Dos manos colaborando">🤲 <span style="color:#d6a84b">⟷</span> 👐</div><p>Un movimiento innecesario puede parecer insignificante, pero repetido durante todo el día puede costar tiempo y esfuerzo. En este laboratorio aprenderás a observar, representar y mejorar movimientos coordinados.</p><div class="heroform"><h3>Antes de comenzar, identifícate</h3><div class="field"><label for="studentName">Nombre completo *</label><input class="input" id="studentName" data-field="name" value="${esc(state.name)}" placeholder="Nombre y apellido" autocomplete="name" required></div><div class="field"><label for="introQ">¿Ambas manos deben estar siempre en movimiento para que la tarea sea eficiente?</label><select id="introQ" class="select" data-field="intro"><option value="">Selecciona tu primera impresión…</option>${['Sí, las dos deben moverse continuamente.','No, una mano puede sostener mientras la otra trabaja.','No estoy seguro; quiero descubrirlo.'].map(s=>`<option ${s===state.intro?'selected':''}>${s}</option>`).join('')}</select></div><p class="tiny">No calificaremos esta primera respuesta. Queremos conocer tu punto de partida.</p><button class="btn gold block" data-action="begin">Comenzar laboratorio →</button></div><p class="tiny" style="margin-top:18px">Tu trabajo se conserva en este navegador. Las descargas incluirán tu nombre.</p></div>`}
function scene1(){return pageTitle(1,'COMPRENDER','¿Qué es el diagrama bimanual?','Observa los dos lados de una misma tarea.')+`<div class="card highlight"><p><strong>El diagrama bimanual</strong> es una herramienta del estudio de métodos que registra y representa, de manera coordinada, los movimientos y actividades realizados por la mano izquierda y la mano derecha durante una tarea manual.</p><p>Su principal característica es mostrar <strong>qué hace cada mano en el mismo momento</strong>.</p></div><div class="section grid3">${[['01','Observar','Ver qué hace cada mano y dónde comienza y termina el ciclo.'],['02','Registrar','Describir movimientos, tiempos y su simultaneidad.'],['03','Analizar','Reconocer esperas, transportes y oportunidades de mejora.']].map(a=>`<div class="card"><span class="pill">${a[0]}</span><h3 style="margin-top:13px">${a[1]}</h3><p class="small muted">${a[2]}</p></div>`).join('')}</div><div class="section grid2"><div class="card"><h3>¿Para qué sirve?</h3><p>Para reconocer movimientos innecesarios, desplazamientos excesivos, problemas de coordinación, esperas y sostenimientos que merecen estudio.</p><h3>¿Cuándo se utiliza?</h3><p>Tareas manuales repetitivas: ensamblaje, empaque, manipulación de herramientas y operaciones de producción.</p></div><div class="card"><h3>¿Con qué se elabora?</h3><ul><li>Una tarea manual delimitada.</li><li>Observación directa o video de ambas manos.</li><li>Secuencia de actividades con verbos claros.</li><li>Tiempo por intervalo, si está disponible.</li><li>Plantilla de dos manos y cuatro símbolos.</li></ul></div></div><div class="card teal"><h3>Piensa como analista</h3><p>¿Por qué no es suficiente observar solamente la mano que utiliza la herramienta?</p><div class="choices">${['Porque la otra mano también puede sostener, trasladar o esperar.','Porque los colores del diagrama necesitan dos columnas.'].map((s,i)=>`<label class="choice ${state.conceptAnswers.main===String(i)?'selected':''}"><input type="radio" name="concept" data-key="main" value="${i}" ${state.conceptAnswers.main===String(i)?'checked':''}>${s}</label>`).join('')}</div>${state.conceptAnswers.main!==undefined?`<div class="${state.conceptAnswers.main==='0'?'success':'warning'}">${state.conceptAnswers.main==='0'?'Correcto. La coordinación solo se entiende observando ambas manos.':'Revisa: lo importante es registrar lo que ocurre simultáneamente con ambas manos.'}</div>`:''}</div>`}
function scene2(){return pageTitle(2,'CLASIFICAR','El lenguaje de los cuatro símbolos','La clave es reconocer la función de cada movimiento, no solo memorizar figuras.')+`<div class="symbol-grid">${[['○','Operación','Tomar, colocar, ajustar, soltar o actuar directamente sobre un objeto.'],['→','Transporte','Desplazar la mano o trasladar un objeto de un lugar a otro.'],['D','Espera','Mano inactiva que no cumple una función necesaria.'],['▽','Sostenimiento','Mantener una pieza o herramienta en su posición.']].map(x=>`<div class="symbol"><div class="glyph">${x[0]}</div><div class="name">${x[1]}</div><p>${x[2]}</p></div>`).join('')}</div><div class="warning section"><strong>¡Cuidado! Espera no es igual a sostenimiento.</strong> Una mano que mantiene firme una pieza facilita el trabajo; una mano inactiva sin una función necesaria está esperando. Un sostenimiento puede ser necesario y no debe eliminarse sin estudiar su propósito.</div><div class="card section"><div class="row between"><h3>Clasifica seis movimientos</h3><button class="btn secondary smallbtn" data-action="reset-concept">Reintentar</button></div><p class="small muted">Selecciona la categoría y comprueba tu razonamiento.</p><div class="table-wrap"><table class="data"><thead><tr><th>Movimiento observado</th><th>Selecciona el símbolo</th><th>Revisión</th></tr></thead><tbody>${[['Tomar un lápiz de la mesa','O'],['Llevar el lápiz hacia una hoja','T'],['Mantener firme una hoja mientras se escribe','S'],['Permanecer inactivo mientras la otra mano termina','E'],['Colocar una tapa en un recipiente','O'],['Desplazar la mano vacía hacia una herramienta','T']].map((x,i)=>`<tr><td>${x[0]}</td><td><select class="select" data-concept-symbol="${i}">${symOpts(state.conceptAnswers['sym'+i])}</select></td><td>${state.conceptAnswers['sym'+i]?`<span class="tag ${state.conceptAnswers['sym'+i]===x[1]?'ok':'review'}">${state.conceptAnswers['sym'+i]===x[1]?'Correcto':'Revisa la función'}</span>`:'Pendiente'}</td></tr>`).join('')}</tbody></table></div></div>`}
function scene3(){const p=state.paperStep;const row=paper[p];return pageTitle(3,'EJEMPLO GUIADO','Hagámoslo juntos: doblar una hoja','Primero comprende el proceso. Después elige qué hace cada mano en cada momento.')+`<div class="card highlight"><h3>Descripción del proceso: doblar una hoja por la mitad</h3><p>Una persona se encuentra sentada frente a una mesa. A su derecha hay una hoja de papel que debe doblar por la mitad. Inicialmente, la mano izquierda permanece sin intervenir. La mano derecha toma la hoja y la lleva al centro de la mesa. Luego la mano izquierda se acerca y sujeta un borde para mantener estable el papel, mientras la mano derecha alinea los bordes opuestos. Con el papel alineado, la izquierda continúa sujetándolo y la derecha forma el doblez y marca el pliegue. Por último, ambas manos sueltan la hoja doblada sobre la mesa.</p><p class="small muted">Es una secuencia didáctica posible; no representa una medición cronometrada. Lee antes de clasificar.</p></div><div class="section card"><div class="row between"><div><span class="pill">Paso ${p+1} de 5</span><h3 style="margin-top:12px">¿Qué sucede en este momento?</h3></div><span class="muted">${['Inicio','Desplazamiento','Alineación','Doblado','Cierre'][p]}</span></div><div class="grid2"><div class="box"><h3>Mano izquierda</h3><p>${esc(row[0])}</p><label class="field-label">Selecciona el símbolo</label><select class="select" data-paper="left" data-p="${p}">${symOpts(state.paperAns[p]?.l)}</select></div><div class="box"><h3>Mano derecha</h3><p>${esc(row[1])}</p><label class="field-label">Selecciona el símbolo</label><select class="select" data-paper="right" data-p="${p}">${symOpts(state.paperAns[p]?.r)}</select></div></div><div class="row" style="margin-top:16px"><button class="btn secondary" data-action="paper-prev" ${p===0?'disabled':''}>← Paso anterior</button><button class="btn" data-action="paper-check">Comprobar paso</button>${p<4?`<button class="btn gold" data-action="paper-next">Siguiente paso →</button>`:`<button class="btn gold" data-action="paper-finish">Finalizar ejemplo ✓</button>`}</div><div id="paperFeedback" class="feedback"></div></div><div class="section"><h3>Tu primer diagrama toma forma</h3>${diagramPanel('paper',paper.slice(0,p+1).map((r,i)=>({l:r[0],r:r[1],ls:state.paperAns[i]?.l||'',rs:state.paperAns[i]?.r||'',t:0})),{simple:true})}</div><div class="warning"><strong>Pregunta importante:</strong> en el paso 3, ¿la mano que sostiene el papel está desperdiciando tiempo? No necesariamente: su función permite que la otra mano alinee los bordes.</div>`}
function scene4(){const correct=quiz.reduce((sum,q,i)=>sum+(Number(state.quizAnswers[i])===q[2]?1:0),0);return pageTitle(4,'COMPROBAR','¿Aprendiste a observar?','Siete decisiones para comprobar tu comprensión antes de construir un diagrama real.')+`<div class="row between section"><span class="pill">${Object.keys(state.quizAnswers).length} / 7 respondidas</span><button class="btn secondary smallbtn" data-action="reset-quiz">Volver a intentar</button></div><div class="section" style="display:grid;gap:14px">${quiz.map((q,i)=>`<div class="card"><div class="eyebrow">PREGUNTA ${i+1} / 7</div><h3>${esc(q[0])}</h3><div class="choices">${q[1].map((o,j)=>`<label class="choice ${String(state.quizAnswers[i])===String(j)?'selected':''}"><input type="radio" name="q${i}" data-quiz="${i}" value="${j}" ${String(state.quizAnswers[i])===String(j)?'checked':''}>${esc(o)}</label>`).join('')}</div>${state.quizReviewed&&state.quizAnswers[i]!==undefined?`<div class="${Number(state.quizAnswers[i])===q[2]?'success':'warning'}">${Number(state.quizAnswers[i])===q[2]?'Correcto.':'Respuesta esperada: '+esc(q[1][q[2]])+'.'} ${esc(q[3])}</div>`:''}</div>`).join('')}</div><div class="card section"><button class="btn" data-action="review-quiz">Revisar mis 7 respuestas</button>${state.quizReviewed?`<div class="success feedback"><strong>Resultado: ${correct} de 7.</strong> ${correct>=5?'Dominio inicial satisfactorio.':'Revisa las explicaciones y vuelve a intentarlo.'} Puedes continuar cuando hayas revisado la retroalimentación.</div>`:''}</div>`}
function scene5(){const qs=[['¿Qué se obtiene?',['Segmentos de vidrio de aproximadamente 1,5 cm','Tubos de 1,5 metros'],0],['¿Qué herramienta marca el vidrio?',['Una prensa hidráulica','Una lima metálica'],1],['¿Por qué registrar ambas manos?',['Porque actúan coordinadamente en un mismo ciclo','Porque duplican el tiempo total'],0]];return pageTitle(5,'ANALIZAR EL CASO','Corte manual de tubos de vidrio','Lee el documento antes de identificar las actividades de cada mano.')+`<div class="grid2"><div class="card highlight"><h3>Descripción del puesto</h3><p>En un taller se cortan tubos de vidrio para fabricar equipos de laboratorio. Los tubos miden aproximadamente <strong>3 mm de diámetro y 1 m de largo</strong>. Se busca obtener trozos de unos <strong>1,5 cm</strong>.</p><p>El puesto cuenta con una mesa, una plantilla de posicionamiento, una lima metálica y los tubos de vidrio. La plantilla sirve para señalar el punto de corte.</p><div class="row"><a href="assets/Caso_Corte_Tubos_Vidrio.docx" download class="btn">⬇ Descargar caso Word</a></div></div><div class="card"><h3>Tu misión</h3><ol><li>Leer los 14 intervalos del caso.</li><li>Separar las actividades de ambas manos.</li><li>Clasificar movimientos y tiempos.</li><li>Construir el diagrama.</li><li>Revisar y proponer una mejora.</li></ol><div class="warning">Se analiza un caso documentado; no realices físicamente el corte de vidrio. Los tiempos del documento son estimados.</div></div></div><div class="card section"><h3>Comprueba que entendiste el caso</h3>${qs.map((q,i)=>`<div class="field"><label>${i+1}. ${q[0]}</label><select class="select" data-case-question="${i}"><option value="">Seleccionar…</option>${q[1].map((o,j)=>`<option value="${j}" ${state.conceptAnswers['case'+i]===String(j)?'selected':''}>${o}</option>`).join('')}</select>${state.conceptAnswers['case'+i]!==undefined?`<span class="tiny" style="color:${Number(state.conceptAnswers['case'+i])===q[2]?'#168267':'#a6473c'}">${Number(state.conceptAnswers['case'+i])===q[2]?'Correcto':'Revisa el documento'}</span>`:''}</div>`).join('')}</div>`}
function glassRowChoiceOptions(kind,selected,i){const opts=(kind==='l'?glassOptsLeft:glassOptsRight);let relevant=[glassData[i][kind==='l'?0:1],opts[(i+4)%14],opts[(i+9)%14]];relevant=[...new Set(relevant)];return `<option value="">Identificar la acción…</option>`+relevant.map(o=>`<option value="${esc(o)}" ${selected===o?'selected':''}>${esc(o)}</option>`).join('')}
function scene6(){const countReady=state.glassChoices.filter(c=>c.l&&c.r).length;return pageTitle(6,'IDENTIFICAR','Detectives del movimiento','Primero describe qué hace cada mano; la simbología vendrá después.')+`<div class="box section"><strong>Consigna</strong><p class="small">Lee cada fragmento y selecciona las acciones que realizan la mano izquierda y la derecha durante el mismo intervalo. No confundas la acción principal con lo que ocurre simultáneamente al otro lado.</p><div class="row between"><span class="pill">${countReady} / 14 pares identificados</span><a href="assets/Caso_Corte_Tubos_Vidrio.docx" download>Consultar documento original ↗</a></div></div><div style="display:grid;gap:12px">${glassData.map((r,i)=>`<div class="card"><div class="row between"><span class="pill">INTERVALO ${i+1} / 14</span><strong class="tiny">${fmt(r[2])} s</strong></div><p style="margin:11px 0;font-size:13px">${esc(r[5])}</p><div class="grid2"><div class="field"><label>Mano izquierda</label><select class="select" data-glass-choice="l" data-i="${i}">${glassRowChoiceOptions('l',state.glassChoices[i].l,i)}</select></div><div class="field"><label>Mano derecha</label><select class="select" data-glass-choice="r" data-i="${i}">${glassRowChoiceOptions('r',state.glassChoices[i].r,i)}</select></div></div><div class="row"><span class="tag ${state.glassChoices[i].l?(state.glassChoices[i].l===r[0]?'ok':'review'):'review'}">MI ${!state.glassChoices[i].l?'pendiente':state.glassChoices[i].l===r[0]?'✓ identificada':'revisar'}</span><span class="tag ${state.glassChoices[i].r?(state.glassChoices[i].r===r[1]?'ok':'review'):'review'}">MD ${!state.glassChoices[i].r?'pendiente':state.glassChoices[i].r===r[1]?'✓ identificada':'revisar'}</span></div></div>`).join('')}</div><div class="section card teal"><h3>Cuando termines</h3><p>Las actividades seleccionadas pasarán automáticamente al constructor de la escena siguiente. Si tienes una interpretación distinta de una frase, podrás editarla allí y justificarla.</p><button class="btn" data-action="go" data-n="7">Ir al constructor →</button></div>`}

for(const [points,color] of [[leftPts,'#176B80'],[rightPts,'#aa7934']]){for(let j=1;j<points.length;j++){if(points[j][2]===points[j-1][2]+1)s+=`<line x1="${points[j-1][0]}" y1="${points[j-1][1]}" x2="${points[j][0]}" y2="${points[j][1]}" stroke="${color}" stroke-width="1.5"/>`;}for(const pt of points)s+=`<circle cx="${pt[0]}" cy="${pt[1]}" r="5" fill="${color}" stroke="#fff" stroke-width="1.1"/>`;}
const base=head+Math.max(rows.length,4)*rh+22;s+=`<text x="27" y="${base}" font-size="12" font-weight="bold" fill="#112A46">Total: ${fmt(total(rows))} s</text><text x="260" y="${base}" font-size="11" fill="#496172">MI: O ${count(rows,'l','O')} · T ${count(rows,'l','T')} · E ${count(rows,'l','E')} · S ${count(rows,'l','S')}</text><text x="620" y="${base}" font-size="11" fill="#496172">MD: O ${count(rows,'r','O')} · T ${count(rows,'r','T')} · E ${count(rows,'r','E')} · S ${count(rows,'r','S')}</text><text x="27" y="${base+27}" font-size="10" fill="#667788">Las líneas relacionan actividades sucesivas de cada mano; no representan un recorrido físico.</text></svg>`;return s}

function scene8(){const v=reviewResults();return pageTitle(8,'REVISAR','¿Está bien construido tu diagrama?','La corrección distingue los errores objetivos de las descripciones que requieren interpretación.')+`<div class="card"><h3>Primero envía tu respuesta</h3><p>Comprobaremos las 14 filas, sus símbolos y sus tiempos. Si una descripción es distinta pero representa el mismo movimiento, podrás justificarla: la aplicación no la marcará como error definitivo por una diferencia de redacción.</p><button class="btn" data-action="review-glass">Comprobar diagrama ahora</button></div>${state.glassReview?`<div class="section grid3"><div class="kpi"><b>${v.full}/14</b><span>Filas con ambas actividades</span></div><div class="kpi"><b>${v.syms}/14</b><span>Pares de símbolos correctos</span></div><div class="kpi"><b>${v.time}/14</b><span>Tiempos correspondientes al caso</span></div></div><div class="card section"><h3>Corrección por intervalo</h3><div class="table-wrap"><table class="data"><thead><tr><th>Paso</th><th>Actividades</th><th>Símbolos</th><th>Tiempo</th><th>Orientación</th></tr></thead><tbody>${v.rows.map(x=>`<tr><td>${x.num}</td><td><span class="tag ${x.both?'ok':'no'}">${x.both?(x.actOk?'Registradas':'Redacción a contrastar'):'Incompletas'}</span></td><td><span class="tag ${x.symbols?'ok':'no'}">${x.symbols?'Correctos':'Revisar'}</span></td><td><span class="tag ${x.time?'ok':'no'}">${x.time?'Correcto':'Revisar'}</span></td><td>${!x.both?'Completa ambas actividades.':!x.symbols?`MI: ${SYMBOLS.find(s=>s[0]===x.expected[3])[2]}; MD: ${SYMBOLS.find(s=>s[0]===x.expected[4])[2]}.`:!x.time?'Consulta el tiempo del caso.':!x.actOk?'Compara tu expresión con el documento.':'Bien fundamentado.'}</td></tr>`).join('')}</tbody></table></div><div class="row section"><button class="btn secondary" data-action="go" data-n="7">← Corregir registros</button><button class="btn" data-action="toggle-glass-ref">${state.glassViewRef?'Ocultar':'Mostrar'} solución de referencia</button></div>${st function scene9(){const proposed=state.glassProposed;const t0=total(state.glass),t1=proposed?total(proposed):null;return pageTitle(9,'REDISEÑAR','Del método actual al propuesto','Una mejora no se demuestra únicamente dibujando menos símbolos: debe estar justificada.')+`<div class="card highlight"><h3>Tu desafío de mejora</h3><p>Analiza el método actual. ¿Podrían reducirse desplazamientos al reubicar la lima? ¿Sería útil cambiar la disposición de la plantilla? ¿Qué sostenimientos son imprescindibles para efectuar la tarea de manera segura?</p><p>Propón <strong>dos cambios razonados</strong> y crea la nueva versión del diagrama. Conserva la calidad y la seguridad. Cualquier tiempo propuesto es una <strong>estimación que necesita verificación</strong>.</p></div><div class="section grid2"><div class="card"><div class="field"><label>Problema identificado</label><textarea class="textarea" data-note="glassNotes.problem" placeholder="Identifico…">${esc(state.glassNotes.problem)}</textarea></div><div class="field"><label>Primera mejora</label><textarea class="textarea" data-note="glassNotes.change1" placeholder="Propongo…">${esc(state.glassNotes.change1)}</textarea></div><div class="field"><label>Segunda mejora</label><textarea class="textarea" data-note="glassNotes.change2" placeholder="Propongo…">${esc(state.glassNotes.change2)}</textarea></div></div><div class="card"><div class="field"><label>¿Qué riesgos o dificultades tendría?</label><textarea class="textarea" data-note="glassNotes.risk">${esc(state.glassNotes.risk)}</textarea></div><div class="field"><label>¿Cómo comprobarías la mejora?</label><textarea class="textarea" data-note="glassNotes.verify" placeholder="Compararía varios ciclos…">${esc(state.glassNotes.verify)}</textarea></div><div class="warning">Las cifras del método propuesto deben surgir de tus supuestos o mediciones; no se generarán ahorros ficticios.</div></div></div><div class="section"><div class="row between"><h3>Método propuesto · corte de vidrio</h3 function scene11(){return pageTitle(11,'APLICACIÓN PROFESIONAL','Desafío: ensamblaje de un lapicero','Observa el video original. Decide dónde comienza y termina la secuencia antes de registrar los movimientos.')+`<div class="card highlight"><h3>Consigna</h3><p>Observa el ensamblaje y delimita el tramo que estudiarás. Identifica movimientos de cada mano, clasifícalos, asigna tiempos medidos o estimados, construye el diagrama actual y luego uno propuesto. <strong>No hay una cantidad fija de filas.</strong> El video dura aproximadamente 28 segundos, pero eso no significa que sea un único ciclo productivo.</p></div><div class="section grid2"><div class="video-box"><video id="penVideo" controls preload="metadata" playsinline src="assets/Ensamblaje_Lapicero.mp4" aria-label="Video original del ensamblaje manual de un lapicero">Tu navegador no admite video HTML5. Descarga el archivo desde el enlace de abajo.</video></div><div class="card"><h3>Laboratorio de observación</h3><p class="small muted">Pausa, retrocede, repite o reduce la velocidad para observar movimientos pequeños.</p><div class="segment section"><button class="seg" data-action="video-step" data-step="-0.5">−0,5 s</button><button class="seg" data-action="video-step" data-step="0.5">+0,5 s</button><button class="seg" data-action="video-rate" data-rate="0.5">0,5×</button><button class="seg" data-action="video-rate" data-rate="1">1×</button></div><div class="row"><button class="btn secondary smallbtn" data-action="video-mark" data-marker="start">Marcar inicio</button><button class="btn secondary smallbtn" data-action="video-mark" data-marker="end">Marcar final</button></div><p class="tiny" style="margin-top:12px">Inicio: <strong>${esc(state.penMarkers.start||'sin marcar')}</strong> · Final: <strong>${esc(state.penMarkers.end||'sin marcar')}</strong></p><a href="assets/Ensamblaje_Lapicero.mp4" download class="btn secondary smallbtn">↓ Descargar video</a></div></div><div class="section"><div class="row between"><h3>1 function copyText(s){if(navigator.clipboard?.writeText){navigator.clipboard.writeText(s).then(()=>toast('Prompt copiado al portapapeles.')).catch(()=>fallbackCopy(s))}else fallbackCopy(s)}function fallbackCopy(s){const t=document.createElement('textarea');t.value=s;document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();toast(ok?'Prompt copiado.':'Selecciona y copia el texto desde el panel.');}
function setNested(path,v){const [a,b]=path.split('.');if(b)state[a][b]=v;else state[a]=v}
function checkPaper(){const p=state.paperStep,x=state.paperAns[p]||{},r=paper[p],right=x.l===r[2]&&x.r===r[3];const dest=$$('#paperFeedback');if(!x.l||!x.r){dest.innerHTML='<div class="warning">Selecciona los dos símbolos para continuar.</div>';return false}dest.innerHTML=`<div class="${right?'success':'warning'}">${right?'¡Correcto!':`Revisa: mano izquierda ${SYMBOLS.find(s=>s[0]===r[2])[2]}, derecha ${SYMBOLS.find(s=>s[0]===r[3])[2]}.`} ${p===2?'Sostener una hoja para alinearla no es esperar.':''}</div>`;return right}
function action(name,el){switch(name){case'toggle-menu':case'open-index':$$('#sidebar').classList.toggle('open');break;case'go':go(Number(el.dataset.n));break;case'prev':go(state.scene-1);break;case'next':if(state.scene===0&&!validateName())break;go(state.scene+1);break;case'begin':if(!validateName())break;if(!state.intro){toast('Selecciona tu impresión inicial antes de comenzar.');break}go(1);break;case'save':persist();toast('Avance guardado en este navegador.');break;case'reset-all':if(window.confirm('¿Borrar los datos de este estudiante y comenzar de nuevo? Descarga los archivos antes de continuar.')){state=fresh();try{localStorage.removeItem(KEY)}catch(e){}render();window.scrollTo(0,0);toast('Se inició una nueva sesión.')}break;case'reset-concept':for(let i=0;i<6;i++)delete state.conceptAnswers['sym'+i];render();break;case'paper-prev':state.paperStep=Math.max(0,state.paperStep-1);render();break;case'paper-check':checkPaper();break;case'paper-next':if(!checkPaper())break;state.paperStep=Math.min(4,state.paperStep+1);render();break;case'paper-finish':if(checkPaper()){state.paperDone=true;toast('Ejemplo guiado completado.')}break;case'review-quiz':if(Object.keys(state.quizAnswers).length<7){toast('Responde las siete preguntas antes de revisar.');break}state.quizReviewed=true;render();break;case'reset-quiz':state.quizAnswers={};state.quizReviewed=false;render();break;case'fill-glass-actions':state.glassChoices.forEach((c,i)=>{if(c.l)state.glass[i].l=c.l;if(c.r)state.glass[i].r=c.r});persist();render();toast('Se copiaron las actividades identificadas.');break;case'review-glass':state.glassReview=true;go(8);break;case'toggle-glass-ref':state.glassViewRef=!state.glassViewRef;render();break;case'clone-glass':state.glassProposed=JSON.parse(JSON.stringify(state.glass));render();toast('Copia editable creada.');break;case'clone-pen':state.penProposed=JSON.parse(JSON.stringify(state.pen));render();toast('Método propuesto copiado.');break;case'add-pen':state[el.dataset.prefix].push({l:'',r:'',ls:'',rs:'',t:''});persist();render();break;case'remove-pen':state[el.dataset.prefix].splice(Number(el.dataset.i),1);persist();render();break;case'review-pen':state.penReviewed=true;persist();render();break;case'video-step':{let v=$$('#penVideo');if(v){v.pause();v.currentTime=Math.max(0,Math.min(v.duration||28.3,v.currentTime+Number(el.dataset.step)))}}break;case'video-rate':{const v=$$('#penVideo');if(v){v.playbackRate=Number(el.dataset.rate);toast('Velocidad: '+el.dataset.rate+'×')}}break;case'video-mark':{const v=$$('#penVideo');if(v){state.penMarkers[el.dataset.marker]=v.currentTime.toFixed(2)+' s';persist();let current=v.currentTime;render();const nv=$$('#penVideo');if(nv)nv.currentTime=current}}break;case'zoom':viewDiagram(el.dataset.id);break;case'close-modal':$$('#modalHost').innerHTML='';break;case'svg':svgDownload(el.dataset.id);break;case'copy':copyText(el.dataset.prompt==='1'?PROMPT1:PROMPT2);break;case'download-package':downloadPackage().catch(e=>{console.error(e);toast('No fue posible generar el paquete: utiliza las descargas individuales.');});break;case'download-word':if(!validateName())break;saveFile(`Laboratorio_05_Bimanual_${safeName()}.docx`,docxReport(),'application/vnd.openxmlformats-officedocument.wordprocessingml.document');toast('Informe Word generado.');break;case'download-xlsx':if(!validateName())break;saveFile(`Diagramas_Bimanuales_${safeName()}.xlsx`,xlsxReport(),'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');toast('Excel generado con cinco hojas.');break;}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;e.preventDefault();action(el.dataset.action,el);persist()});
document.addEventListener('change',e=>{const el=e.target;let d=el.dataset;if(d.field){state[d.field]=el.value}else if(d.quiz!==undefined){state.quizAnswers[d.quiz]=el.value;state.quizReviewed=false;render()}else if(d.conceptSymbol!==undefined){state.conceptAnswers['sym'+d.conceptSymbol]=el.value;render()}else if(d.caseQuestion!==undefined){state.conceptAnswers['case'+d.caseQuestion]=el.value;render()}else if(d.key!==undefined&&el.name==='concept'){state.conceptAnswers[d.key]=el.value;render()}else if(d.paper){const i=Number(d.p);state.paperAns[i]??={};state.paperAns[i][d.paper==='left'?'l':'r']=el.value;render()}else if(d.glassChoice){const i=Number(d.i),side=d.glassChoice;state.glassChoices[i][side]=el.value;state.glass[i][side]=el.value;render()}else if(d.edit){let arr=state[d.edit];if(arr?.[Number(d.i)])arr[Number(d.i)][d.prop]=d.prop==='t'?(el.value===''?'':Math.max(0,Number(el.value))):el.value;if(d.prop==='ls'||d.prop==='rs')render();else refreshDiagrams()}else if(d.note){setNested(d.note,el.value);if(d.note==='reflection')render()}else if(d.check!==undefined){state.checklist[d.check]=el.checked}persist()});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.field){state[el.dataset.field]=el.value;persist()}else if(el.dataset.note){setNested(el.dataset.note,el.value);persist()}else if(el.dataset.edit){const d=el.dataset;const a=state[d.edit];if(a?.[Number(d.i)]){a[Number(d.i)][d.prop]=d.prop==='t'?(el.value===''?'':Math.max(0,Number(el.value))):el.value;persist();refreshDiagrams()}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$$('#modalHost').innerHTML)$$('#modalHost').innerHTML=''});
render();
</script></body></html>
