let videoObj=null,videoCurrent=0,videoLoop=null,videoDraft={start:null,end:null};

const nf=(n,d=1)=>Number(n).toLocaleString('es-CO',{minimumFractionDigits:d,maximumFractionDigits:d});
const round=n=>Math.round(Number(n)*1000)/1000;
const number=v=>{if(typeof v==='number')return v;const t=String(v??'').trim().replace(',','.');return t===''?NaN:Number(t)};

const textarea=(id,label,value='',placeholder='')=>`<div class="formrow"><label class="formlabel" for="${id}">${label}</label><textarea class="control" id="${id}" placeholder="${esc(placeholder)}">${esc(value)}</textarea></div>`;
const head=(i,eyebrow,lead)=>`<div class="scene-head"><span class="eyebrow">Escena ${i+1} de 16 · ${eyebrow}</span><h1>${esc(titles[i])}</h1><p class="lead">${lead}</p></div>`;
const pval=id=>$(id)?.value??'';
const call=(body,type='')=>`<div class="callout ${type}">${body}</div>`;
const legend=()=>`<div class="legend"><span><i style="background:${colors.clean}"></i>Trabajo operario</span><span><i style="background:${colors.walk}"></i>Desplazamiento</span><span><i style="background:${colors.attention}"></i>Máquina atendida</span><span><i style="background:${colors.auto}"></i>Procesamiento automático</span><span><i style="background:${colors.idle}"></i>Espera</span></div>`;
function render(){if(state.scene<0||state.scene>15)state.scene=0;let i=state.scene;let sections=[scene1,scene2,scene3,scene4,scene5,scene6,scene7,scene8,scene9,scene10,scene11,scene12,scene13,scene14,scene15,scene16];$('sceneView').innerHTML=sections[i]();$('progressTitle').textContent=`Escena ${i+1} de 16`;$('progressFill').style.width=`${(i+1)/16*100}%`;$('bottomCount').textContent=`${i+1} / 16`;$('backBtn').disabled=i===0;$('nextBtn').textContent=i===15?'Volver al inicio ↺':'Siguiente →';$('nextBtn').disabled=i===0&&!state.name.trim();renderMenu();if(i===14)setupVideo();window.scrollTo({top:0,behavior:'instant'});save();}
function renderMenu(){let html='';chapters.forEach(ch=>{html+=`<div class="side-section">${ch.title}</div>`;for(let i=ch.start;i<=ch.end;i++){html+=`<button class="sidebtn ${state.scene===i?'active':''}" onclick="App.goto(${i})" type="button"><span class="num">${i+1}</span><span>${esc(titles[i])}</span></button>`;}});$('sideNav').innerHTML=html;}
function flash(message,type='warn'){let target=$('sceneMessage');if(!target){target=document.createElement('div');target.id='sceneMessage';$('sceneView').appendChild(target)}target.innerHTML=call(esc(message),type);target.scrollIntoView({behavior:'smooth',block:'nearest'});}
function goto(i){if(i<0||i>15)return;if(i!==0&&!state.name.trim()){flash('Primero registra tus nombres y apellidos en la portada.','error');return}if(i>=6&&state.quizAttempts===0){flash('Completa el quiz evaluativo de la escena 6 antes de continuar.','warn');return}state.scene=i;$('sidebar').classList.remove('open');render();}
function next(){if(state.scene===0&&!state.name.trim()){flash('Ingresa tu nombre completo antes de continuar.','error');return}goto(state.scene===15?0:state.scene+1)}

function toggleMenu(){$('sidebar').classList.toggle('open')}
function register(){let n=pval('studentName').trim().replace(/\s+/g,' ');if(n.length<5||n.split(' ').length<2){flash('Escribe al menos un nombre y un apellido.','error');return}state.name=n;state.initialIdea=pval('initialIdea');save();goto(1)}
function changeField(key,id){state[key]=pval(id);save()}
function scene1(){return head(0,'Registro obligatorio','Tu misión será observar, medir y explicar cómo se relacionan las actividades del operario y las máquinas.')+`<div class="grid2"><div><p class="bigquote">¿Puede un operario estar ocupado todo el tiempo y, aun así, existir oportunidades para mejorar el proceso?</p><p>Descubrirás cómo funciona un diagrama hombre–máquina, resolverás el caso de dos etiquetadoras y terminarás estudiando un video industrial con un cronómetro sincronizado.</p>${call('<b>Tu trabajo es personal.</b> El nombre que registres aparecerá en los Excel, los diagramas y las evidencias que descargues.')}</div><div class="feature"><h3>Identifica tu trabajo</h3>${input('studentName','Nombres y apellidos',state.name,'text','Ejemplo: Ana María Martínez','autocomplete="name" maxlength="100"')}${textarea('initialIdea','Antes de comenzar, ¿qué opinas sobre la pregunta inicial?',state.initialIdea,'Escribe tu primera idea en una o dos frases.') }<button class="btn gold" onclick="App.register()">Comenzar mi misión →</button><p class="footnote">Tus respuestas se guardan temporalmente en esta pestaña del navegador. No se envían a ningún servidor.</p></div></div>`}
function scene2(){return head(1,'Fundamentos · 6 minutos','Aprende a reconocer recursos, tiempos y actividades antes de resolver ejercicios.')+`<p class="bigquote">El <b>diagrama hombre–máquina</b> representa sobre <b>un mismo reloj</b> qué hace un operario y qué hacen una o varias máquinas. Permite visualizar trabajo, atención, procesamiento automático y esperas.</p><div class="grid3"><div class="feature"><h3>1. Observa</h3><p>Registra cuándo comienza y termina cada actividad.</p></div><div class="feature"><h3>2. Representa</h3><p>Coloca las actividades sobre franjas con una escala común.</p></div><div class="feature"><h3>3. Decide</h3><p>Interpreta tiempos y estudia mejoras justificadas.</p></div></div>${call('El propósito es descubrir <b>qué hace cada recurso mientras otro trabaja</b>. No basta con dibujar barras: tenemos que comprender qué significan.')}${timeGlossary()}<div class="feature"><h3>Comprueba la idea antes de continuar</h3><p>Una actividad comienza en el segundo <b>12</b> y termina en el segundo <b>29</b>. Su duración es <b>29 − 12 = 17 segundos</b>, no 29 segundos. Esta regla se utilizará cuando construyas tu propio diagrama.</p><p class="small">Recuerda: el instante final indica una posición en el reloj; la duración es el tiempo que transcurrió entre las dos marcas.</p></div>`}
function timeGlossary(){return `<section class="feature" aria-labelledby="glossaryHeading"><h3 id="glossaryHeading">Diccionario de tiempos: aprende qué mide cada uno</h3><p>No son nombres para memorizar: identificamos <b>intervalos observados</b> y luego calculamos las duraciones. Todos los tiempos deben expresarse en la misma unidad.</p><div class="scroll"><table class="table"><thead><tr><th>Tiempo</th><th>Qué significa</th><th>Cómo se obtiene</th></tr></thead><tbody>
<tr><td><b>Inicio y finalización</b></td><td>Segundos o minutos del reloj en los que comienza y termina una actividad.</td><td>Se registran observando el proceso o mediante un cronómetro.</td></tr>
<tr><td><b>Duración de actividad</b></td><td>Tiempo de una acción concreta.</td><td><b>Fin − inicio</b>. Si empieza a los 12 s y termina a los 29 s, dura <b>17 s</b>.</td></tr>
<tr><td><b>Tiempo de ciclo (Tc)</b></td><td>Tiempo entre el inicio y el fin de una repetición completa y comparable.</td><td>Fin del ciclo − inicio del ciclo. No sumar dos veces acciones simultáneas.</td></tr>
<tr><td><b>Tiempo ocupado del operario (To)</b></td><td>Tiempo realizando tareas y desplazamientos necesarios.</td><td>Sumar los tramos ocupados del operario dentro del ciclo.</td></tr>
<tr><td><b>Espera del operario (Te)</b></td><td>Tiempo sin otra tarea asignada durante el ciclo.</td><td>Tc − To, si todo el ciclo está clasificado.</td></tr>
<tr><td><b>Automático de máquina (Ta)</b></td><td>Tiempo de procesamiento sin intervención manual continua.</td><td>Sumar tramos automáticos de esa máquina.</td></tr>
<tr><td><b>Atención de máquina (Tat)</b></td><td>Carga, descarga o preparación del equipo por el trabajador.</td><td>Sumar tramos de atención; no confundir con Ta.</td></tr>
<tr><td><b>Inactividad de máquina (Ti)</b></td><td>Tiempo sin procesamiento automático ni atención.</td><td>Tc − Ta − Tat, cuando estos tres estados no se superponen.</td></tr>
</tbody></table></div><div class="callout"><b>¿Y los porcentajes?</b> Utilización del operario = To ÷ Tc × 100. Porcentaje automático de máquina = Ta ÷ Tc × 100. <b>Se reportan por separado</b>: si se incluye la atención, la ocupación total de máquina sería (Ta + Tat) ÷ Tc × 100.</div><p class="small muted">Si faltan observaciones, no se debe suponer que los huecos son esperas. Se registran como intervalos sin verificar.</p></section>`}

function scene3(){let qs=[['El trabajador introduce un frasco en la etiquetadora.','attention','Es una atención a la máquina; no significa procesamiento automático.'],['La máquina coloca etiquetas sin intervención manual continua.','auto','La máquina ejecuta el proceso automáticamente.'],['La máquina terminó su programa y espera una nueva carga.','idle','La máquina está disponible, pero sin procesar ni recibir atención.'],['El operario se desplaza a la otra estación.','walk','El desplazamiento es una actividad ocupada del operario.']];return head(2,'Clasificación · 8 minutos','Distingue trabajo manual, máquina atendida, procesamiento automático e inactividad.')+`<div class="grid2">${['<b>Trabajo del operario.</b> Tareas manuales o desplazamientos necesarios.','<b>Máquina atendida.</b> Se carga, descarga o prepara, sin ser necesariamente automática.','<b>Automática.</b> Procesa sin atención manual continua.','<b>Espera.</b> Un recurso no ejecuta una actividad en ese intervalo.'].map((x,i)=>`<div class="feature"><div class="colored-line" style="background:${[colors.clean,colors.attention,colors.auto,colors.idle][i]};width:80px"></div><p>${x}</p></div>`).join('')}</div><h3>Clasifica las situaciones</h3><p class="muted small">Elige la clasificación y pulsa «Comprobar». Puedes cambiar tu respuesta.</p>${qs.map((q,i)=>`<div class="feature" style="margin:12px 0"><b>${i+1}. ${q[0]}</b><div class="btnrow"><select class="control" style="max-width:330px" id="class${i}" onchange="App.classSelection(${i},this.value)"><option value="">Selecciona una categoría</option>${[['attention','Máquina atendida'],['auto','Operación automática'],['idle','Máquina inactiva'],['walk','Desplazamiento operario']].map(([v,l])=>`<option value="${v}" ${state.classify[i]===v?'selected':''}>${l}</option>`).join('')}</select><button class="btn small secondary" onclick="App.checkClass(${i})">Comprobar</button></div><div id="classFeedback${i}"></div></div>`).join('')}${call('Una máquina puede estar siendo cargada sin encontrarse en procesamiento automático. Esta diferencia será esencial en el ejercicio de las dos etiquetadoras.','warn')}`}
function classSelection(i,v){state.classify[i]=v;save()}
function checkClass(i){let answers=['attention','auto','idle','walk'];let explanations=['La carga corresponde a máquina atendida.','Procesa automáticamente sin atención manual continua.','No procesa ni está siendo atendida.','Caminar es tiempo ocupado del operario.'];let ok=state.classify[i]===answers[i];$('classFeedback'+i).innerHTML=`<div class="answer ${ok?'good':'bad'}">${ok?'✓ Correcto.':'Revisa tu clasificación.'} ${explanations[i]}</div>`}
function scene4(){let sc=Number(state.scale)||10;return head(3,'Escala temporal · 8 minutos','La escala permite dibujar las duraciones proporcionalmente y comparar actividades que suceden al mismo tiempo.')+`<h3>¿Por qué necesitamos una escala de tiempo?</h3><p>Imagina que un operario tarda <b>10 segundos cargando</b> una máquina y después <b>20 segundos esperando</b>. Si ambos bloques tienen igual longitud, parecería que duran lo mismo. Una escala evita esa confusión: <b>20 segundos deben ocupar el doble de espacio que 10 segundos</b>.</p><div class="grid2"><div class="feature"><h3>Sin proporción</h3><p class="small">Dos barras iguales ocultan la diferencia de duración.</p><div class="compare-row"><span>Carga 10 s</span><i class="compare-bar" style="width:60%;background:#176B80"></i></div><div class="compare-row"><span>Espera 20 s</span><i class="compare-bar" style="width:60%;background:#bbc3cb"></i></div></div><div class="feature"><h3>Con una escala común</h3><p class="small">La espera ocupa el doble de longitud.</p><div class="compare-row"><span>Carga 10 s</span><i class="compare-bar" style="width:28%;background:#176B80"></i></div><div class="compare-row"><span>Espera 20 s</span><i class="compare-bar" style="width:56%;background:#bbc3cb"></i></div></div></div><div class="callout"><b>¿Para qué sirve en el diagrama?</b> Para que las barras del operario y la máquina se puedan alinear sobre el mismo eje, reconocer simultaneidades y distinguir con claridad trabajo y espera. La escala cambia el <b>tamaño dibujado</b>, no la duración real.</div><div class="feature"><h3>Experimenta con la escala</h3><p>Una actividad siempre dura <b>30 segundos</b>. Cambia la escala y observa cuánto espacio ocupa su barra.</p><label for="scaleValue" class="formlabel">Escala para el papel</label><select class="control" id="scaleValue" onchange="App.setScale(this.value)" style="max-width:300px">${[5,10,20].map(v=>`<option value="${v}" ${v===sc?'selected':''}>1 cm = ${v} segundos</option>`).join('')}</select><div id="scaleGraphic" style="padding:20px 0">${drawScale(sc)}</div><b>Longitud en el papel: ${nf(30/sc,1)} cm</b></div><p><b>Cálculo:</b> longitud (cm) = duración (s) ÷ segundos representados por cada centímetro. En pantalla importa que las barras sean proporcionales; no hace falta que midan físicamente esos centímetros.</p><div class="feature"><b>Comprueba tu comprensión</b><p>Si cambiamos de 1 cm = 10 s a 1 cm = 5 s, ¿la actividad de 30 segundos tarda más?</p><select class="control" id="scaleConcept" style="max-width:540px"><option value="">Selecciona una respuesta</option><option value="yes">Sí, porque el bloque crece.</option><option value="no">No, cambia el espacio del dibujo, no el tiempo.</option></select><div class="btnrow"><button class="btn secondary" onclick="App.quickCheck()">Comprobar</button></div><div id="quickFeedback" aria-live="polite"></div></div>${call('Una escala representa <b>tiempo</b>, no distancia recorrida en metros. Para calcular distancias físicas se necesita medir el recorrido real.','warn')}`}
function drawScale(s){let width=30/s*35;return `<div style="height:39px;display:flex;align-items:center;gap:12px"><span class="muted small">0 s</span><div style="width:${width}px;max-width:75%;height:28px;background:var(--petrol);border-radius:5px;color:white;text-align:center;font-size:12px;padding-top:4px">30 segundos</div><span class="muted small">30 s</span></div>`}
function setScale(v){state.scale=Number(v);save();$('scaleGraphic').innerHTML=drawScale(Number(v));$('scaleGraphic').nextElementSibling.textContent=`Longitud gráfica: ${nf(30/Number(v),1)} cm`}
function quickCheck(){let v=pval('scaleConcept'),ok=v==='no';$('quickFeedback').innerHTML= v?`<div class="answer ${ok?'good':'bad'}">${ok?'Correcto. La actividad sigue durando 30 segundos.':'La longitud dibujada aumenta, pero la actividad sigue durando 30 segundos.'}</div>`:'<div class="answer bad">Selecciona una respuesta.</div>'}
function scene5(){let intervals=[['0–2 min','Primera etapa (2 minutos)'],['2–7 min','Segunda etapa (5 minutos)'],['7–8 min','Tercera etapa (1 minuto)']];let expected=[['carga','atencion'],['espera','automatico'],['descarga','atencion']];return head(4,'Ejemplo construido contigo · 12 minutos','Primero identifica qué hace cada recurso; después verás el diagrama y calcularás sus indicadores.')+`<div class="callout"><b>Situación:</b> una máquina requiere <b>2 minutos para cargar una pieza</b>, <b>5 minutos para procesarla automáticamente</b> y <b>1 minuto para descargarla</b>. Mientras la máquina procesa, el operario no tiene otras tareas asignadas y espera.</div><h3>Paso 1. Identifica las actividades, no copies un diagrama resuelto</h3><p>Para cada intervalo, decide qué hace el operario y cuál es el estado de la máquina. Solo cuando compruebes las seis decisiones se construirá el gráfico.</p><div class="scroll"><table class="table"><thead><tr><th>Intervalo</th><th>Operario</th><th>Máquina</th></tr></thead><tbody>${intervals.map((x,i)=>`<tr><td><b>${x[0]}</b><div class="small muted">${x[1]}</div></td><td><select class="control" aria-label="Operario intervalo ${i+1}" onchange="App.simpleSelect(${i},'op',this.value)"><option value="">¿Qué hace?</option>${[['carga','Carga la pieza'],['espera','Espera'],['descarga','Descarga el producto']].map(([v,t])=>`<option value="${v}" ${state.simpleRows?.[i]?.op===v?'selected':''}>${t}</option>`).join('')}</select></td><td><select class="control" aria-label="Máquina intervalo ${i+1}" onchange="App.simpleSelect(${i},'machine',this.value)"><option value="">¿Qué sucede?</option>${[['atencion','Recibe atención'],['automatico','Procesa automáticamente'],['inactiva','Permanece inactiva']].map(([v,t])=>`<option value="${v}" ${state.simpleRows?.[i]?.machine===v?'selected':''}>${t}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div><button class="btn" onclick="App.simpleValidate()">Comprobar actividades</button><div id="simpleSequenceFeedback" aria-live="polite"></div>${state.simpleValidated?`<h3>Paso 2. Observa el diagrama que acabas de construir</h3><p>Las respuestas correctas se convierten en bloques proporcionales. Revisa cómo el operario espera al mismo tiempo que la máquina procesa.</p>${timelineSVG([{resource:'op',kind:'attend',name:'Carga',start:0,end:2},{resource:'op',kind:'wait',name:'Espera',start:2,end:7},{resource:'op',kind:'attend',name:'Descarga',start:7,end:8},{resource:'m1',kind:'attention',name:'Atención',start:0,end:2},{resource:'m1',kind:'auto',name:'Automática',start:2,end:7},{resource:'m1',kind:'attention',name:'Atención',start:7,end:8}],8,['op','m1'],'min')}${legend()}<h3>Paso 3. Aprende los tiempos antes de calcularlos</h3><div class="grid2"><div class="feature"><b>Tiempo de ciclo (Tc)</b><p>Desde que inicia la carga hasta que termina la descarga; suma las tres etapas porque son consecutivas.</p></div><div class="feature"><b>Tiempo ocupado (To)</b><p>Solo los intervalos en que el operario trabaja: carga y descarga.</p></div><div class="feature"><b>Tiempo de espera (Te)</b><p>Intervalo en que no tiene otra tarea asignada mientras la máquina procesa. También Te = Tc − To.</p></div><div class="feature"><b>Utilización (Uo)</b><p>Porcentaje del ciclo que el operario estuvo ocupado: (To ÷ Tc) × 100.</p></div></div><h3>Paso 4. Ahora sí, calcula</h3>${calcButton('simpleCycle')}<div class="compact-cols">${input('simpleCycle','Tiempo de ciclo (min)',state.practice.cycle||'','text','Suma las 3 etapas','inputmode="decimal"')}${input('simpleWork','Tiempo ocupado operario (min)',state.practice.work||'','text','Carga + descarga','inputmode="decimal"')}${input('simpleWait','Tiempo de espera operario (min)',state.practice.wait||'','text','Tc − To','inputmode="decimal"')}${input('simpleUse','Utilización del operario (%)',state.practice.use||'','text','(To ÷ Tc) × 100','inputmode="decimal"')}</div><button class="btn gold" onclick="App.checkSimple()">Revisar mis cálculos</button><div id="simpleFeedback" aria-live="polite">${state.practice.checked?simpleFeedback():''}</div><h3>Paso 5. Interpreta, no solo calcules</h3><p>Si asignamos una tarea compatible durante la espera del operario, ¿eso hace automáticamente que la máquina termine antes su operación de 8 minutos? Explica por qué.</p>${textarea('simpleAnalysis','Tu interpretación',state.simpleAnalysis,'Argumenta con la diferencia entre ocupación del operario y duración del ciclo.')}<button class="btn secondary" onclick="App.setField('simpleAnalysis','simpleAnalysis')">Guardar mi interpretación</button>`:`<div class="callout warn">El gráfico y los cálculos se habilitan cuando identifiques correctamente qué hace cada recurso en los tres intervalos. Si te equivocas, podrás corregir sin comenzar de nuevo.</div>`}`}

function simpleSelect(i,field,value){state.simpleRows??={};state.simpleRows[i]??={};state.simpleRows[i][field]=value;state.simpleValidated=false;state.practice={};save()}
function simpleValidate(){const exp=[['carga','atencion'],['espera','automatico'],['descarga','atencion']];let errors=[];exp.forEach(([op,m],i)=>{let a=state.simpleRows?.[i]||{};if(a.op!==op||a.machine!==m)errors.push(`Intervalo ${i+1}: revisa qué hace el operario y qué ocurre con la máquina al mismo tiempo.`)});if(errors.length){$('simpleSequenceFeedback').innerHTML=`<div class="answer bad"><b>Necesitas ajustar ${errors.length} intervalo(s).</b><ul>${errors.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;return}state.simpleValidated=true;save();render()}

function checkSimple(){state.practice={cycle:pval('simpleCycle'),work:pval('simpleWork'),wait:pval('simpleWait'),use:pval('simpleUse'),checked:true};save();$('simpleFeedback').innerHTML=simpleFeedback()}
function simpleFeedback(){const p=state.practice;let checks=[['Tiempo de ciclo',p.cycle,8,'2 + 5 + 1'],['Tiempo ocupado',p.work,3,'2 + 1'],['Tiempo de espera',p.wait,5,'8 − 3'],['Utilización',p.use,37.5,'(3 ÷ 8) × 100']];let n=checks.filter(x=>Math.abs(number(x[1])-x[2])<.02).length;return `<div class="answer ${n===4?'good':'bad'}"><b>${n}/4 cálculos correctos.</b><ul>${checks.map(([label,v,expected,formula])=>`<li><b>${label}:</b> ${Math.abs(number(v)-expected)<.02?'correcto':`revisa qué intervalos sumaste; pista: ${formula}`}</li>`).join('')}</ul>${n===4?'<p>Asignar otra tarea al operario puede reducir su espera, pero no acelera por sí solo el procesamiento de la máquina.</p>':''}</div>`}
function scene6(){let prev=state.quizLast;return head(5,'Evaluación de aplicación · 12 minutos','Resuelve situaciones nuevas. No se repiten los números ni las respuestas del ejemplo anterior.')+`<div class="grid2"><div class="metric"><small>Intentos</small><b>${state.quizAttempts}</b></div><div class="metric"><small>Mejor calificación</small><b>${state.quizBest===null?'Pendiente':nf(state.quizBest,1)+' / 5,0'}</b></div></div><p>Interpreta casos, diagramas y decisiones. Responde las diez preguntas; cada acierto vale <b>0,5 puntos</b>. La retroalimentación aparecerá después de entregar tu intento.</p>${prev?`<div class="answer ${prev.score>=3.5?'good':'bad'}"><b>Último intento: ${nf(prev.score,1)} / 5,0.</b> Aciertos: ${prev.correct}/10. Revisa tus explicaciones o intenta nuevamente.</div>`:''}<div id="quizArea">${quiz.map((q,i)=>`<div class="feature" style="margin:14px 0"><b>${i+1}. ${q.q}</b>${i===6?calcButton():''}<div>${q.options.map((op,j)=>`<label class="choice"><input type="radio" name="quiz${i}" value="${j}" ${state.quizAnswers[i]===String(j)?'checked':''} onchange="App.quizSet(${i},this.value)"><span>${esc(op)}</span></label>`).join('')}</div>${prev?`<div class="answer ${prev.marks[i]?'good':'bad'}"><b>${prev.marks[i]?'Correcto':'Por corregir'}.</b> ${esc(q.why)}</div>`:''}</div>`).join('')}</div><div class="btnrow"><button class="btn gold" onclick="App.submitQuiz()">Calificar mi quiz</button><button class="btn secondary" onclick="App.resetQuiz()">Nuevo intento</button></div>${call('Finaliza al menos un intento para continuar con el caso principal. No se exige una nota mínima.','warn')}`}
function quizSet(i,v){state.quizAnswers[i]=v;save()}
function submitQuiz(){if(quiz.some((q,i)=>state.quizAnswers[i]===undefined||String(state.quizAnswers[i]).trim()==='')){flash('Responde las diez preguntas antes de calificar.','error');return}const marks=quiz.map((q,i)=>state.quizAnswers[i]===q.correct),c=marks.filter(Boolean).length;state.quizAttempts++;state.quizLast={correct:c,score:c*.5,marks};state.quizBest=Math.max(state.quizBest??0,c*.5);save();render();$('sceneView').scrollIntoView({behavior:'smooth'})}
function resetQuiz(){state.quizAnswers={};state.quizLast=null;save();render()}

function caseContext(){return `<div class="feature"><h3>1. Situación de la empresa</h3><p>Una empresa de cosméticos dispone de dos etiquetadoras automáticas para frascos de referencias distintas. <b>M1</b> coloca una etiqueta frontal; <b>M2</b>, con dos cabezales, aplica las etiquetas frontal y posterior. Los frascos no pasan de una máquina a otra.</p><p>Un solo operario atiende ambas estaciones: limpia frascos, retira unidades etiquetadas, carga y posiciona las nuevas y camina entre máquinas. No necesita vigilar permanentemente el procesamiento automático. Las máquinas pueden terminar y quedar detenidas hasta recibir atención.</p><p>La empresa te solicita construir un diagrama hombre–máquina para reconocer qué hace cada recurso, detectar tiempos inactivos y justificar una mejora.</p><h3>2. Condiciones para el análisis</h3><ul><li>Se estudia un proceso <b>repetitivo en régimen estable</b>, no el primer arranque.</li><li>Antes de cargar un frasco se limpia <b>fuera de la máquina</b>. Al atender un equipo, <b>primero se descarga</b> el producto terminado y <b>después se carga y posiciona</b> el siguiente.</li><li>El procesamiento automático empieza <b>al finalizar la carga</b>; no requiere atención manual continua.</li><li>Cada máquina puede esperar después de terminar su operación. Una operación puede atravesar el límite entre ciclos consecutivos.</li><li>El trabajador comienza preparando un frasco para M1, atiende esta máquina, se desplaza a M2, prepara y atiende esa estación y regresa a M1. <b>Tú debes reconstruir el orden exacto</b> en la siguiente escena.</li><li>El recorrido de ida y el de regreso se cronometran por separado y tienen igual duración.</li></ul><p><b>Límites del ciclo:</b> desde el comienzo de la limpieza para M1 hasta el regreso del operario a M1 listo para repetir las actividades.</p></div>`}
function caseResourceLinks(){return `<div class="btnrow"><a class="btn secondary" download href="Caso_Etiquetadoras_Estudiante.docx">↓ Descargar caso completo (Word)</a><a class="btn secondary" download href="Plantilla_Hombre_Maquina_Blanco.xlsx">↓ Plantilla Excel en blanco</a></div>`}

function scene7(){const d=[['Limpiar el siguiente frasco para M1','Operario','6,0'],['Descargar frasco terminado M1','Operario / M1','12,0'],['Cargar y posicionar nuevo frasco M1','Operario / M1','19,8'],['Etiquetado automático M1','Máquina 1','30,0'],['Caminar de M1 a M2, un sentido','Operario','4,2'],['Limpiar el siguiente frasco para M2','Operario','6,0'],['Descargar frasco terminado M2','Operario / M2','18,0'],['Cargar y posicionar nuevo frasco M2','Operario / M2','28,8'],['Etiquetado automático M2','Máquina 2','37,8'],['Regreso de M2 a M1','Operario','4,2']];return head(6,'Caso principal · 6 minutos','Lee el caso completo y consulta los tiempos antes de iniciar la construcción.')+caseContext()+`<h3>3. Datos completos del caso</h3><p>Todos los valores se expresan en <b>segundos</b>. La carga y la descarga se presentan como actividades diferentes.</p><div class="scroll"><table class="table"><thead><tr><th>Actividad</th><th>Recurso</th><th class="right">Duración (s)</th></tr></thead><tbody>${d.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td class="right">${x[2]}</td></tr>`).join('')}</tbody></table></div>${call('Nota de procedencia: la guía original aporta carga y descarga juntas (31,8 s para M1 y 46,8 s para M2). En este caso rediseñado se desagregan con <b>valores ilustrativos</b>: M1 = 12,0 + 19,8; M2 = 18,0 + 28,8. Los tiempos automáticos originales sí se conservan: 30,0 y 37,8 s.','warn')}${caseResourceLinks()}<div class="feature"><h3>4. Tu encargo</h3><ol><li>Organiza las ocho actividades del operario; calcula inicio, fin y duración.</li><li>Dibuja franjas del operario, M1 y M2 con una misma escala temporal.</li><li>Calcula tiempos ocupados, atención, automático e inactividad.</li><li>Justifica una posible mejora y descarga tus evidencias.</li></ol><p><b>Importante:</b> la secuencia del documento está narrada, no entregada como tabla resuelta. Tendrás que interpretarla.</p></div>`}
function scene8(){const feedback=state.orderFeedback;return head(7,'Secuencia · 10 minutos','Reconstruye las ocho acciones del operario y determina cuánto dura una repetición.')+`<details class="feature"><summary><b>Consultar el enunciado completo mientras trabajas</b></summary>${caseContext()}${caseResourceLinks()}</details><div class="callout"><b>Instrucciones paso a paso</b><ol><li>Lee el caso e identifica dónde comienza y termina una repetición.</li><li>Utiliza las flechas ↑ y ↓ para ordenar <b>ocho</b> actividades. Recuerda: primero se descarga el frasco terminado, después se carga el siguiente.</li><li>Presiona «Comprobar secuencia». Observa el resultado que permanecerá junto a las tarjetas y corrige lo que haga falta.</li><li>Cuando la secuencia esté correcta, suma sus duraciones en segundos. Son tareas consecutivas del operario: <b>no sumes los tiempos automáticos</b> como si fueran trabajo adicional.</li></ol></div><section class="feature"><h3>Paso 1. Organiza las ocho tarjetas</h3>${state.order.map((k,i)=>`<div class="stepbox"><span class="stepnum">${i+1}</span><div style="flex:1"><b>${esc(tasks[k][0])}</b><div class="small muted">Duración: ${nf(tasks[k][1],1)} s</div></div><div class="video-tools"><button class="btn small secondary" aria-label="Subir ${esc(tasks[k][0])}" onclick="App.moveTask(${i},-1)" ${i===0?'disabled':''}>↑</button><button class="btn small secondary" aria-label="Bajar ${esc(tasks[k][0])}" onclick="App.moveTask(${i},1)" ${i===7?'disabled':''}>↓</button></div></div>`).join('')}<button class="btn" onclick="App.checkOrder()">Comprobar secuencia</button><div id="orderFeedback" aria-live="polite">${feedback?`<div class="answer ${feedback.ok?'good':'bad'}"><b>${feedback.ok?'✓ Secuencia correcta: 8 de 8 actividades.':`Tienes ${feedback.hits} de 8 actividades en su posición correcta.`}</b><p>${feedback.ok?'Ahora puedes calcular el ciclo y continuar con la construcción.':'Revisa las posiciones que faltan. Recuerda que cada atención exige descargar antes de cargar y que el operario debe desplazarse entre estaciones.'}</p></div>`:''}</div></section><section class="feature" style="margin-top:16px"><h3>Paso 2. Calcula el tiempo del ciclo</h3><p><b>Tc</b> es el tiempo desde el inicio de la limpieza para M1 hasta regresar a M1. Como el trabajador ejecuta sus ocho acciones una detrás de otra, suma sus duraciones en segundos.</p>${calcButton('cycleGuess')}${input('cycleGuess','Tiempo de ciclo (segundos)',state.cycleGuess,'text','Escribe tu resultado','inputmode="decimal"')}<button class="btn secondary" onclick="App.checkCycle()">Comprobar mi cálculo</button>${state.cycleFeedback?`<div class="answer ${state.cycleFeedback.ok?'good':'bad'}"><b>${state.cycleFeedback.ok?'✓ Cálculo correcto.':'Revisa tu resultado.'}</b><p>${state.cycleFeedback.ok?'El tiempo de ciclo está validado y podrás utilizarlo en el constructor.':'Pista: suma ocho duraciones y cuenta tanto el viaje de ida como el de regreso; no agregues los tiempos automáticos.'}</p></div>`:''}</section><details class="feature"><summary><b>Necesito una pista</b></summary><p>Para cada estación se limpia el frasco, se retira el producto terminado y se carga el siguiente. El desplazamiento M1 → M2 sucede después de la atención de M1, y el regreso M2 → M1 después de atender M2.</p></details>`}
function moveTask(pos,dir){let t=pos+dir;if(t<0||t>=state.order.length)return;[state.order[pos],state.order[t]]=[state.order[t],state.order[pos]];state.orderChecked=false;state.orderFeedback=null;state.cycleChecked=false;state.cycleFeedback=null;save();render()}
function checkOrder(){let hits=state.order.filter((v,i)=>v===i).length;state.orderChecked=hits===tasks.length;state.orderFeedback={ok:state.orderChecked,hits};save();render();$('orderFeedback')?.scrollIntoView({block:'center',behavior:'smooth'})}
function checkCycle(){state.cycleGuess=pval('cycleGuess');const ok=state.orderChecked&&Math.abs(number(state.cycleGuess)-99)<.02;state.cycleChecked=ok;state.cycleFeedback={ok};save();render()}
function timelineSVG(events,total,resources=['op','m1','m2'],unit='s'){
 const W=850,L=115,P=690,rowH=47,H=78+resources.length*rowH; let out=`<div class="timeline-viewport"><svg role="img" aria-label="Diagrama de actividades sincronizadas" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"><rect width="${W}" height="${H}" rx="8" fill="#f9fbfb"/>`;
 for(let t=0;t<=5;t++){let x=L+t*P/5;out+=`<line x1="${x}" y1="26" x2="${x}" y2="${H-34}" stroke="#d5dfe5" stroke-dasharray="3 4"/><text x="${x}" y="${H-17}" font-size="11" text-anchor="middle" fill="#5b6974">${nf(t*total/5,total<10?1:0)}</text>`}
 resources.forEach((r,i)=>{let y=31+i*rowH;out+=`<text x="5" y="${y+19}" font-size="12" font-weight="750" fill="#112A46">${resourceText[r]||esc(r)}</text><rect x="${L}" y="${y}" width="${P}" height="31" rx="4" fill="#edf2f5"/>`;events.filter(e=>e.resource===r).forEach(e=>{let a=Math.max(0,Number(e.start)),b=Math.min(total,Number(e.end));if(!isFinite(a)||!isFinite(b)||b<=a||total<=0)return;let x=L+a/total*P,w=(b-a)/total*P,txt=w>73?esc(e.name||kindText[e.kind]||''):w>39?esc((e.name||kindText[e.kind]||'').slice(0,6)):' ';out+=`<rect x="${x.toFixed(3)}" y="${y}" width="${w.toFixed(3)}" height="31" fill="${colors[e.kind]||colors.unknown}" stroke="white" stroke-width="1" rx="2"><title>${esc(e.name||kindText[e.kind])}: ${nf(a)}–${nf(b)} ${unit}</title></rect><text x="${(x+w/2).toFixed(2)}" y="${y+19}" font-size="${w>80?10:9}" font-weight="700" text-anchor="middle" fill="${e.kind==='idle'||e.kind==='wait'||e.kind==='attention'||e.kind==='unknown'?'#243747':'white'}" pointer-events="none">${txt}</text>`})});out+=`<text x="${L+P/2}" y="${H-3}" font-size="11" text-anchor="middle" fill="#526777">Tiempo transcurrido (${unit})</text></svg></div>`;return out;
}
const statusOptions=(resource,selected)=>{let map=resource==='op'?[['clean','Limpieza'],['attend','Trabajo manual / atención'],['walk','Desplazamiento'],['wait','Espera']]:[['attention','Máquina atendida'],['auto','Operación automática'],['idle','Inactividad'],['unknown','No verificable']];return map.map(([v,t])=>`<option value="${v}" ${v===selected?'selected':''}>${t}</option>`).join('')};
function selectKindOptions(){let r=pval('blockResource');$('blockKind').innerHTML=statusOptions(r,'')}
function caseBlockForm(){let existing=state.caseFormEdit>=0?state.caseBlocks[state.caseFormEdit]:null,r=existing?.resource||'op';return `<div class="feature"><h3>${existing?'Editar actividad registrada':'Registrar un nuevo bloque'}</h3><p>Consulta el caso y selecciona quién actúa. Después indica <b>qué hace</b>, el <b>segundo inicial</b> y el <b>segundo final</b>. Verás la duración antes de guardar.</p><div class="compact-cols"><div class="formrow"><label class="formlabel" for="blockResource">1. Recurso</label><select class="control" id="blockResource" onchange="App.selectKindOptions()">${['op','m1','m2'].map(k=>`<option value="${k}" ${r===k?'selected':''}>${resourceText[k]}</option>`).join('')}</select></div><div class="formrow"><label class="formlabel" for="blockKind">2. Estado</label><select class="control" id="blockKind">${statusOptions(r,existing?.kind||'')}</select></div>${input('blockStart','3. Comienza en (s)',existing?.start??'','text','Ej.: 6,0','inputmode="decimal" oninput="App.previewCaseDuration()"')}${input('blockEnd','4. Termina en (s)',existing?.end??'','text','Ej.: 18,0','inputmode="decimal" oninput="App.previewCaseDuration()"')}</div>${calcButton('blockEnd')}<div class="answer" id="caseDurationPreview" role="status" aria-live="polite">${existing?`Duración del bloque: <b>${nf(existing.end-existing.start,2)} s</b>`:'Escribe inicio y fin para calcular su duración.'}</div>${input('blockName','5. Nombre preciso de la actividad (verbo + objeto)',existing?.name||'','text','Ej.: descargar frasco terminado de M1')}<div class="btnrow"><button class="btn" onclick="App.addCaseBlock()">${existing?'Guardar cambios':'Agregar al diagrama'}</button>${existing?'<button class="btn secondary" onclick="App.cancelBlockEdit()">Cancelar edición</button>':''}<button class="btn ghost" onclick="App.transferSequence()">Trasladar mis ocho actividades validadas</button></div><p class="footnote">No puedes colocar dos actividades superpuestas en el mismo recurso. Sí pueden existir actividades simultáneas del operario y la máquina.</p></div>`}
function previewCaseDuration(){let a=number(pval('blockStart')),b=number(pval('blockEnd')),o=$('caseDurationPreview');if(!o)return;o.innerHTML=Number.isFinite(a)&&Number.isFinite(b)&&b>a?`<b>Duración = ${nf(b,2)} − ${nf(a,2)} = ${nf(b-a,2)} s.</b> Esa longitud aparecerá a escala al agregar el bloque.`:'Escribe un inicio y un fin válidos, con fin posterior a inicio.'}

function scene9(){return head(8,'Constructor · 20 minutos','Construye primero la franja del operario y después las dos franjas de máquinas.')+`<details class="feature"><summary><b>Ver el caso completo y consultar los tiempos</b></summary>${caseContext()}${caseResourceLinks()}</details><div class="callout"><h3>¿Qué tienes que hacer?</h3><ol><li>Completa y valida la escena 8. Puedes pulsar <b>«Trasladar mis ocho actividades validadas»</b> o registrarlas una a una.</li><li>Para las máquinas, representa <b>por separado</b> las operaciones de descarga y carga, y ubica el proceso automático justo después de la carga.</li><li>Registra el instante inicial y final de cada bloque; la aplicación calculará <b>duración = fin − inicio</b>.</li><li>Completa también los intervalos de inactividad; recuerda que M2 procesa parte del ciclo anterior.</li><li>Revisa la sincronización y corrige los intervalos que sea necesario.</li></ol></div><div class="feature"><div class="panel-header"><b>Escala para dibujar</b><select id="caseScale" class="control" style="max-width:230px" onchange="App.setCaseScale(this.value)">${[5,10,20].map(v=>`<option value="${v}" ${Number(state.caseScale)===v?'selected':''}>1 cm = ${v} s</option>`).join('')}</select></div><p class="small muted">La escala indicada se guardará en las evidencias. En la pantalla las barras se dibujan proporcionalmente sin garantizar centímetros físicos.</p></div>${timelineSVG(state.caseBlocks,99,['op','m1','m2'])}${legend()}${caseBlockForm()}${state.caseSaveMessage?`<div class="answer good" role="status">${esc(state.caseSaveMessage)}</div>`:''}<h3>Bloques registrados: ${state.caseBlocks.length}</h3>${eventsTable(state.caseBlocks,'case')}<div class="btnrow"><button class="btn gold" onclick="App.reviewCase(true)">Revisar sincronización</button><button class="btn secondary" onclick="App.goto(9)">Calcular indicadores →</button></div>${state.caseReview?reviewHTML(state.caseReview):''}<details class="feature"><summary><b>Pista opcional: procesos que cruzan ciclos</b></summary><p>El procesamiento de M2 puede comenzar cerca del final de una repetición y terminar al comienzo de la siguiente. No lo sumes después del ciclo común ni supongas que la máquina está inactiva en el segundo cero.</p></details>`}
function addCaseBlock(){let e={resource:pval('blockResource'),kind:pval('blockKind'),name:pval('blockName').trim(),start:number(pval('blockStart')),end:number(pval('blockEnd'))};if(!e.name||!Number.isFinite(e.start)||!Number.isFinite(e.end)||e.start<0||e.end>99.0001||e.end<=e.start){state.caseSaveMessage='';flash('Registra el nombre, el inicio y el final de la actividad dentro del ciclo 0–99 s.','error');return}let others=state.caseBlocks.filter((_,i)=>i!==state.caseFormEdit);if(others.some(o=>o.resource===e.resource&&e.start<o.end-.0001&&e.end>o.start+.0001)){state.caseSaveMessage='';flash('Un recurso no puede tener dos estados simultáneos. Revisa los intervalos en esa franja.','error');return}let wasEdit=state.caseFormEdit>=0;if(wasEdit)state.caseBlocks[state.caseFormEdit]=e;else state.caseBlocks.push(e);state.caseBlocks.sort((a,b)=>['op','m1','m2'].indexOf(a.resource)-['op','m1','m2'].indexOf(b.resource)||a.start-b.start);state.caseFormEdit=-1;state.caseReview=null;state.caseSaveMessage=`✓ ${wasEdit?'Actividad actualizada':'Actividad agregada'}: ${e.name}, de ${nf(e.start,1)} a ${nf(e.end,1)} s; duración ${nf(e.end-e.start,1)} s.`;save();render()}
function editCaseBlock(i){state.caseFormEdit=i;render();$('blockResource')?.scrollIntoView({behavior:'smooth',block:'center'})}
function cancelBlockEdit(){state.caseFormEdit=-1;render()}
function removeCaseBlock(i){state.caseBlocks.splice(i,1);state.caseReview=null;state.caseFormEdit=-1;state.caseSaveMessage='Actividad eliminada. Revisa ahora si el intervalo quedó sin clasificar.';save();render()}
function transferSequence(){if(!state.orderChecked||!state.cycleChecked){flash('Valida primero las ocho tarjetas y el ciclo en la escena 8.','warn');return}state.caseBlocks=[...state.caseBlocks.filter(x=>x.resource!=='op'),...refOp.map(x=>({...x}))];state.caseReview=null;state.caseFormEdit=-1;state.caseSaveMessage='✓ Se trasladaron tus ocho actividades validadas del operario. Ahora construye M1 y M2.';save();render()}
function eventsTable(events,mode){if(!events.length)return `<div class="callout warn">Todavía no has registrado actividades.</div>`;return `<div class="scroll"><table class="table"><thead><tr><th>Recurso / actividad</th><th>Estado</th><th class="right">Inicio</th><th class="right">Fin</th><th class="right">Dur.</th><th>Acciones</th></tr></thead><tbody>${events.map((e,i)=>`<tr><td><b>${resourceText[e.resource]||esc(e.resource)}</b><div class="small">${esc(e.name)}</div></td><td><span class="tag">${kindText[e.kind]||esc(e.kind)}</span></td><td class="right">${nf(e.start)}</td><td class="right">${nf(e.end)}</td><td class="right">${nf(e.end-e.start)}</td><td><div class="btnrow" style="margin:0"><button class="btn small secondary" onclick="App.${mode==='case'?'editCaseBlock':'editVideoMark'}(${i})">Editar</button><button class="btn small warn" onclick="App.${mode==='case'?'removeCaseBlock':'removeVideoMark'}(${i})">×</button></div></td></tr>`).join('')}</tbody></table></div>`}
function evaluateCase(){let errs=[];for(let r of ['op','m1','m2']){let ours=state.caseBlocks.filter(e=>e.resource===r),orig=reference.filter(e=>e.resource===r);let matched=new Set(),missing=[],extras=[];orig.forEach((x,i)=>{let idx=ours.findIndex((y,j)=>!matched.has(j)&&y.kind===x.kind&&Math.abs(y.start-x.start)<.04&&Math.abs(y.end-x.end)<.04);if(idx>=0)matched.add(idx);else missing.push(x)});ours.forEach((e,j)=>{if(!matched.has(j))extras.push(e)});if(missing.length||extras.length){let hints=[];if(missing.length)hints.push(`${missing.length} bloque(s) requieren revisión; compara el inicio y el final de cada actividad con tu secuencia.`);if(extras.length)hints.push(`${extras.length} bloque(s) no coinciden con los intervalos esperados.`);if(missing.some(e=>e.kind==='attention'))hints.push('Carga y descarga deben aparecer en bloques separados, aunque ambas son atención de máquina.');if(r==='m2'&&missing.some(e=>e.kind==='auto'))hints.push('Revisa la operación automática que continúa entre dos ciclos.');errs.push({resource:r,details:hints,count:hints.length})}}return {good:errs.length===0&&state.caseBlocks.length===reference.length,errs,matched:reference.length-errs.reduce((a,x)=>a+x.count,0)}}
function reviewCase(show){if($('caseConclusion'))state.caseConclusion=pval('caseConclusion');state.caseReview=evaluateCase();state.caseReviewCount++;save();render();if(show)$('reviewPanel')?.scrollIntoView({behavior:'smooth',block:'center'})}
function reviewHTML(rev){return `<div id="reviewPanel" class="answer ${rev.good?'good':'bad'}"><b>${rev.good?'✓ Las franjas coinciden con los tiempos y estados de referencia.':'Revisión: aún hay aspectos por corregir.'}</b>${rev.good?'<p>Las actividades están correctamente sincronizadas. Explica ahora cómo calculaste la utilización de cada recurso.</p>':`<p>Se encontraron inconsistencias en ${rev.errs.length} recurso(s). Estas son pistas de revisión, no una solución automática:</p><ul>${rev.errs.map(x=>`<li><b>${resourceText[x.resource]}:</b> ${x.details.map(esc).join('; ')}${x.count>4?'; y otros intervalos':''}.</li>`).join('')}</ul><p class="small">Consulta si faltan actividades al comienzo o al final del ciclo. La operación de M2 cruza el límite entre ciclos consecutivos.</p>`}</div>`}
const calcDefinitions=[['opCycle','Tiempo de ciclo común (s)',99],['opWork','Tiempo ocupado operario (s)',99],['opWait','Espera operario (s)',0],['opPercent','Utilización operario (%)',100],['m1Auto','M1: procesamiento automático (s)',30],['m1Attention','M1: atención (s)',31.8],['m1Idle','M1: inactividad (s)',37.2],['m1Percent','M1: procesamiento automático (%)',30/99*100],['m2Auto','M2: procesamiento automático (s)',37.8],['m2Attention','M2: atención (s)',46.8],['m2Idle','M2: inactividad (s)',14.4],['m2Percent','M2: procesamiento automático (%)',37.8/99*100]];
function scene10(){let res=state.caseCalcResult;let groups=[{title:'Paso 1. Tiempo de ciclo',desc:'Tc: intervalo desde que comienza la primera actividad hasta regresar al mismo estado. Se obtiene como fin del ciclo − inicio del ciclo; aquí todos los recursos comparten ese mismo intervalo.',keys:['opCycle']},{title:'Paso 2. Tiempo del operario',desc:'To: suma de limpieza, descarga, carga y desplazamientos. Te = Tc − To cuando todo el ciclo se ha clasificado. Uo = To ÷ Tc × 100.',keys:['opWork','opWait','opPercent']},{title:'Paso 3. Máquina 1',desc:'Tat = descarga + carga de M1; Ta = duración de su procesamiento automático; Ti = Tc − Tat − Ta. Porcentaje automático = Ta ÷ Tc × 100.',keys:['m1Attention','m1Auto','m1Idle','m1Percent']},{title:'Paso 4. Máquina 2',desc:'La descarga y la carga se suman como atención, pero se dibujan por separado. Cuenta dentro del ciclo las partes de procesamiento automático que cruzan sus límites.',keys:['m2Attention','m2Auto','m2Idle','m2Percent']}];let defs=Object.fromEntries(calcDefinitions.map(([k,label])=>[k,label]));return head(9,'Indicadores explicados · 15 minutos','Aprende qué representa cada tiempo, señala sus bloques y calcula paso a paso.')+`${call('<b>Antes de calcular:</b> duración de un bloque = fin − inicio. Después suma únicamente las duraciones que correspondan al indicador. No dupliques el tiempo que transcurre simultáneamente en varios recursos.') }<div class="btnrow"><button class="btn secondary" onclick="App.goto(8)">← Ver mi diagrama</button></div>${groups.map((g,i)=>`<section class="feature" style="margin:16px 0"><h3>${g.title}</h3><p>${g.desc}</p>${calcButton()}<div class="compact-cols">${g.keys.map(k=>input('calc_'+k,defs[k],state.caseInputs[k]??'','text','Consulta tus intervalos','inputmode="decimal" onchange="App.cacheCalcInput(this.id,this.value)"')).join('')}</div><details><summary><b>Cómo calcularlo, sin mostrar la respuesta</b></summary><p class="small">Ubica en tu diagrama los bloques de esta categoría, calcula cada duración con fin − inicio, suma los tramos sin contarlos dos veces y, para el porcentaje, divide entre Tc y multiplica por 100.</p></details></section>`).join('')}<button class="btn gold" onclick="App.checkCalculations()">Comprobar mis indicadores</button>${res?`<div class="answer ${res.correct===12?'good':'bad'}"><b>${res.correct}/12 indicadores correctos.</b>${res.errors.length?`<ul>${res.errors.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p>Resultados consistentes con el ciclo y los estados del caso.</p>'}</div>`:''}${call('Un indicador de procesamiento automático no equivale a ocupación total de máquina. Esta última suma atención + automático antes de dividir entre el ciclo. No confundas sus nombres.','warn')}` }
function cacheCalcInput(id,value){state.caseInputs[id.replace(/^calc_/, '')]=value;save()}

function checkCalculations(){let c=0,errors=[];for(let [k,l,expect] of calcDefinitions){let v=pval('calc_'+k);state.caseInputs[k]=v;if(isFinite(number(v))&&Math.abs(number(v)-expect)<(k.endsWith('Percent')?.06:.06))c++;else errors.push(`${l}: revisa el valor o las unidades.`)}state.caseCalcResult={correct:c,errors};save();render()}
function scene11(){return head(10,'Revisión del método · 10 minutos','Revisa la secuencia, la cobertura de las tres franjas y tus cálculos antes de proponer cambios.')+`<div class="grid3"><div class="metric"><small>Bloques registrados</small><b>${state.caseBlocks.length}</b></div><div class="metric"><small>Cálculos correctos</small><b>${state.caseCalcResult?.correct??0}/12</b></div><div class="metric"><small>Revisiones efectuadas</small><b>${state.caseReviewCount}</b></div></div><div class="btnrow"><button class="btn gold" onclick="App.reviewCase(true)">Revisar mi diagrama</button><button class="btn secondary" onclick="App.goto(8)">Corregir las franjas</button><button class="btn secondary" onclick="App.goto(9)">Corregir indicadores</button></div>${state.caseReview?reviewHTML(state.caseReview):'<div class="callout">La revisión señalará intervalos con actividades faltantes, clasificaciones incorrectas o datos temporalmente inconsistentes. No mostrará directamente la solución antes del intento.</div>'}<h3>Pregunta de sustentación</h3><p>¿Por qué el procesamiento automático de la máquina 2 aparece al comienzo y al final del ciclo común?</p>${textarea('caseConclusion','Escribe tu conclusión del método actual',state.caseConclusion,'Incluye datos, diferencias entre máquina y operario y una observación crítica.')}<button class="btn secondary" onclick="App.setField('caseConclusion','caseConclusion')">Guardar conclusión</button>`}
function defaultSim(){return {clean:6,travel:4.2,unload1:12,load1:19.8,unload2:18,load2:28.8,auto1:30,auto2:37.8}}
function simValues(){let s=state.sim,att1=s.unload1+s.load1,att2=s.unload2+s.load2;let work=2*s.clean+2*s.travel+att1+att2,min1=att1+s.auto1,min2=att2+s.auto2,cycle=Math.max(work,min1,min2),opWait=cycle-work;return {work,att1,att2,min1,min2,cycle,opWait,red:(99-cycle)/99*100,bottleneck:Math.abs(cycle-min1)<.001?'Máquina 1':Math.abs(cycle-min2)<.001?'Máquina 2':'Operario'}}
function setSimPreset(mode){state.simMode=mode;state.simPrediction='';state.simReveal=false;state.sim=mode==='a'?{...defaultSim(),clean:0}:mode==='b'?{...defaultSim(),clean:0,travel:0}:defaultSim();save();render()}
function simTimeline(){let s=state.sim,v=simValues(),at=0,blocks=[];function add(k,name,d){if(d>0)blocks.push({resource:'op',kind:k,name,start:at,end:at+d});at+=d}add('clean','Limpiar M1',s.clean);add('attend','Descargar M1',s.unload1);add('attend','Cargar M1',s.load1);add('walk','Caminar M2',s.travel);add('clean','Limpiar M2',s.clean);add('attend','Descargar M2',s.unload2);add('attend','Cargar M2',s.load2);add('walk','Regresar M1',s.travel);if(v.opWait>0)add('wait','Espera operario',v.opWait);
function machine(r,start,unload,load,auto){let arr=[];let intervals=[['attention','Descarga',start,unload],['attention','Carga',start+unload,load],['auto','Automática',start+unload+load,auto]];for(let [kind,name,a,len] of intervals){if(len<=0)continue;for(let n=-1;n<=1;n++){let lo=Math.max(0,a+n*v.cycle),hi=Math.min(v.cycle,a+n*v.cycle+len);if(hi>lo+.0001)arr.push({resource:r,kind,name,start:lo,end:hi})}}let pp=[0,v.cycle,...arr.flatMap(x=>[x.start,x.end])].sort((a,b)=>a-b);for(let i=0;i<pp.length-1;i++){let a=pp[i],b=pp[i+1];if(b>a+.001&&!arr.some(x=>x.start<=a+.001&&x.end>=b-.001))arr.push({resource:r,kind:'idle',name:'Inactividad',start:a,end:b})}return arr}
blocks.push(...machine('m1',s.clean,s.unload1,s.load1,s.auto1),...machine('m2',s.clean+v.att1+s.travel+s.clean,s.unload2,s.load2,s.auto2));return blocks}
function scene12(){let s=state.sim,v=simValues();return head(11,'Simulador de mejoras · 15 minutos','Modifica las duraciones de tareas identificadas y comprueba si el ciclo cambia.')+`<p>Primero elige un escenario. Después puedes modificar cada tiempo de <b>carga y descarga por separado</b>. Antes de comprobar, escribe cuánto crees que durará el ciclo.</p><div class="grid3">${[['base','Método actual'],['a','A · Limpieza previa'],['b','B · Limpieza previa y sin viajes']].map(([m,n])=>`<button class="btn ${state.simMode===m?'gold':'secondary'}" onclick="App.setSimPreset('${m}')">${n}</button>`).join('')}</div><section class="feature" style="margin-top:16px"><h3>Datos que puedes cambiar (segundos)</h3>${calcButton()}<div class="compact-cols">${[['clean','Limpiar cada frasco'],['travel','Desplazamiento por trayecto'],['unload1','Descargar M1'],['load1','Cargar M1'],['unload2','Descargar M2'],['load2','Cargar M2'],['auto1','Automática M1'],['auto2','Automática M2']].map(([k,l])=>input('sim_'+k,l,s[k],'number','','min="0" max="500" step="0.1"')).join('')}</div><button class="btn secondary" onclick="App.applySim()">Actualizar los tiempos</button></section><section class="feature"><h3>Predice primero</h3><p>La duración del ciclo está limitada por el trabajo del operario y por la secuencia atención + proceso automático de cada equipo.</p>${input('simPrediction','Mi estimación del nuevo ciclo (s)',state.simPrediction,'text','Escribe una predicción','inputmode="decimal"')}${calcButton('simPrediction')}<button class="btn gold" onclick="App.revealSim()">Comprobar predicción y ver diagramas</button></section>${state.simReveal?`<div class="grid3"><div class="metric"><small>Ciclo teórico</small><b>${nf(v.cycle,2)} s</b></div><div class="metric"><small>Cambio frente al caso</small><b>${nf(v.red,2)} %</b></div><div class="metric"><small>Espera del operario</small><b>${nf(v.opWait,2)} s</b></div></div><div class="answer ${Math.abs(number(state.simPrediction)-v.cycle)<.05?'good':'bad'}"><b>Tu predicción: ${nf(number(state.simPrediction),2)} s.</b> El modelo obtiene ${nf(v.cycle,2)} s. Recurso limitante: <b>${esc(v.bottleneck)}</b>.</div>${timelineSVG(simTimeline(),v.cycle,['op','m1','m2'])}${legend()}${call(`Trabajo del operario: ${nf(v.work,2)} s; mínimo técnico M1 = ${nf(v.min1,2)} s; mínimo técnico M2 = ${nf(v.min2,2)} s. El mayor determina el ciclo mínimo teórico bajo las condiciones del caso.`)}`:'<div class="callout warn">El simulador mostrará resultados después de introducir una predicción y comprobarla.</div>'}${textarea('simReflection','¿Qué cambiarías y cómo comprobarías que realmente mejora?',state.simReflection,'Considera seguridad, calidad, costo y carga de trabajo.')}<button class="btn secondary" onclick="App.setField('simReflection','simReflection')">Guardar mi propuesta</button><p class="footnote">Modelo teórico para visitas en secuencia fija y régimen estable. No demuestra por sí solo una mejora implementada en planta. La limpieza previa requiere una persona o estación adicional que debe justificarse.</p>`}
function revealSim(){let x=number(pval('simPrediction'));if(!isFinite(x)||x<=0){flash('Escribe una predicción de tiempo de ciclo válida.','warn');return}state.simPrediction=String(x);state.simReveal=true;save();render()}
function applySim(){let x={};for(let k of ['clean','travel','unload1','load1','unload2','load2','auto1','auto2']){x[k]=number(pval('sim_'+k));if(!Number.isFinite(x[k])||x[k]<0||x[k]>500){flash('Los tiempos deben estar entre 0 y 500 segundos.','error');return}}state.sim=x;state.simMode='custom';state.simPrediction='';state.simReveal=false;save();render()}

function aiPrompt(mode='case'){
if(mode==='case')return `Actúa como ingeniero industrial especialista en Métodos y Tiempos y docente universitario. Revisa mi ejercicio de dos etiquetadoras atendidas por un operario.\n\nDATOS ORIGINALES (segundos): limpieza por frasco 6; carga/descarga M1 31,8; carga/descarga M2 46,8; desplazamiento en un sentido 4,2; automático M1 30; automático M2 37,8. Ciclo repetitivo en régimen estable. La limpieza se hace fuera de la máquina y las operaciones automáticas no requieren vigilancia continua.\n\nMI DIAGRAMA (segundos):\n${JSON.stringify(state.caseBlocks.map(e=>({recurso:resourceText[e.resource],actividad:e.name,estado:kindText[e.kind],inicio:e.start,fin:e.end})),null,2)}\n\nMIS INDICADORES:\n${calcDefinitions.map(([k,l])=>l+': '+(state.caseInputs[k]??'Sin responder')).join('\n')}\n\nMI ANÁLISIS:\n${state.caseConclusion||'Sin registrar'}\n\nMI PROPUESTA:\n${state.simReflection||'Sin registrar'}\n\nSOLICITUD: comprueba límites del ciclo, secuencia, sincronización, máquina 2 que procesa desde el ciclo anterior, atención frente a operación automática, inactividad, porcentajes y la viabilidad de la propuesta. No inventes datos ni actividades. Distingue correcto, por corregir y no verificable. Organiza los hallazgos en una tabla con evidencia, error, explicación y pista para corregir. No me des directamente toda la solución antes de explicarme los errores. Hazme tres preguntas para defender mi trabajo.`;
return `Actúa como ingeniero industrial especializado en estudio de métodos y medición del trabajo. Analiza mi registro de un video industrial. No asumas que has visto el video: solo tienes mi descripción y mi registro, salvo que yo lo adjunte por separado. No inventes tiempos ni estados de la máquina.\n\nINTERVALO DEL VIDEO ELEGIDO (s): ${state.videoCycleStart} a ${state.videoCycleEnd}.\n\nREGISTRO OBSERVADO:\n${JSON.stringify(state.videoMarks.map(e=>({recurso:resourceText[e.resource],actividad:e.name,estado:kindText[e.kind],inicio:e.start,fin:e.end,evidencia:e.evidence})),null,2)}\n\nINTERPRETACIÓN DEL PROCESO:\n${state.videoObservation||'No registrada'}\n\nLIMITACIONES DE OBSERVACIÓN:\n${state.videoLimitations||'No registradas'}\n\nPROPUESTA DE MEJORA:\n${state.videoImprovement||'No registrada'}\n\nComprueba consistencia temporal, simultaneidad, cobertura del ciclo, clasificación, cálculos y solidez de mis conclusiones. Distingue lo observado, lo inferido y lo no verificable. Si una toma, corte de edición o cámara lenta original impide deducir tiempo real, adviértelo. Presenta una tabla de hallazgos, preguntas para que corrija y una valoración orientativa sin afirmar datos no disponibles.`}
function scene13(){let prompt=aiPrompt('case');return head(12,'Revisión con IA · 8 minutos','Copia un prompt preparado con tus propios registros y revisa críticamente la respuesta de la IA.')+`<p>La revisión interna compara tu diagrama con datos conocidos. Una IA externa puede ayudarte a examinar tu explicación, encontrar contradicciones y formular preguntas para defender tu propuesta.</p><div class="callout warn"><b>Importante:</b> abrir la IA no significa que haya recibido automáticamente tu trabajo. Primero copia el prompt y pégalo en la herramienta elegida. Para revisar el gráfico completo, adjunta también el archivo Excel o la imagen PNG.</div>${textarea('aiPromptText','Prompt personalizado de revisión',prompt)}<div class="btnrow"><button class="btn gold" onclick="App.copyText('aiPromptText')">▣ Copiar mi prompt</button><a class="btn secondary" href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">ChatGPT ↗</a><a class="btn secondary" href="https://gemini.google.com/" target="_blank" rel="noopener noreferrer">Gemini ↗</a><a class="btn secondary" href="https://copilot.microsoft.com/" target="_blank" rel="noopener noreferrer">Copilot ↗</a></div>${textarea('aiReflection','¿Qué observaciones de la IA consideraste válidas y qué corregiste?',state.aiReflection,'Justifica con datos y no aceptes recomendaciones sin verificarlas.')}<button class="btn secondary" onclick="App.setField('aiReflection','aiReflection')">Guardar reflexión</button>`}

function scene14(){return head(13,'Evidencias · 8 minutos','Descarga tu trabajo del caso principal con tu nombre y apellidos, listo para revisar o entregar.')+`<div class="grid3"><div class="feature"><span class="iconcircle">▤</span><h3>Excel diligenciado</h3><p>Formato, registro cronológico, indicadores, diagrama y conclusiones.</p><button class="btn" onclick="App.exportExcel('case')">↓ Descargar Excel</button></div><div class="feature"><span class="iconcircle">▥</span><h3>Gráfico PNG</h3><p>Diagrama de barras proporcional con tiempo, leyenda y nombre.</p><button class="btn" onclick="App.exportPNG('case')">↓ Descargar imagen</button></div><div class="feature"><span class="iconcircle">□</span><h3>Plantilla en blanco</h3><p>Archivo editable con operario y hasta cuatro máquinas.</p><a href="Plantilla_Hombre_Maquina_Blanco.xlsx" download class="btn secondary">↓ Plantilla Excel</a></div></div>${timelineSVG(state.caseBlocks,99,['op','m1','m2'])}${legend()}${textarea('caseConclusion','Conclusión del caso (6–10 líneas recomendadas)',state.caseConclusion,'Explica utilización, inactividad y una oportunidad de mejora.') }<div class="btnrow"><button class="btn secondary" onclick="App.setField('caseConclusion','caseConclusion')">Guardar conclusión</button><button class="btn secondary" onclick="App.reviewCase(false)">Última revisión</button></div>${state.caseReview?reviewHTML(state.caseReview):''}${call('Si un indicador o intervalo aún es incorrecto, puedes descargar un borrador y corregirlo. La descarga no certifica una calificación ni reemplaza la valoración de la docente.','warn')}`}
function videoSection(full=true){let x=`<div class="video-box"><video id="studyVideo" controls playsinline preload="metadata"><source src="media/diagrama-hombre-maquina.mp4" type="video/mp4">Tu navegador no admite este video HTML5.</video></div><div class="feature" style="margin-top:14px"><div class="panel-header"><b>Control de reproducción</b><span class="tag" id="videoClock">00:00.0</span></div><div class="video-tools"><button class="btn small secondary" onclick="App.jumpVideo(-5)">↶ 5 s</button><button class="btn small secondary" onclick="App.togglePlay()">▶ / ❚❚</button><button class="btn small secondary" onclick="App.jumpVideo(5)">5 s ↷</button><button class="btn small secondary" onclick="App.stopLoop()">Detener repetición</button></div><label class="formlabel" style="margin-top:15px">Velocidad de reproducción</label><div class="video-tools">${[.25,.5,.75,1].map(a=>`<button class="btn small secondary speed-button" data-speed="${a}" onclick="App.videoSpeed(${a})">${String(a).replace('.',',')}×${a===1?' normal':''}</button>`).join('')}</div></div>`;
 if(full)x+=`<div class="timer" style="margin-top:13px"><div class="small" style="color:#d0dfe8">CRONÓMETRO SINCRONIZADO CON LA GRABACIÓN</div><output id="timerReadout">00:00.0</output><div class="video-tools" style="justify-content:center;margin-top:10px"><button class="btn gold" onclick="App.markVideoStart()">⚑ Marcar inicio</button><button class="btn secondary" onclick="App.markVideoEnd()">⚑ Marcar fin</button></div><div class="small" id="selectedDuration" style="margin-top:9px;color:#f1d089">Selecciona los límites de una actividad</div></div>`;return x}
function scene15(){return head(14,'Observación y cronometraje · 20 minutos','Primero comprende las operaciones visibles y utiliza esos nombres para registrar tus actividades; después mídeles su duración.')+`<div class="feature observation-brief"><span class="eyebrow">Guía inicial de observación</span><h3>Carga, posicionamiento y descarga de piezas metálicas en una máquina automatizada</h3><p>Durante el video se pueden observar estas acciones del trabajador:</p><ol><li>Manipula piezas metálicas alargadas, similares a ejes o vástagos.</li><li>Las coloca y ajusta en los soportes.</li><li>Interactúa con la zona de trabajo y los controles de la máquina.</li><li>Permanece en espera durante parte del funcionamiento del equipo.</li><li>Vuelve a intervenir para continuar el proceso.</li></ol><p><b>Para nombrar tus registros</b>, utiliza verbos concretos: «tomar pieza», «posicionar pieza», «ajustar soporte», «accionar control», «observar/esperar» o «retirar pieza», únicamente cuando correspondan a lo que veas. No son tiempos ni la secuencia ya resuelta.</p></div>${call('<b>Precaución:</b> permanecer frente a la máquina no prueba por sí solo que el operario esté inactivo, ni permite afirmar que la máquina está procesando automáticamente. Marca «Inferido» o «No verificable» cuando la grabación no lo demuestre.','warn')}<h3>Paso 1. Observa con el reproductor y marca cada intervalo</h3><p>Reduce la velocidad si lo necesitas. Pulsa <b>Marcar inicio</b> cuando comienza la acción y <b>Marcar fin</b> cuando termina. El cronómetro toma el tiempo del <b>video</b>, no el tiempo que tardas viéndolo en cámara lenta.</p>${videoSection(true)}<div class="feature" style="margin-top:16px"><h3>Paso 2. Comprueba la duración y nombra la actividad</h3><p>Después de marcar ambos extremos, el sistema calculará <b>duración = fin − inicio</b>. Puedes corregir manualmente las marcas si necesitas mayor precisión.</p><div class="compact-cols">${input('videoStartInput','Inicio de actividad (s)',videoDraft.start??'','text','Ej.: 12,4','inputmode="decimal" oninput="App.previewVideoDuration()"')}${input('videoEndInput','Fin de actividad (s)',videoDraft.end??'','text','Ej.: 21,7','inputmode="decimal" oninput="App.previewVideoDuration()"')}<div class="formrow"><label class="formlabel" for="videoResource">Recurso observado</label><select class="control" id="videoResource" onchange="App.updateVideoKinds()">${['op','m1'].map(r=>`<option value="${r}">${r==='m1'?'Máquina observada':resourceText[r]}</option>`).join('')}</select></div><div class="formrow"><label class="formlabel" for="videoKind">Clasificación</label><select class="control" id="videoKind">${videoKindOptions('op')}</select></div></div>${calcButton()}<div id="videoDurationResult" class="duration-result" role="status" aria-live="polite">Duración de la actividad: <b>—</b>. Marca inicio y fin para calcularla.</div>${input('videoActivity','Nombre de la actividad (verbo + objeto)','','text','Ej.: posicionar la pieza en el soporte')}<div class="formrow"><label class="formlabel" for="videoEvidence">Grado de certeza</label><select class="control" id="videoEvidence"><option value="observado">Observado directamente</option><option value="inferido">Inferido: hace falta comprobar</option><option value="no verificable">No verificable en esta grabación</option></select></div><div class="btnrow"><button class="btn gold" onclick="App.saveVideoMark()">Guardar actividad y duración</button><button class="btn secondary" onclick="App.cancelVideoEdit()">Limpiar formulario</button></div><p class="small muted">Puedes registrar actividades simultáneas para recursos distintos. Nunca supongas que un intervalo sin medir es inactividad.</p></div>${state.videoSaveMessage?`<div class="answer good" role="status">${esc(state.videoSaveMessage)}</div>`:''}<h3>Paso 3. Revisa tu registro cronológico · ${state.videoMarks.length} actividades</h3>${videoMarksTable()}<div class="btnrow"><button class="btn" onclick="App.goto(15)">Construir el diagrama con mis mediciones →</button></div>`}
function videoKindOptions(r,selected=''){let set=r==='op'?[['attend','Manipulación / atención manual'],['clean','Limpieza / preparación'],['walk','Desplazamiento'],['wait','Espera'],['unknown','No verificable']]:[['attention','Máquina atendida'],['auto','Procesamiento automático'],['idle','Inactividad'],['unknown','Estado no verificable']];return set.map(([k,l])=>`<option value="${k}" ${k===selected?'selected':''}>${l}</option>`).join('')}

function setupVideo(){videoObj=$('studyVideo');if(!videoObj)return;videoObj.addEventListener('loadedmetadata',()=>{if(videoCurrent>0&&videoCurrent<videoObj.duration)videoObj.currentTime=videoCurrent});videoObj.addEventListener('timeupdate',()=>{videoCurrent=videoObj.currentTime;if($('videoClock'))$('videoClock').textContent=formatTime(videoCurrent);if($('timerReadout'))$('timerReadout').textContent=formatTime(videoCurrent);if(videoLoop&&videoObj.currentTime>=videoLoop.end-.035){videoObj.currentTime=videoLoop.start;if(videoObj.paused)videoObj.play().catch(()=>{})}});videoObj.addEventListener('error',()=>{let d=$('videoError');if(!d){let e=document.createElement('div');e.id='videoError';e.className='answer bad';e.textContent='No se encontró el video. Abre el laboratorio desde la carpeta completa: index.html debe estar junto a la carpeta media.';videoObj.parentElement.after(e)}});videoSpeed(1)}

function videoMarksTable(){if(!state.videoMarks.length)return '<div class="callout warn">Aún no has registrado actividades. Marca inicio y fin, escribe el nombre y guarda. La tabla mostrará la duración calculada de cada intervalo.</div>';return `<div class="scroll"><table class="table"><thead><tr><th>Recurso / actividad</th><th>Estado</th><th class="right">Inicio (s)</th><th class="right">Fin (s)</th><th class="right">Duración (s)</th><th>Evidencia</th><th>Editar / repetir</th></tr></thead><tbody>${state.videoMarks.map((e,i)=>`<tr><td><b>${resourceText[e.resource]}</b><div>${esc(e.name)}</div></td><td>${esc(kindText[e.kind])}</td><td class="right">${nf(e.start,2)}</td><td class="right">${nf(e.end,2)}</td><td class="right"><b>${nf(e.end-e.start,2)}</b></td><td>${esc(e.evidence)}</td><td><div class="btnrow" style="margin:0"><button class="btn small secondary" onclick="App.playSegment(${i})">▶ Repetir</button><button class="btn small secondary" onclick="App.editVideoMark(${i})">Editar</button><button class="btn small warn" onclick="App.removeVideoMark(${i})">Eliminar</button></div></td></tr>`).join('')}</tbody></table></div>`}
function saveVideoMark(){let e={start:number(pval('videoStartInput')),end:number(pval('videoEndInput')),resource:pval('videoResource'),kind:pval('videoKind'),name:pval('videoActivity').trim(),evidence:pval('videoEvidence')};let max=(videoObj?.duration&&Number.isFinite(videoObj.duration)?videoObj.duration:236.2);if(!e.name||!Number.isFinite(e.start)||!Number.isFinite(e.end)||e.start<0||e.end<=e.start||e.end>max+.03){flash('Escribe el nombre y marca un inicio y final válidos dentro de la grabación.','error');return}let others=state.videoMarks.filter((_,i)=>i!==state.videoFormEdit);if(others.some(o=>o.resource===e.resource&&e.start<o.end-.0001&&e.end>o.start+.0001)){flash('Ya registraste un estado del mismo recurso en ese intervalo. Revisa el solapamiento.','error');return}let editing=state.videoFormEdit>=0;if(editing)state.videoMarks[state.videoFormEdit]=e;else state.videoMarks.push(e);state.videoMarks.sort((a,b)=>a.start-b.start||a.resource.localeCompare(b.resource));state.videoFormEdit=-1;state.videoReview=null;state.videoSaveMessage=`✓ ${editing?'Actividad corregida':'Actividad guardada'}: ${e.name}. Inicio: ${nf(e.start,2)} s; fin: ${nf(e.end,2)} s; duración: ${nf(e.end-e.start,2)} s.`;videoDraft={start:null,end:null};videoLoop=null;save();render()}

function videoToDiagram(){saveVideoAnalysisIfPresent();let a=number(pval('videoCycleStart')),b=number(pval('videoCycleEnd'));if(!isFinite(a)||!isFinite(b)||a<0||b>236.2||b<=a){flash('Define un intervalo válido del video para representar el ciclo o segmento de estudio.','error');return}state.videoCycleStart=String(a);state.videoCycleEnd=String(b);state.videoBlocks=state.videoMarks.filter(e=>e.end>a&&e.start<b).map(e=>({...e,start:round(Math.max(a,e.start)-a),end:round(Math.min(b,e.end)-a)})).filter(e=>e.end>e.start);state.videoReview=null;save();render()}
function reviewVideo(){saveVideoAnalysisIfPresent();const a=number(state.videoCycleStart),b=number(state.videoCycleEnd),c=b-a;let problems=[];if(!(c>0)){problems.push('No hay intervalo delimitado.');}if(!state.videoBlocks.length)problems.push('No hay actividades registradas dentro del intervalo elegido.');for(let r of ['op','m1']){let list=state.videoBlocks.filter(x=>x.resource===r).sort((x,y)=>x.start-y.start);if(list.length){let previous=0,gaps=0;for(let e of list){if(e.start>previous+.01)gaps+=e.start-previous;previous=Math.max(previous,e.end)}if(c-previous>.01)gaps+=c-previous;if(gaps>.01)problems.push(`${resourceText[r]}: ${nf(gaps,2)} s sin clasificación o evidencia registrada; no se asumirán como espera.`)}else problems.push(`${resourceText[r]}: falta el registro de actividades del recurso.`)}let unverified=state.videoBlocks.filter(e=>e.kind==='unknown'||e.evidence!=='observado').length;if(unverified)problems.push(`${unverified} actividad(es) requieren verificación adicional o corresponden a inferencias.`);state.videoReview={problems,coverage:state.videoBlocks.length};save();render()}
function videoIndicators(){let total=number(state.videoCycleEnd)-number(state.videoCycleStart);if(!isFinite(total)||total<=0)return [];let data=[];for(let r of ['op','m1','m2']){let events=state.videoBlocks.filter(e=>e.resource===r);if(!events.length)continue;let known=events.filter(e=>e.kind!=='unknown'&&e.evidence==='observado').reduce((a,e)=>a+(e.end-e.start),0),auto=events.filter(e=>e.kind==='auto'&&e.evidence==='observado').reduce((a,e)=>a+(e.end-e.start),0),idle=events.filter(e=>(e.kind==='wait'||e.kind==='idle')&&e.evidence==='observado').reduce((a,e)=>a+(e.end-e.start),0);data.push({r,known,auto,idle,coverage:known/total*100,full:Math.abs(known-total)<.03});}return data}
function scene16(){let a=number(state.videoCycleStart),b=number(state.videoCycleEnd),dur=b-a,valid=isFinite(dur)&&dur>0;let data=videoIndicators();return head(15,'Aplicación autónoma · 25 minutos','Transfiere los intervalos que mediste, construye el diagrama e interpreta únicamente resultados sustentados.')+`<div class="callout"><b>Cómo continuar:</b> (1) revisa la tabla de duraciones que calculaste en la escena 15; (2) define inicio y fin de un ciclo identificable o de un segmento observado; (3) pulsa «Construir desde mis mediciones»; (4) comprueba las barras sincronizadas y sus duraciones; (5) registra lo que se observó, lo que no puede verificarse y una mejora sustentada.</div>`+`${call('No es obligatorio inventar un ciclo completo si no puede identificarse en la grabación. Puedes delimitar un segmento de observación y declarar qué datos faltan. La aplicación no calificará como espera un tiempo que simplemente no quedó registrado.','warn')}<div class="grid2"><div><h3>1. Delimita el intervalo de estudio</h3>${input('videoCycleStart','Inicio en el video (s)',state.videoCycleStart,'text','Escribe segundo inicial','inputmode="decimal"')}${input('videoCycleEnd','Final en el video (s)',state.videoCycleEnd,'text','Escribe segundo final','inputmode="decimal"')}<button class="btn gold" onclick="App.videoToDiagram()">Construir desde mis mediciones</button><p class="small muted">Elige un ciclo comparable cuando esté claramente identificable. En caso contrario, señala que trabajas con un segmento.</p></div><div><h3>2. Consulta tus mediciones</h3><p>Has registrado <b>${state.videoMarks.length}</b> actividades. Aquí no repetimos la grabación; consulta los tiempos y regresa a la estación de medición si necesitas ajustar alguna observación.</p><div class="callout"><b>Registro de duraciones</b><p>${state.videoMarks.length?state.videoMarks.slice(0,8).map(e=>`${esc(e.name)}: ${nf(e.end-e.start,2)} s`).join('<br>'):'Todavía no hay actividades guardadas.'}</p></div><p class="btnrow"><button class="btn secondary" onclick="App.goto(14)">← Volver a medir</button></p></div></div>${calcButton()}<h3>3. Diagrama de actividades</h3>${valid?timelineSVG(state.videoBlocks,dur,['op','m1']):'<div class="callout">Define el intervalo y traslada tus observaciones para construir el diagrama.</div>'}${legend()}<h3>4. Indicadores sustentados en tus registros</h3>${data.length?`<div class="scroll"><table class="table"><thead><tr><th>Recurso</th><th class="right">Tiempo observado y clasificado</th><th class="right">Procesamiento automático confirmado</th><th class="right">Inactividad confirmada</th><th class="right">Utilización / automático (%)</th></tr></thead><tbody>${data.map(x=>`<tr><td>${resourceText[x.r]}</td><td class="right">${nf(x.known,2)} s</td><td class="right">${nf(x.auto,2)} s</td><td class="right">${nf(x.idle,2)} s</td><td class="right">${x.full?nf((x.r==='op'?x.known-x.idle:x.auto)/dur*100,2)+' %':'No concluyente'}</td></tr>`).join('')}</tbody></table></div><p class="footnote">El porcentaje de utilización solo debe interpretarse como indicador completo si se observó y clasificó el 100 % del ciclo del recurso. Los demás datos son parciales.</p>`:'<p class="muted">Aún no hay mediciones que permitan calcular indicadores.</p>'}${textarea('videoObservation','¿Qué actividades y simultaneidades puedes sustentar?',state.videoObservation,'Describe el proceso y sus recursos sin suponer estados que no observaste.')}${textarea('videoLimitations','¿Qué límites tiene la información disponible?',state.videoLimitations,'Ejemplo: estado interno de máquina no visible, cortes, ciclo no identificable...')}${textarea('videoImprovement','¿Qué mejora propones y cómo la verificarías?',state.videoImprovement,'Relaciona la propuesta con tiempos medidos, calidad y seguridad.')}<div class="btnrow"><button class="btn secondary" onclick="App.saveVideoAnalysis()">Guardar análisis</button><button class="btn" onclick="App.reviewVideo()">Comprobar coherencia</button></div>${state.vi function computeExpression(src){let s=String(src).replace(/\s+/g,'').replace(/,/g,'.').replace(/×/g,'*').replace(/[÷]/g,'/').replace(/[−]/g,'-');if(!/^[0-9.()+\-*/%]+$/.test(s)||s.length>160)throw Error('Solo se permiten números y operaciones aritméticas.');let pos=0;function expr(){let v=term();while(s[pos]==='+'||s[pos]==='-'){let op=s[pos++],w=term();v=op==='+'?v+w:v-w}return v}function term(){let v=factor();while(s[pos]==='*'||s[pos]==='/'){let op=s[pos++],w=factor();if(op==='/'&&w===0)throw Error('No se puede dividir entre cero.');v=op==='*'?v*w:v/w}return v}function factor(){if(s[pos]==='-'){pos++;return -factor()}if(s[pos]==='+'){pos++;return factor()}if(s[pos]==='('){pos++;let v=expr();if(s[pos++]!==')')throw Error('Revisa los paréntesis.');return v}let a=pos;while(pos<s.length&&/[0-9.]/.test(s[pos]))pos++;if(pos===a)throw Error('Revisa la operación.');let v=Number(s.slice(a,pos));if(!Number.isFinite(v))throw Error('Número inválido.');if(s[pos]==='%'){pos++;v/=100}return v}let val=expr();if(pos!==s.length||!Number.isFinite(val))throw Error('Revisa la expresión.');return val}
function calcEval(){let out=$('calcFeedback');try{calcResult=computeExpression(pval('calcEntry'));out.className='answer good';out.textContent='Resultado = '+nf(calcResult,4)}catch(e){calcResult=null;out.className='answer bad';out.textContent=e.message}}
