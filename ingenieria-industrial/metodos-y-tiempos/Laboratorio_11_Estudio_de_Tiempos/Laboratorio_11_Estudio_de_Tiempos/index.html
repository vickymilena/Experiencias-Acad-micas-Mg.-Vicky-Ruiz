{q:'¿Cuántos segundos representan 0,08 minutos decimales?',o:['0,8 segundos','4,8 segundos','8,0 segundos'],a:1,why:'Los minutos decimales se convierten multiplicando por 60: 0,08 × 60 = 4,8 segundos.'},
{q:'Si la fórmula de muestra entrega 11,57 observaciones, ¿cuántas se necesitan?',o:['11 observaciones usando truncamiento','12 observaciones redondeando hacia arriba','11,57 como número operativo de ciclos'],a:1,why:'La muestra estimada se redondea hacia arriba al siguiente entero, porque 11 observaciones serían insuficientes.'},
{q:'Si TO = 10 s y la valoración del ritmo es 110 %, ¿cuál es TN?',o:['9 s','10 s','11 s'],a:2,why:'TN = TO × VR/100 = 10 × 110/100 = 11 segundos.'},
{q:'¿Por qué un valor de ritmo de 95 % NO significa una nota de calidad del 95 %?',o:['Porque compara la ejecución con un ritmo tipo, sin calificar porcentajes de calidad','Porque solo mide la experiencia previa del trabajador','Porque representa la precisión del cronómetro'],a:0,why:'La valoración del ritmo es un ajuste de desempeño respecto al patrón establecido, manteniendo calidad y seguridad.'},
{q:'¿Es correcto eliminar una observación solo porque fue mucho más alta que las demás?',o:['Sí, si supera el promedio por más de dos segundos','No: primero se documenta e investiga la causa','Sí, si al excluirla disminuye notablemente la variación'],a:1,why:'Una observación diferente puede pertenecer al proceso. Su exclusión exige una causa verificable.'},
{q:'Si TN = 20 s y S = 15 % sobre el tiempo normal, ¿cuánto es TE?',o:['23 s','22 s','26 s'],a:0,why:'TE = 20 × (1 + 0,15) = 23 segundos.'},

];

const START={name:'',scene:0,visited:[0],quiz:{},quizClosed:false,quizIndex:0,guideClockMode:'zero',clockLog:{zero:[],continuous:[]},samplePractice:'',ritmo:100,suppScenario:16,allowGuide:[5,4,4,2,1],caseStep:0,case:{n:['','','','',''],to:['','','','',''],vr:['','','','',''],tn:['','','','',''],supp:['','','','',''],suppReasons:['','','','',''],allowJust:'',standard:'',capacity:'',decision:'',improvement:'',finalNote:''},checkNotes:{},savedAt:null};
function mergeState(raw){let s=JSON.parse(JSON.stringify(START));if(!raw||typeof raw!=='object')return s;Object.assign(s,raw);s.case=Object.assign(JSON.parse(JSON.stringify(START.case)),raw.case||{});s.clockLog=Object.assign({zero:[],continuous:[]},raw.clockLog||{});s.visited=Array.isArray(raw.visited)?raw.visited:[0];s.quiz=raw.quiz||{};return s;}
const STORAGE_KEY='aulaescena_lab11_tiempos_v2';
const PREVIOUS_STORAGE_KEY='aulaescena_lab10_tiempos_v2';
let state;try{state=mergeState(JSON.parse(localStorage.getItem(STORAGE_KEY)||localStorage.getItem(PREVIOUS_STORAGE_KEY)||'null'))}catch(e){state=mergeState(null)}
function save(){try{state.savedAt=new Date().toISOString();localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){showToast('No se pudo guardar en este navegador. Descarga un avance de seguridad.')}}
function esc(str){return String(str??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function num(value,d=2){return Number(value).toLocaleString('es-CO',{minimumFractionDigits:d,maximumFractionDigits:d})}
function raw(v){const n=Number(String(v).replace(',','.'));return Number.isFinite(n)?n:NaN}
function sum(a){return a.reduce((x,y)=>x+y,0)}
function avg(a){return sum(a)/a.length}
function col(matrix,j){return matrix.map(r=>r[j])}
function sampleCalc(xs){const n=xs.length,S=sum(xs),Q=sum(xs.map(x=>x*x)),v=n*Q-S*S;return v<=0?0:Math.pow(40*Math.sqrt(v)/S,2)}
const GUIDE_REQUIRED=EGUIDE.map((_,j)=>Math.ceil(sampleCalc(col(G_FULL,j).slice(0,5))));const GUIDE_AVG=EGUIDE.map((_,j)=>avg(G_FULL.slice(0,GUIDE_REQUIRED[j]).map(r=>r[j]))),GUIDE_TN=GUIDE_AVG.map((x,j)=>x*VR_GUIDE[j]/100),GUIDE_SUM=sum(GUIDE_TN),CASE_AVG=ECASE.map((_,j)=>avg(col(CASE_TIMES,j))),CASE_TN_REF=CASE_AVG.map((v,j)=>v*VR_CASE_REFERENCE[j]/100);
function cell(id,value='',type='number',p='Escribe tu cálculo'){const at=type==='number'?'inputmode="decimal"':'';return `<input aria-label="${esc(p)}" type="${type==='number'?'text':type}" ${at} data-case="${esc(id)}" value="${esc(value)}" placeholder="${esc(p)}">`}

function renderNav(){let html='';TITLES.forEach((t,i)=>{if([0,2,6,10,15].includes(i))html+=`<div class="sidegroup">${i===0?'Inicio':i===2?'Fundamentos y medición':i===6?'Cálculo y valoración':i===10?'Suplementos y estándar':'Aplicación empresarial'}</div>`;html+=`<button class="scenebtn ${state.scene===i?'active':''} ${state.visited.includes(i)?'visited':''}" data-nav="${i}" type="button"><span class="num">${i+1}</span><span>${esc(t)}</span></button>`});document.getElementById('sceneNav').innerHTML=html;document.getElementById('sideUser').textContent=state.name.trim()?`Estudiante: ${state.name.trim()}`:'Identificación pendiente · completa la escena 1';const percent=Math.round(state.visited.length/18*100);document.getElementById('progressText').textContent=percent+' %';document.getElementById('progressBar').style.width=percent+'%';document.getElementById('barTitle').textContent=`Escena ${state.scene+1} · ${TITLES[state.scene]}`}
function routeForScene(idx){
  if(idx===4)return 0;
  if(idx===5)return 2;
  if(idx===6)return 3;
  if(idx===7)return 4;
  if(idx===8)return 5;
  if(idx===9||idx===10)return 6;
  if(idx===11)return 7;
  if(idx===12)return 8;
  if(idx===13)return 9;
  if(idx===15)return 0;
  if(idx===16)return [4,5,6,7,8,9][Math.max(0,Math.min(5,state.caseStep||0))];

}

function scene1(){return `<div class="hero"><span class="kicker">Laboratorio 11. Estudio de Tiempos · Métodos y Tiempos</span><h1>Laboratorio 11. Estudio de Tiempos</h1><p><strong>Misión Tiempo Justo</strong></p><p>¿Cómo establecer un tiempo de producción técnicamente confiable, sin olvidar que el trabajo lo realizan personas?</p><p><strong>Mg. Vicky Ruiz</strong></p></div>${sceneLayout(`${panel('Bienvenida',`<p>Serás el ingeniero industrial responsable de un estudio de tiempos. Primero comprenderás los conceptos con el caso de <strong>empaque de cuadernos</strong> y después resolverás un encargo diferente: <strong>Empaques del Sinú S.A.S.</strong>.</p><div class="diagram"><div class="diagram-item">◉<b>Observar</b><span>Conocer el método</span></div><div class="diagram-item">◷<b>Medir</b><span>Tomar registros</span></div><div class="diagram-item">◈<b>Valorar</b><span>Ritmo y suplementos</span></div><div class="diagram-item">▣<b>Decidir</b><span>Estándar y capacidad</span></div></div>`)}${panel('Identificación obligatoria',`${fieldWrite('name','Nombres y apellidos completos','Escribe tu nombre completo')}${hint('<strong>Tu nombre aparecerá automáticamente en el nombre y en el interior de cada archivo Word y Excel que descargues.','info')}${button('register','Guardar nombre y comenzar','gold')}${feedbackKey('register')}`,'teal')}`,`<p>La aplicación guarda automáticamente el avance en este mismo navegador y dispositivo.</p><p>Si cambias de navegador, necesitas descargar tus archivos para conservar los resultados.</p>`)}`}

function scene15(){let idx=state.quizIndex||0,q=QUIZ[idx],ans=state.quiz[idx];let dots=QUIZ.map((x,i)=>`<button type="button" class="qdot ${i===idx?'active':''} ${state.quiz[i]!==undefined?'done':''}" data-act="quizJump${i}" aria-label="Pregunta ${i+1}">${i+1}</button>`).join('');return `${lede('Comprueba lo aprendido','Responde ocho preguntas con retroalimentación inmediata. Puedes regresar a las escenas anteriores y reintentar.',14)}${sceneLayout(`${panel('Evaluación formativa',`<div class="quiz-pills">${dots}</div><p class="eyebrow">Pregunta ${idx+1} de ${QUIZ.length}</p><h3>${esc(q.q)}</h3>${q.o.map((opt,i)=>`<label class="choice ${ans===i?'chosen':''}"><input type="radio" name="q${idx}" value="${i}" data-quiz="${idx}" ${ans===i?'checked':''}><span>${esc(opt)}</span></label>`).join('')}${ans!==undefined?`<div class="feedback ${ans===q.a?'ok':'bad'}"><strong>${ans===q.a?'Correcto.':'Revisa tu respuesta.'}</strong> ${esc(q.why)}</div>`:''}<div class="buttons">${button('quizPrev','← Pregunta anterior','ghost')}${button('quizNext','Pregunta siguiente →')}${button('quizClose','Finalizar comprobación','gold')}</div>${state.quizClosed?'<div class="feedback ok">Comprobación cerrada. Puedes seguir repasando y corregir respuestas.</div>':''}`)}${panel('Así se utiliza la retroalimentación',`<p>Las respuestas se conservan automáticamente. Cuando una opción no es correcta, la explicación señala el concepto que conviene revisar, sin borrar otros aciertos.</p>${feedbackKey('quizClose')}`)}`,`<p><strong>Progreso:</strong> has respondido ${Object.keys(state.quiz).length} de ${QUIZ.length} preguntas.</p><p>El reto empresarial usa un caso distinto y no muestra su solucionario anticipadamente.</p>`)}`}
function caseDescription(){return `<p><strong>Empresa:</strong> Empaques del Sinú S.A.S. <strong>Operación:</strong> doblado, conformado y empaque manual de cajas para despacho de productos escolares.</p><p><strong>Motivo del estudio:</strong> retrasos en despacho; necesidad de estimar capacidad y valorar si conviene mejorar el método o ajustar recursos.</p><p><strong>Condiciones registradas:</strong> el operario trabaja de pie, realiza movimientos repetitivos, aplica ligera fuerza manual, enfrenta iluminación bastante inferior a la requerida y ruido intermitente fuerte. El trabajo exige atención visual, cierta precisión y puede resultar monótono. No se reportan condiciones atmosféricas extremas.</p>${hint('El puesto presenta condiciones que necesitan evaluación y medidas correctivas. Calcular un estándar no significa declarar seguro el puesto.','error')}`}

function casePane0(){let rows=ECASE.map((e,i)=>[`E${i+1}: ${esc(e)}`,num(sum(col(CASE_TIMES,i).slice(0,5)),2),num(sum(col(CASE_TIMES,i).slice(0,5).map(x=>x*x)),4),cell(`n.${i}`,state.case.n[i],'number','n requerido')]);return `${panel('Paso 5 · Determinar el tamaño de muestra (reto)',`<p><strong>¿Qué haces?</strong> Usa las primeras cinco observaciones de cada elemento. Calcula la suma de tiempos y la suma de cuadrados. Luego aplica la fórmula tradicional, redondea al entero superior y registra las observaciones requeridas.</p>${explainedFormula('sample','Fórmula con cinco observaciones preliminares')}${tbl(['Elemento','∑xᵢ (primeras 5)','∑xᵢ² (primeras 5)','Tu n requerido'],rows)}${hint('Cada elemento tiene su propio n. Si se miden ciclos completos, el mayor n calculado determina el mínimo de ciclos compartidos; también hay que comprobar la estabilidad de las mediciones posteriores.')}<div class="buttons">${button('caseCheck0','Revisar mis cálculos')}${button('caseAdvance','Continuar →','ghost')}</div>${feedbackKey('case0')}`)}`}
function casePane1(){let rows=ECASE.map((e,i)=>[`E${i+1}: ${esc(e)}`,`20 registros`,cell(`to.${i}`,state.case.to[i],'number','TO en min')]);return `${panel('Paso 6 · Revisar y promediar los tiempos (reto)',`<p>Utiliza los <strong>20 registros</strong> originales para obtener el promedio observado de cada elemento. El expediente contiene toda la información: utiliza las veinte mediciones para el promedio y documenta la validez del registro.</p>${explainedFormula('avg','Fórmula del tiempo observado')}${tbl(['Elemento','Datos disponibles','Tu TO (min)'],rows)}${hint('Conserva al menos seis decimales al calcular. Un valor en minutos decimales no debe confundirse con segundos.')}<div class="buttons">${button('showCaseData','Ver u ocultar los 20 ciclos','ghost')}${button('caseCheck1','Revisar mis promedios')}${button('caseAdvance','Continuar →','ghost')}</div><div id="caseDataToggle" style="display:none">${caseDataTable()}</div>${feedbackKey('case1')}`)}`}
function casePane2(){let rows=ECASE.map((e,i)=>[`E${i+1}: ${esc(e)}`,cell(`vr.${i}`,state.case.vr[i],'number','VR (%)'),cell(`tn.${i}`,state.case.tn[i],'number','TN (min)')]);let desc=['Movimientos seguros y fluidos, por encima del ritmo tipo.','Tranquilo y constante, sin prisa, conservando calidad.','Rápido y controlado, claramente por encima del ritmo tipo.','Constante sin aceleración marcada.','Más pausado que el ritmo tipo, con control del trabajo.'];return `${panel('Paso 7 · Valorar el ritmo y calcular TN (reto)',`<p><strong>¿Para qué?</strong> La valoración permite representar el tiempo al ritmo de referencia. Una descripción cualitativa no determina un único valor exacto sin observar y calibrar el desempeño; debes escoger y defender tus valores.</p>${tbl(['Elemento','Descripción del ritmo observado'],ECASE.map((e,i)=>[`E${i+1}`,desc[i]]))}${explainedFormula('normal','Tiempo normal por elemento')}${tbl(['Elemento','Tu VR (%)','Tu TN (min)'],rows)}${hint('Orientación pedagógica: ritmo tipo = 100 %. Valora por encima de 100 cuando la descripción indique mayor rapidez y por debajo de 100 cuando indique menor rapidez, siempre considerando calidad y seguridad.')}<div class="buttons">${button('caseCheck2','Revisar coherencia del ritmo')}${button('caseAdvance','Continuar →','ghost')}</div>${feedbackKey('case2')}`)}`}
function casePane3(){let rows=NAMES_ALLOW.map((e,i)=>[esc(e),cell(`supp.${i}`,state.case.supp[i],'number','%'),`<input type="text" aria-label="Justificación de ${esc(e)}" data-case="suppReasons.${i}" value="${esc(state.case.suppReasons[i])}" placeholder="Evidencia del puesto">`]);return `${panel('Paso 8 · Justificar los suplementos (reto)',`<p>Revisa condiciones y selecciona los factores que realmente se justifiquen. El valor elegido debe ser explicado; <strong>no hay un porcentaje único automáticamente correcto</strong> para este caso.</p>${tbl(['Factor','Porcentaje (%)','Justificación'],rows)}<div class="field"><label>¿Qué condiciones debes corregir antes de aprobar el estándar?</label>${area('allowJust',state.case.allowJust,'Explica qué harías frente a la iluminación insuficiente, el ruido y posibles factores duplicados.')}</div>${hint('Los valores históricos de las tablas OIT son orientativos. No selecciones un suplemento solo por sexo y no confundas puntos de la revisión de 2013 con porcentajes. La iluminación insuficiente requiere evaluación y control.')}${button('caseCheck3','Revisar mi propuesta')} ${button('caseAdvance','Continuar →','ghost')}${feedbackKey('case3')}`)}`}
function casePane4(){let s=sum((state.case.supp||[]).map(raw).map(x=>Number.isFinite(x)?x:0));return `${panel('Paso 9 y 10 · Estándar y capacidad (reto)',`<p>Después de calcular los cinco tiempos normales, suma los elementos secuenciales. Expresa los suplementos como fracción decimal sobre el tiempo normal y determina el estándar.</p>${explainedFormula('standard','Tiempo estándar sobre base TN')}${explainedFormula('capacity','Unidades/hora si TE se expresa en minutos')}${tbl(['Indicador','Dato de trabajo'],[['Suplementos sumados',`<strong>${num(s,2)} %</strong> (según lo que registraste)`],['Tiempo normal del ciclo','Suma de los TN de los cinco elementos'],['Tiempo estándar del ciclo',cell('standard',state.case.standard,'number','TE en min')],['Capacidad estimada',cell('capacity',state.case.capacity,'number','Unidades/hora')]])}${hint('Si aún no tienes todos los TN y un suplemento justificado, completa las etapas anteriores. El estándar es condicional a las características y medidas correctivas del puesto.')}<div class="buttons">${button('caseCheck4','Revisar mis resultados')}${button('caseAdvance','Continuar →','ghost')}</div>${feedbackKey('case4')}`)}`}
function casePane5(){return `${panel('Paso 10 · Decisión profesional (reto)',`<p>La gerencia no necesita únicamente un número. Necesita una recomendación explicada y apoyada en el estudio.</p><div class="field"><label>Conclusión técnica: tiempo estándar, capacidad y condiciones de validez</label>${area('decision',state.case.decision,'Indica el estándar que calculaste, la capacidad, los supuestos y sus limitaciones.')}</div><div class="field"><label>¿Qué mejorarías primero y cómo comprobarías el cambio?</label>${area('improvement',state.case.improvement,'Propón acciones verificables para el método y las condiciones de trabajo.')}</div><div class="field"><label>Observaciones adicionales (opcional)</label>${area('finalNote',state.case.finalNote,'Explica riesgos, variabilidad, limitaciones o decisiones complementarias.')}</div><div class="buttons">${button('caseCheck5','Revisar la conclusión')}${button('downloadAdvanceWord','↓ Descargar avance Word','ghost')}${button('shareAdvanceWord','↗ Guardar o compartir avance','ghost mobile-save')}${button('downloadXlsx','↓ Descargar Excel con mis datos','ghost')}${button('shareXlsx','↗ Guardar o compartir Excel','ghost mobile-save')}</div>${feedbackKey('case5')}`)}`}
function casePane(){return [casePane0,casePane1,casePane2,casePane3,casePane4,casePane5][state.caseStep]()}
function scene17(){return `${lede('Realiza tu estudio de tiempos','Resuelve el caso de Empaques del Sinú por etapas. Las respuestas y los cálculos quedarán vinculados a tu nombre.',16)}${sceneLayout(`${panel('Expediente disponible durante el reto',`<details class="detail"><summary>Consultar descripción del puesto y condiciones</summary>${caseDescription()}</details><details class="detail"><summary>Consultar puntos de corte de los cinco elementos</summary>${tbl(['Código','Actividad','Puntos de corte'],caseRows())}</details><details class="detail"><summary>Consultar la tabla completa de los 20 ciclos</summary>${caseDataTable()}</details>`)}${caseTabs()}${casePane()}${panel('Descarga de seguridad',`<p>Puedes descargar un avance en Word o el Excel con fórmulas y tus registros en cualquier momento. Los archivos incorporan tu nombre completo y muestran los campos pendientes sin inventar respuestas.</p><div class="buttons">${button('downloadAdvanceWord','↓ Avance en Word','ghost')}${button('shareAdvanceWord','↗ Guardar o compartir avance','ghost mobile-save')}${button('downloadXlsx','↓ Hoja Excel','ghost')}${button('shareXlsx','↗ Guardar o compartir Excel','ghost mobile-save')}</div>`)} `,`<p>El expediente empresarial de práctica permanece disponible para consulta.</p><p>Los cálculos se revisarán con pistas; no se revelará el solucionario del reto independiente antes de finalizarlo.</p><p>Los porcentajes de suplemento y la valoración del ritmo exigen fundamentación y no tienen una única respuesta automática.</p>`)}`}
function readyFinal(){return [0,1,2,3,4,5].every(i=>caseValidate(i).ok)}
function scene18(){let c=state.case;return `${lede('Defiende tu decisión','Un estudio no termina al encontrar un número: debes explicar qué significa, bajo qué condiciones es válido y qué mejorarías.',17)}${sceneLayout(`${panel('Resumen de tu expediente técnico',`<p><strong>Estudiante:</strong> ${esc(state.name)}</p><p><strong>Operación:</strong> doblado y empaque de cajas · Empaques del Sinú S.A.S.</p><div class="twocol"><div class="stat"><small>Tu tiempo estándar</small><b>${c.standard?num(raw(c.standard),5)+' min':'Pendiente'}</b></div><div class="stat"><small>Tu capacidad estimada</small><b>${c.capacity?num(raw(c.capacity),2)+' u/h':'Pendiente'}</b></div></div><h3>Tu conclusión</h3><p>${c.decision?esc(c.decision):'<em>Aún no has registrado tu conclusión en la escena 17.</em>'}</p><h3>Tu propuesta de mejora</h3><p>${c.improvement?esc(c.improvement):'<em>Completa primero tu propuesta en el reto independiente.</em>'}</p>${!readyFinal()?hint('Tu expediente todavía tiene campos pendientes. Puedes descargar un avance identificado como «En desarrollo». Completa los apartados necesarios antes de emitir el informe final.','error'):hint('Has registrado todos los campos principales. Revisa la coherencia técnica antes de entregar tu informe.','success')}`)}${panel('Archivos personales para entregar',`<p>Los documentos se generan directamente desde tu navegador. El nombre de archivo y los encabezados incluirán <strong>${esc(state.name)}</strong>. El Excel incluirá fórmulas, las veinte mediciones del caso y tus respuestas.</p><p class="downloads-instruction"><strong>En celular:</strong> usa «Descargar» para guardar en Descargas o «Guardar o compartir» para abrir el menú del dispositivo. En iPhone, elige «Guardar en Archivos». Todos los documentos llevarán tu nombre completo.</p><div class="buttons">${button('downloadFinalWord','↓ Informe Word personalizado','gold')}${button('shareFinalWord','↗ Guardar o compartir informe','ghost mobile-save')}${button('downloadXlsx','↓ Excel personalizado')}${button('shareXlsx','↗ Guardar o compartir Excel','ghost mobile-save')}${button('downloadAdvanceWord','↓ Avance Word','ghost')}${button('shareAdvanceWord','↗ Guardar o compartir avance','ghost mobile-save')}</div>${feedbackKey('downloadFinal')}`)}${panel('Reflexión final',`<p class="cardquote">Una empresa quiere aumentar la producción reduciendo los suplementos de sus trabajadores. ¿Sería correcto si las condiciones de trabajo no han cambiado?</p><p>El propósito del ingeniero no es fabricar una cifra favorable, sino construir una referencia confiable y una mejora sostenible.</p>${hint('Las respuestas y las notas no se envían automáticamente a Moodle. Descarga tus archivos y entrégalos según las instrucciones de tu docente.')}`)}`,`<p><strong>Lista de verificación:</strong></p><ul><li>¿Muestra documentada?</li><li>¿Registros sin alteración?</li><li>¿VR justificado?</li><li>¿Suplementos con evidencia?</li><li>¿Condiciones de validez claras?</li><li>¿Recomendación viable?</li></ul><p>Recuerda entregar el Word y el Excel con tu identificación.</p>`)}`}

function stepBand(k){let a=ROUTE[k-1];return `<div class="step-band"><span class="step-bubble">PASO ${k} DE 10</span><div><strong>${esc(a.full)}</strong><div class="small">Estás desarrollando esta etapa de la ruta del estudio.</div></div></div>`}
function achievement(txt){return `<div class="achievement"><span class="ach-icon" aria-hidden="true">✓</span><div><strong>¿Qué conseguimos en este paso?</strong><p>${txt}</p></div></div>`}
function nextLink(txt){return `<div class="next-link"><span aria-hidden="true">↗</span><div><strong>¿Qué sigue?</strong> ${txt}</div></div>`}
function explainVars(items){return `<div class="variables"><strong>¿Qué significa cada símbolo?</strong><div class="varchips">${items.map(x=>`<span><b>${esc(x[0])}</b> ${esc(x[1])}</span>`).join('')}</div></div>`}
const GLOSS={
 avg:[['TO','tiempo observado promedio'],['tᵢ','duración de la observación i'],['Σ','sumatoria de las observaciones'],['n','cantidad de registros válidos']],
 sample:[['n','número total estimado de observaciones'],['n′','cantidad de observaciones preliminares'],['xᵢ','duración de la observación i'],['Σxᵢ','suma de los tiempos preliminares'],['Σxᵢ²','suma de sus cuadrados'],['40','coeficiente de una aproximación clásica (~95,45 % de confianza y ±5 % de error relativo)']],
 normal:[['TN / TB','tiempo normal o básico, según el nivel del cálculo'],['TO','tiempo observado promedio'],['VR','valoración del ritmo en porcentaje'],['100','valor del ritmo tipo de referencia']],
 standard:[['TE','tiempo estándar'],['TN','tiempo normal del ciclo'],['S','suplemento total expresado en decimal, calculado sobre TN']],
 capacity:[['TE','tiempo estándar en minutos por unidad'],['60','minutos disponibles en una hora'],['Unidades/hora','capacidad media teórica estimada para esa operación']]
};
function explainedFormula(k,label){return formula(FORMULA[k],label)+explainVars(GLOSS[k])}
function guideDataTable(){return tbl(['Ciclo','E1 · Tomar y abrir (min)','E2 · Tomar cuaderno (min)','E3 · Introducir (min)','E4 · Sellar y colocar (min)'],Array.from({length:14},(_,i)=>[i+1,...EGUIDE.map((_,j)=>i<GUIDE_REQUIRED[j]?num(G_FULL[i][j],2):'<span class="small" title="No se requiere un registro adicional para este elemento">—</span>')]),`<td>Registros válidos</td>${GUIDE_REQUIRED.map(x=>`<td>${x}</td>`).join('')}`,'microtable')}
function quickPhoto(i){return `<figure class="element-photo"><img src="${GUIDE_IMAGES[i]}" loading="lazy" alt="${esc(['Operario tomando y abriendo la bolsa transparente','Operario tomando un cuaderno de la pila','Operario introduciendo el cuaderno en la bolsa','Operario sellando la bolsa y colocando el cuaderno en la bandeja'][i])}"><figcaption><strong>E${i+1}. ${esc(EGUIDE[i])}</strong><span>${esc(['Termina con la bolsa abierta','Termina con el cuaderno listo','Termina con el cuaderno dentro de la bolsa','Termina con el paquete sellado en la bandeja'][i])}</span></figcaption></figure>`}
function suppImage(){return `<div class="supp-thumbnail"><img src="${SUPP_TABLE_IMG}" alt="Tabla histórica completa de suplementos por descanso: valores de necesidades personales, fatiga, postura, fuerza, iluminación, ambiente, concentración, ruido, tensión mental, monotonía y tedio. Ejemplo sin valor normativo." loading="lazy"></div><div class="buttons">${button('openTable','⤢ Ampliar tabla completa','ghost')}</div><dialog id="suppDialog" class="supp-dialog" aria-label="Tabla completa de suplementos"><div class="buttons" style="justify-content:flex-end"><button type="button" class="btn smallbtn" data-act="closeTable">Cerrar tabla ✕</button></div><div class="supp-scroll"><img src="${SUPP_TABLE_IMG}" alt="Tabla histórica de suplementos para consulta ampliada"></div></dialog>`}
function scene2(){return `${lede('¿Por qué medimos el trabajo?','Antes de tomar mediciones, necesitamos una decisión empresarial que la medición pueda apoyar.',1)}${panel('¿Qué es el estudio de tiempos?',`<p>Es una técnica para determinar la duración de una tarea realizada mediante un método definido. Registra observaciones, evalúa el ritmo y establece suplementos justificados para obtener una referencia de producción técnicamente defendible.</p><p>Se utiliza para planificar capacidades, analizar costos, distribuir el trabajo y verificar si una mejora realmente reduce la duración de una operación. <strong>No busca identificar al trabajador más rápido ni reducir sus pausas arbitrariamente.</strong></p>`)}${panel('Situación inicial: una promesa de entrega',`<div class="callout"><strong>Una empresa debe entregar 1.000 paquetes.</strong> La gerencia promete terminarlos mañana sin conocer la capacidad de su estación de empaque. ¿Cómo fundamentaría el ingeniero un plazo de entrega?</div><div class="choice"><label><input type="radio" name="decision2" value="b"> Proyectar la producción promedio reciente y considerar solo las horas programadas.</label></div><div class="choice"><label><input type="radio" name="decision2" value="a"> Medir el proceso, establecer un estándar y contrastarlo con recursos, horas efectivas y restricciones.</label></div><div class="choice"><label><input type="radio" name="decision2" value="c"> Tomar el mejor rendimiento observado y estimar los pedidos que podría completar el equipo.</label></div><div class="buttons">${button('check2','Comprobar y argumentar')}</div>${feedbackKey('check2')}`)}${achievement('Comprendimos la utilidad del estudio de tiempos: apoyar decisiones responsables de producción con información verificable, no con suposiciones de rapidez.')}${nextLink('Conocerás los tipos de tiempo que intervienen antes de construir la ruta completa del estudio.')}`}
function scene3(){return `${lede('Tres tiempos que debemos distinguir','Un cronómetro mide la ejecución observada. Para establecer un estándar todavía debemos interpretar y ajustar esa medición.',2)}${panel('La diferencia central',`<div class="threecol"><div class="stat"><b>TO</b><strong>Tiempo observado</strong><small>Promedio de las duraciones registradas para un elemento.</small></div><div class="stat"><b>TB / TN</b><strong>Tiempo básico o normal</strong><small>Duración equivalente al ritmo de referencia; el tiempo básico suele determinarse por elemento y el normal total puede sumarse para el ciclo secuencial.</small></div><div class="stat"><b>TE</b><strong>Tiempo estándar</strong><small>Tiempo normal que incorpora suplementos justificados sobre una base definida.</small></div></div><p class="small">Tiempo básico y tiempo normal pueden ser términos equivalentes en estudio del trabajo. Aquí distinguiremos el cálculo de un elemento (TB) y la suma del ciclo (TN) para que la operación sea clara; no son ajustes diferentes.</p>`)}${panel('Ejemplo sencillo: una tarea de 10 segundos',`<p>En una operación de un único elemento se observa un promedio de 10 segundos. La valoración del ritmo (VR) es 100 % y se supone, solo para practicar, un suplemento total (S) del 15 %.</p><div class="diagram"><div class="diagram-item"><b>TO = 10 s</b><span>Tiempo observado promedio</span></div><div class="diagram-arrow">→</div><div class="diagram-item"><b>TB = TN = 10 s</b><span>Ritmo de referencia 100 %</span></div><div class="diagram-arrow">→</div><div class="diagram-item"><b>TE = 11,5 s</b><span>Con suplemento supuesto de 15 %</span></div></div>${explainedFormula('normal','Ajuste al ritmo de referencia')}<p><strong>Sustitución:</strong> TB = 10 × 100 / 100 = 10 s.</p>${explainedFormula('standard','Del tiempo normal al estándar')}<p><strong>Sustitución:</strong> TE = 10 × (1 + 0,15) = <strong>11,5 segundos</strong>.</p><p>La valoración VR se asigna mediante observación y una escala definida; los suplementos S se eligen estudiando las condiciones de trabajo. Aprenderás ambos procedimientos en sus etapas correspondientes.</p>`)}${panel('Pregunta de comprensión',`<p>Una operación tiene un tiempo observado de 10 segundos, pero el ritmo registrado fue mayor que el ritmo tipo. ¿Qué debemos hacer antes de establecer el estándar?</p><div class="buttons">${button('test3to','Sumar directamente un suplemento','ghost')}${button('test3tn','Ajustar primero el tiempo por el ritmo','ghost')}${button('test3te','Adoptar el tiempo observado como referencia final','ghost')}</div>${feedbackKey('test3')}`)}${achievement('Distinguimos los tiempos observados, normales y estándar. También sabemos que VR significa valoración del ritmo y S significa suplemento total.')}${nextLink('Antes de medir el caso, verás la ruta completa que recorrerá un ingeniero industrial.')}`}
function routeSVG(){const pts=[[105,815],[325,735],[600,670],[820,580],[680,487],[420,410],[150,330],[320,247],[585,178],[820,95]];
 const points=pts.map(([x,y],i)=>{let col=['#112A46','#176B80','#BD8B30'][i%3];return `<g><circle cx="${x}" cy="${y}" r="36" fill="#FFFFFF" stroke="${col}" stroke-width="6"/><circle cx="${x}" cy="${y}" r="28" fill="${col}" opacity=".09"/><text x="${x}" y="${y+8}" fill="${col}" font-size="25" font-weight="800" text-anchor="middle">${i+1}</text><text x="${x}" y="${y-47}" text-anchor="middle" fill="#112A46" font-size="17" font-weight="700">${ROUTE[i].short}</text></g>`}).join('');
 return `<svg viewBox="0 0 940 910" role="img" aria-label="Camino curvo ascendente de diez pasos del estudio de tiempos" class="route-svg"><defs><linearGradient id="trackG" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#176B80"/><stop offset=".55" stop-color="#D6A84B"/><stop offset="1" stop-color="#112A46"/></linearGradient></defs><path d="M105 815 C165 806 242 748 325 735 S520 692 600 670 S845 644 820 580 S756 506 680 487 S492 429 420 410 S166 365 150 330 S239 265 320 247 S509 190 585 178 S737 113 820 95" fill="none" stroke="#E7EAEC" stroke-width="29" stroke-linecap="round"/><path d="M105 815 C165 806 242 748 325 735 S520 692 600 670 S845 644 820 580 S756 506 680 487 S492 429 420 410 S166 365 150 330 S239 265 320 247 S509 190 585 178 S737 113 820 95" fill="none" stroke="url(#trackG)" stroke-width="8" stroke-linecap="round" stroke-dasharray="10 12"/>${points}</svg>`}
function scene4(){let sel=Math.max(0,Math.min(9,state.routeSelected??0)),p=ROUTE[sel];return `${lede('Ruta del estudio de tiempos','Este será el recorrido de nuestro caso de empaque. Selecciona cualquier estación para conocer el propósito completo de ese paso.',3)}${panel('Nuestro camino: de la operación a la decisión',`<p>Los círculos representan <strong>diez etapas conectadas</strong>. Los títulos breves identifican cada estación; al seleccionar su número conocerás su nombre completo, su finalidad y dónde se desarrollará.</p><div class="route-desktop"><div class="route-frame">${routeSVG()}<div class="route-hotspots">${[[105,815],[325,735],[600,670],[820,580],[680,487],[420,410],[150,330],[320,247],[585,178],[820,95]].map(([x,y],i)=>`<button type="button" style="left:${x/940*100}%;top:${y/910*100}%" data-act="routeOpen${i}" class="route-hit ${sel===i?'active':''}" aria-label="Ver paso ${i+1}: ${esc(ROUTE[i].full)}">${i+1}</button>`).join('')}</div></div></div><div class="route-mobile">${ROUTE.map((x,i)=>`<button type="button" data-act="routeOpen${i}" class="route-mobile-node ${sel===i?'chosen':''}" style="--route-color:${['#112A46','#176B80','#BD8B30'][i%3]};margin-left:${i%2?'18%':'0'}"><span>${i+1}</span><b>${esc(x.short)}</b></button>`).join('')}</div><div class="route-detail" id="route-detail" tabindex="-1" role="region" aria-label="Explicación completa del paso seleccionado"><span class="kicker">Estación ${sel+1} de 10</span><h3>${esc(p.full)}</h3><p>${esc(p.detail)}</p><p class="small">Más adelante desarrollaremos esta etapa con explicaciones, ejemplos y actividades.</p><button type="button" class="btn smallbtn ghost" data-nav="${p.scene}">Ir a la explicación de este paso →</button></div>`)}${achievement('Conocimos las diez etapas y su orden lógico. Ahora podemos seguir el mismo camino mientras construimos el estudio guiado.')}${nextLink('El primer paso es seleccionar una operación concreta y el segundo, describirla y dividirla en elementos medibles.')}`}
function scene5(){let types=[['Repetitivo','Aparece en cada ciclo del trabajo cuando el método se mantiene constante.','Tomar y abrir una bolsa en cada empaque.'],['Irregular','Es necesario, pero aparece solo en determinados ciclos o con una frecuencia periódica.','Reponer un paquete de bolsas cada 25 unidades. Si requiere 30 s, aporta 30/25 = 1,2 s por unidad antes de los ajustes pertinentes.'],['Extraño','Actividad o interrupción ajena al método definido; se registra e investiga su causa.','Caída accidental de una herramienta que interrumpe la operación. No se elimina sin registro ni se suma automáticamente.'],['Manual','Trabajo realizado directamente por una persona, sensible a su método y valoración de ritmo.','Introducir el cuaderno en la bolsa.'],['De máquina','Acción realizada por un equipo, automática o con intervención; requiere distinguir ejecución humana y de máquina.','Un sellador automático mantiene su ciclo aunque el trabajador prepare el siguiente producto.']];
 return `${lede('Paso 1 · Seleccionar la operación','Primero identificamos la necesidad empresarial. Después, en el paso 2, establecemos exactamente qué se medirá.',4)}${stepBand(1)}${panel('Caso guiado: empaque de cuadernos',`<div class="callout"><p>Una empresa distribuidora de útiles escolares cuenta con una estación en la que un operario empaca cuadernos en bolsas transparentes para despacho. La gerencia necesita conocer el tiempo estándar de la operación para <strong>estimar paquetes por hora, programar la producción y valorar las necesidades de personal en temporada alta</strong>.</p><p>El método está definido y se supone estable para este estudio académico. Los tiempos del caso son <strong>datos ilustrativos</strong>, no mediciones certificadas de una empresa real.</p></div><p><strong>¿Qué haremos?</strong> Observaremos la operación, definiremos los elementos, cronometramos, determinaremos las observaciones necesarias, calcularemos el tiempo normal y los suplementos y finalmente obtendremos el estándar y su interpretación.</p>`)}${achievement('Seleccionamos la operación de empaque y definimos para qué se necesita medir: planear la producción y examinar mejoras con un estándar sostenible.')}${stepBand(2)}${panel('Paso 2 · Definir el método y sus elementos',`<p>Un <strong>elemento</strong> es una parte identificable de la operación que tiene un inicio y un final observables. Dividir el proceso permite medirlo con consistencia y descubrir qué parte requiere más tiempo.</p><p>La operación tiene <strong>seis acciones</strong>: tomar bolsa, abrirla, tomar cuaderno, introducirlo, sellar y colocar en bandeja. Para el estudio agruparemos esas acciones en <strong>cuatro elementos medibles</strong>.</p><div class="photos-grid">${EGUIDE.map((x,i)=>quickPhoto(i)).join('')}</div>${tbl(['Elemento','Inicio de la medición','Final de la medición'],[['E1 · Tomar y abrir bolsa','Mano comienza a tomar una bolsa del dispensador','Bolsa abierta y lista'],['E2 · Tomar cuaderno','Mano se dirige a la pila de cuadernos','Cuaderno en mano y listo para introducir'],['E3 · Introducir en bolsa','Empieza a introducir el cuaderno en la abertura','Cuaderno completamente dentro de la bolsa'],['E4 · Sellar y colocar','Comienza a cerrar el empaque','Paquete sellado en la bandeja final']])}<p>Selecciona un elemento para comprobar dónde termina:</p><div class="buttons">${EGUIDE.map((_,i)=>button('e'+i,'E'+(i+1),'ghost')).join('')}</div>${feedbackKey('element')}`)}${panel('Tipos de elementos: primero entiende y luego observa el ejemplo',`<div class="types-grid">${types.map(x=>`<div class="type-card"><strong>${x[0]}</strong><p>${x[1]}</p><small><b>Ejemplo:</b> ${x[2]}</small></div>`).join('')}</div><p class="small"><strong>Solapamiento:</strong> periodo durante el cual dos actividades se ejecutan al mismo tiempo, de forma total o parcial. Si la máquina sella durante 20 s mientras el operario prepara otra pieza durante 8 s dentro de ese intervalo, no se suman como 28 s consecutivos. Debe analizarse la secuencia real.</p>`)}${achievement('Definimos el método de empaque, sus cuatro elementos y sus puntos exactos de inicio y final. Estos límites son necesarios para tomar mediciones comparables.')}${nextLink('Con los elementos identificados, elegiremos el procedimiento de cronometraje y practicaremos su lectura.')}`}
function scene6(){return `${lede('Paso 3 · Elegir el método de cronometraje','Con los cuatro elementos definidos, debemos decidir cómo registrar sus duraciones y aprender a diferenciar una lectura acumulada de un tiempo elemental.',5)}${stepBand(3)}${panel('Dos técnicas posibles',`<div class="twocol"><div class="callout"><strong>Vuelta a cero</strong><p>Al finalizar un elemento se registra directamente su duración y se reinicia el reloj para el siguiente. Evita restas, pero exige reiniciar con cuidado y puede introducir pequeñas pérdidas de medición.</p></div><div class="callout"><strong>Lectura continua</strong><p>El cronómetro permanece funcionando durante el ciclo. Se registran las lecturas acumuladas y se calcula la duración de cada elemento restando la lectura anterior.</p></div></div>${hint('En ambos casos se debe observar exactamente el final del elemento. El método de cronometraje no reemplaza los puntos de corte definidos en el paso 2.')}`)}${panel('Dos cronómetros de práctica',`<div class="tabs"><button class="tab ${state.guideClockMode==='zero'?'active':''}" type="button" data-act="modeZero">↺ Vuelta a cero</button><button class="tab ${state.guideClockMode==='continuous'?'active':''}" type="button" data-act="modeContinuous">→ Lectura continua</button></div><div class="timer-work"><div>${clockSvg()}<p class="small" id="clockStatus" style="text-align:center">Listo para medir.</p></div><div><h3>Prueba el procedimiento</h3><p>Inicia el reloj y marca el final de cada elemento. En el modo continuo comprobarás que la duración se obtiene por diferencia; con vuelta a cero se lee directamente.</p><div class="buttons">${button('clockStart','▶ Iniciar','gold')}${button('clockMark','◉ Marcar elemento')}${button('clockPause','Ⅱ Pausar','ghost')}${button('clockReset','↺ Reiniciar','ghost')}</div></div></div><h3>Registro de práctica</h3><div id="clockTable">${clockTable()}</div>`)}${panel('Ejemplo: lectura continua de una operación',`${tbl(['Elemento','Lectura acumulada','Tiempo de ese elemento'],[['E1','5,20 s','5,20 − 0,00 = 5,20 s'],['E2','8,40 s','8,40 − 5,20 = 3,20 s'],['E3','13,70 s','13,70 − 8,40 = 5,30 s'],['E4','20,00 s','20,00 − 13,70 = 6,30 s']])}<p>Para el ejemplo, el total del ciclo es 20,00 segundos, pero el elemento 3 solo duró 5,30 segundos: su lectura es acumulada.</p>`)}${achievement('Elegimos una técnica de registro y aprendimos a obtener el tiempo de cada elemento, sin confundirlo con el tiempo acumulado.')}${nextLink('Ahora realizaremos las primeras mediciones del caso y cuidaremos que las unidades sean consistentes.')}`}
function scene7(){const t=[.08,.09,.08,.10,.09],v=t.map(x=>x*60);return `${lede('Paso 4 · Registrar las observaciones preliminares','Una vez identificados los elementos y sus puntos de corte, observamos el proceso varias veces antes de decidir cuántas mediciones serán necesarias.',6)}${stepBand(4)}${panel('¿Qué es una observación y qué es un ciclo?',`<p><strong>Ciclo:</strong> ejecución completa de la operación, desde tomar la bolsa hasta dejar el paquete terminado. <strong>Observación:</strong> duración registrada de un elemento en un ciclo concreto.</p><p>Para nuestro estudio empezamos con <strong>cinco observaciones preliminares por elemento</strong>. Sus datos ayudarán a calcular la muestra en el paso siguiente. Estas primeras mediciones no sustituyen el análisis de suficiencia estadística.</p>`)}${panel('Convertir tiempos sin confundir unidades',`<p>Un cronómetro puede expresar duraciones en segundos o en minutos decimales. Si eliges una unidad, debes mantenerla durante las operaciones o convertir todos los datos de manera coherente.</p><div class="twocol"><div class="formula"><span class="mathlabel">Minutos decimales a segundos</span>${M('Segundos = minutos × 60')}<p>0,08 min × 60 = <strong>4,8 s</strong></p></div><div class="formula"><span class="mathlabel">Segundos a minutos decimales</span><math display="block"><mtext>Minutos</mtext><mo>=</mo><mfrac><mtext>Segundos</mtext><mn>60</mn></mfrac></math><p>4,8 s ÷ 60 = <strong>0,08 min</strong></p></div></div>${explainVars([['min','minutos decimales'],['s','segundos'],['60','cantidad de segundos en un minuto']])}<p><strong>Ojo:</strong> 1,50 minutos decimales equivalen a 1 minuto y 30 segundos; no a 1 minuto y 50 segundos.</p><div class="field"><label for="convertInput">Comprobación: ¿a cuántos segundos equivalen 0,09 minutos?</label><input type="text" inputmode="decimal" id="convertInput" data-field="samplePractice" value="${esc(state.samplePractice)}" placeholder="Escribe el valor en segundos"></div>${button('checkConversion','Comprobar')}${feedbackKey('conversion')}`)}${panel('Primeras cinco observaciones de E3: introducir el cuaderno',`${tbl(['Observación','Minutos decimales','Segundos'],t.map((x,i)=>[i+1,num(x,2),num(v[i],2)]),`<td>Total</td><td>0,44 min</td><td>26,40 s</td>`)}<p><strong>¿Cómo se calcula un promedio?</strong> Se suman todas las duraciones y se dividen por la cantidad de registros válidos.</p>${explainedFormula('avg','Promedio preliminar del tiempo observado')}<p><strong>En minutos:</strong> TO = (0,08 + 0,09 + 0,08 + 0,10 + 0,09) / 5 = <strong>0,088 min</strong>.</p><p><strong>En segundos:</strong> TO = (4,8 + 5,4 + 4,8 + 6,0 + 5,4) / 5 = <strong>5,28 s</strong>.</p><p>Es el mismo promedio expresado en dos unidades, y es <strong>preliminar</strong>: aún debemos comprobar si cinco mediciones son suficientes.</p>`)}${panel('¿Cuándo usar minutos o segundos?',`<p>Los <strong>segundos</strong> facilitan interpretar operaciones breves, como tomar una bolsa o colocar una pieza. Los <strong>minutos decimales</strong> pueden facilitar los cálculos y registros de operaciones más largas.</p><p>No existe un límite único: la elección depende de la duración del elemento, la resolución del cronómetro y la facilidad de análisis. Lo indispensable es trabajar con <strong>una unidad consistente</strong> y declarar esa unidad en cada tabla o resultado.</p>`)}${achievement('Obtuvimos cinco lecturas iniciales por elemento, aprendimos a convertir sus unidades y sabemos cómo calcular un promedio preliminar.')}${nextLink('Ahora averiguaremos cuántas mediciones necesitamos para cada uno de los cuatro elementos, porque no todos tienen la misma variación.')}`}
function scene8(){let req=GUIDE_REQUIRED,values=col(G_FULL,2).slice(0,5),rows=EGUIDE.map((s,i)=>[`E${i+1} · ${esc(s)}`,num(sampleCalc(col(G_FULL,i).slice(0,5)),2),req[i],req[i]-5]);return `${lede('Paso 5 · Calcular el tamaño de muestra','¿Alcanzan cinco observaciones? Depende de la dispersión de los tiempos de cada elemento y de la precisión que queremos para el estudio.',7)}${stepBand(5)}${panel('¿Qué significa tamaño de muestra?',`<p>Es la <strong>cantidad estimada de registros</strong> necesarios para obtener el promedio del tiempo con un error relativo y un nivel de confianza determinados.</p><p>Si los tiempos observados varían mucho, generalmente necesitaremos más registros. Para este caso utilizaremos una aproximación clásica con coeficiente 40, asociada aproximadamente a 95,45 % de confianza y ±5 % de error relativo bajo sus supuestos. No es una fórmula aplicable automáticamente a cualquier precisión o situación.</p>${explainedFormula('sample','Fórmula estadística para cada elemento')}`)}${panel('Ejemplo resuelto: E3 · Introducir el cuaderno',`${guideSampleTable()}<p><strong>Datos:</strong> n′ = 5 observaciones, suma de tiempos = 0,44 min y suma de cuadrados = 0,0390 min².</p>${formula(M('n = [40 × √(5 × 0,0390 − (0,44)²) / 0,44]²'),'Sustitución matemática')}${formula(M('n = [40 × √0,0014 / 0,44]² = 11,5702'),'Resultado antes de redondear')}<div class="twocol"><div class="stat"><small>Observaciones requeridas</small><b>12</b></div><div class="stat"><small>Observaciones que faltan</small><b>7</b></div></div><p>Se redondea <strong>siempre al entero superior</strong>. De las 12 necesarias, cinco ya se obtuvieron en la etapa preliminar; por tanto faltan siete.</p>`)}${panel('Resultado del cálculo para los cuatro elementos',`${tbl(['Elemento','n sin redondear','n requerida','Faltan después de las cinco iniciales'],rows)}<p><strong>Interpretación:</strong> E1 necesita 6, E2 necesita 14, E3 necesita 12 y E4 necesita 7 observaciones. <strong>No debemos afirmar que todos necesitan 14.</strong> En este ejercicio documentaremos el número de mediciones requerido individualmente para cada elemento.</p><p>En el cronometraje de ciclos completos se pueden registrar todos los elementos durante 14 ciclos si resulta práctico; eso genera registros adicionales válidos, pero no cambia los mínimos estimados individualmente. Aquí calcularemos los promedios usando 6, 14, 12 y 7 registros, respectivamente, para mostrar la lógica de cada muestra.</p><p>Comprueba: para E2, el valor sin redondear es aproximadamente 13,17. ¿Cuántas observaciones adicionales necesitamos después de las cinco preliminares?</p><div class="buttons">${button('sample8','8','ghost')}${button('sample9','9','ghost')}${button('sample10','10','ghost')}</div>${feedbackKey('sampleInterpret')}`)}${achievement('Calculamos el número estimado de observaciones de cada elemento y sabemos exactamente cuántas mediciones faltan: 1 para E1, 9 para E2, 7 para E3 y 2 para E4.')}${nextLink('Completaremos los registros requeridos, revisaremos posibles anomalías y obtendremos un promedio definitivo para cada elemento.')}`}
function scene9(){let example=EGUIDE.map((s,j)=>{let arr=G_FULL.slice(0,GUIDE_REQUIRED[j]).map(r=>r[j]),a=avg(arr);return [`E${j+1}`,GUIDE_REQUIRED[j],num(sum(arr),4),num(a,6),num(a*60,3)+' s']});return `${lede('Paso 6 · Revisar datos y calcular los promedios','Ya conocemos cuántas observaciones requiere cada elemento. Ahora completamos los registros necesarios y calculamos sus promedios con los datos válidos.',8)}${stepBand(6)}${panel('Tabla completa de mediciones disponibles para el ejercicio',`<p>Los guiones indican que <strong>no se requieren observaciones adicionales para ese elemento</strong>; no representan tiempos de cero. La operación es ficticia y todos sus datos se ofrecen para practicar los cálculos.</p>${guideDataTable()}<p>Comprueba que se utilizan <strong>6 lecturas de E1, 14 de E2, 12 de E3 y 7 de E4</strong>. No dividas todos los elementos entre 14.</p>`)}${panel('¿Qué ocurre si aparece una observación diferente?',`<p>Antes de quitar una lectura debemos investigar su causa. Un error del cronómetro puede documentarse y corregirse; una dificultad habitual del material puede representar una variación real que merece análisis.</p><p><strong>Situación:</strong> una bolsa tarda más en sellarse porque requiere una segunda presión, algo que ocurre ocasionalmente en lotes normales. ¿Es correcto excluirla solo porque es una lectura alta?</p><div class="buttons">${button('anomNo','No, primero investigar','ghost')}${button('anomYes','Sí, para reducir la dispersión','ghost')}</div>${feedbackKey('anom')}`)}${panel('Calcular el tiempo observado promedio de cada elemento',`${explainedFormula('avg','Tiempo observado promedio por elemento')}${tbl(['Elemento','n válido','Suma de tiempos (min)','TO promedio (min)','Equivalente en segundos'],example)}<p><strong>Ejemplo E4:</strong> suma de siete lecturas = 0,82 min; promedio = 0,82 / 7 = <strong>0,117143 min</strong>, equivalentes a <strong>7,029 s</strong>.</p><p>No se suman los promedios todavía para establecer un estándar: falta ajustar cada tiempo por el ritmo observado y, después, incorporar los suplementos.</p>`)}${achievement('Revisamos los registros y obtuvimos el tiempo observado promedio de cada elemento con su propio tamaño de muestra. Estos cuatro promedios son la entrada para la valoración del ritmo.')}${nextLink('El cronómetro muestra cuánto se tardó; ahora estimaremos a qué ritmo se ejecutó el trabajo para calcular el tiempo básico.')}`}
function gauge(v){let a=-80+(v-70)/(130-70)*160,rad=a*Math.PI/180,x=110+75*Math.sin(rad),y=117-75*Math.cos(rad);return `<svg viewBox="0 0 220 158" class="gauge" role="img" aria-label="Valoración del ritmo seleccionada ${v} por ciento"><path d="M22 117 A88 88 0 0 1 70 39" fill="none" stroke="#176B80" stroke-width="18"/><path d="M74 37 A88 88 0 0 1 146 37" fill="none" stroke="#D6A84B" stroke-width="18"/><path d="M150 39 A88 88 0 0 1 198 117" fill="none" stroke="#112A46" stroke-width="18"/><line x1="110" y1="117" x2="${x.toFixed(2)}" y2="${y.toFixed(2)}" stroke="#112A46" stroke-width="5" stroke-linecap="round"/><circle cx="110" cy="117" r="8" fill="#112A46"/><text x="110" y="143" fill="currentColor" text-anchor="middle" font-weight="700" font-size="13">VR ${v} %</text></svg>`}
function scene10(){let v=state.ritmo;return `${lede('Paso 7 · Valorar el ritmo de trabajo','Con el tiempo observado promedio ya calculado, necesitamos valorar si la ejecución fue más lenta, igual o más rápida que el ritmo de referencia.',9)}${stepBand(7)}${panel('¿Qué es la valoración del ritmo (VR)?',`<p>Es el juicio técnico con el que un analista compara la <strong>velocidad de ejecución observada</strong> con el ritmo tipo de una persona capacitada, trabajando con método definido, calidad y seguridad.</p><p><strong>VR = 100</strong> significa ritmo de referencia. <strong>VR inferior a 100</strong> representa una ejecución más lenta que ese patrón y <strong>VR superior a 100</strong>, una ejecución más rápida. No es una nota de calidad ni una medición directa del cronómetro.</p><div class="gauge-layout">${gauge(v)}<div class="gauge-info"><p><strong>VR &lt; 100:</strong> ritmo inferior al tipo, sin que ello signifique automáticamente un error del trabajador.</p><p><strong>VR = 100:</strong> trabajo competente, fluido y sostenible al patrón definido.</p><p><strong>VR &gt; 100:</strong> ritmo superior al tipo; la calidad, seguridad y método deben mantenerse.</p></div></div><p>La valoración depende de la experiencia y entrenamiento del analista. Como referencia pedagógica utilizaremos la <strong>escala británica 0–100 con ritmo tipo 100</strong>, practicando valoraciones en incrementos de cinco puntos: 80, 85, 90, 95, 100, 105, 110… Existen otros sistemas y la cifra requiere observación y calibración.</p>`)}${panel('Descripciones orientadoras de la escala',`${tbl(['VR ilustrativa','Descripción del desempeño'],[['50','Muy lento: movimientos inseguros o torpes, por debajo del ritmo de referencia.'],['75','Constante y sin prisa; ejecución inferior al ritmo tipo.'],['95','Ligeramente inferior al ritmo de referencia.'],['100','Ritmo tipo: activo, capaz, regular y con calidad.'],['105','Ligeramente superior al ritmo tipo, manteniendo el método.'],['125','Muy rápido, con destreza y coordinación claramente superiores al patrón.'],['150','Excepcionalmente rápido; no es una meta sostenible para cualquier persona.']])}<p class="small">Las descripciones ayudan a comparar el desempeño; no permiten asignar un porcentaje exacto sin observar la ejecución en condiciones representativas.</p>`)}${panel('Simulador: el mismo cronometraje, diferentes valoraciones',`<p>Imagina que el tiempo observado promedio es de 10 segundos. Cambia VR y observa la duración equivalente a un ritmo 100.</p><input id="rateSlide" class="controlrange" type="range" min="70" max="130" step="5" value="${v}" aria-label="Valoración del ritmo"><div class="twocol"><div class="stat"><small>Valoración del ritmo</small><b id="ratePct">${v} %</b></div><div class="stat"><small>Tiempo básico equivalente</small><b id="rateResult">${num(v/10,2)} s</b></div></div><p id="rateExplanation">${v===100?'El registro ya corresponde al ritmo de referencia.':v>100?'La ejecución fue más rápida; su tiempo básico se normaliza hacia arriba.':'La ejecución fue más lenta; al normalizarla, el tiempo básico disminuye.'}</p>${explainedFormula('normal','Tiempo básico a partir de la valoración')}${hint('El tiempo básico NO es exactamente lo que vimos en el cronómetro: es el tiempo equivalente si el operario trabajara al ritmo de referencia 100 %.')}`)}${achievement('Comprendimos qué representa VR, por qué debe justificarse y cómo un mismo tiempo observado produce distintos tiempos básicos según el ritmo registrado.')}${nextLink('Aplicaremos ahora las cuatro valoraciones al caso de cuadernos y calcularemos el tiempo normal de toda la operación.')}`}
function scene11(){const rows=EGUIDE.map((e,j)=>[`E${j+1} · ${esc(e)}`,GUIDE_REQUIRED[j],num(GUIDE_AVG[j],6),VR_GUIDE[j]+' %',num(GUIDE_TN[j],6)]);return `${lede('Paso 7 · Calcular el tiempo básico y el tiempo normal','Con los promedios de cada elemento y una valoración de su ritmo, ya podemos expresar todos los tiempos a una referencia comparable.',10)}${stepBand(7)}${panel('Cómo se obtiene el tiempo básico de un elemento',`<p>El <strong>tiempo básico (TB)</strong> expresa la duración que correspondería a la ejecución del elemento con un ritmo tipo 100. No es exactamente el tiempo leído en el cronómetro.</p>${explainedFormula('normal','Fórmula del tiempo básico (TB) o normal (TN)')}<p><strong>Ejemplo E2:</strong> el tiempo observado promedio es ${num(GUIDE_AVG[1],8)} min y el ritmo asignado es 95 %.</p>${formula(M('TB₂ = 0,05357143 × 95 / 100 = 0,05089286 min'),'Sustitución de E2')}<p>La ejecución estaba ligeramente por debajo del ritmo tipo; por eso el ajuste produce un tiempo básico algo menor que el observado.</p>`)}${panel('Cálculo completo de los cuatro elementos',`${tbl(['Elemento','n utilizado','TO promedio (min)','VR','TB del elemento (min)'],rows)}<p>La valoración utilizada para el caso de práctica es E1 = 100 %, E2 = 95 %, E3 = 105 % y E4 = 110 %. Cada valor representa una hipótesis de observación técnica y se interpreta en el mismo criterio de referencia.</p>`)}${panel('Tiempo normal total del ciclo',`<p>Como en este método los cuatro elementos son <strong>secuenciales</strong>, sumamos sus tiempos básicos. Si existieran acciones simultáneas o solapamientos, estudiaríamos su cronología antes de sumar.</p>${formula(M('TN del ciclo = TB₁ + TB₂ + TB₃ + TB₄'),'Suma de los cuatro elementos')}${explainVars([['TN','tiempo normal del ciclo completo'],['TB₁ … TB₄','tiempos básicos de los cuatro elementos'],['+','suma válida cuando los elementos son consecutivos']])}<p>${GUIDE_TN.map(x=>num(x,6)).join(' + ')} = <strong>${num(GUIDE_SUM,6)} min</strong>, equivalentes a <strong>${num(GUIDE_SUM*60,3)} segundos</strong>.</p>`)}${panel('¿Qué revela el resultado?',`<div class="bars">${GUIDE_TN.map((x,j)=>`<div class="bar-item"><span>E${j+1} · ${esc(EGUIDE[j])}</span><div class="bar-outer"><div class="bar-inner ${j===3?'highlight':''}" style="width:${x/Math.max(...GUIDE_TN)*100}%"></div></div><b>${num(x,4)} min</b><small>${num(x/GUIDE_SUM*100,2)} %</small></div>`).join('')}</div><p><strong>Respuesta:</strong> E4, sellar y colocar, es el elemento que requiere más tiempo normal: ${num(GUIDE_TN[3],6)} min (${num(GUIDE_TN[3]*60,2)} s), equivalente al <strong>${num(GUIDE_TN[3]/GUIDE_SUM*100,2)} % del ciclo</strong>. E3 ocupa el segundo lugar con ${num(GUIDE_TN[2]/GUIDE_SUM*100,2)} %.</p><p><strong>¿Qué conviene investigar?</strong> La posición del sellado, la distancia hasta la bandeja, la forma de sujetar el paquete y los movimientos de manos. El mayor tiempo no prueba por sí mismo que E4 esté mal diseñado o sea un cuello de botella; es una prioridad para observar y comparar alternativas, conservando calidad y seguridad.</p>`)}${achievement('Calculamos los cuatro tiempos básicos y el tiempo normal del ciclo completo: '+num(GUIDE_SUM,6)+' minutos. También localizamos el elemento que conviene examinar primero para posibles mejoras.')}${nextLink('El tiempo normal aún no es el estándar. Ahora debemos considerar necesidades personales, recuperación de fatiga y otras condiciones justificadas.')}`}
function scene12(){let rows=[['Necesidades personales','Pausas ordinarias para ir al baño, beber agua y atender necesidades fisiológicas.','Se consideran al establecer concesiones de descanso sostenibles.'],['Fatiga básica','Recuperación del esfuerzo propio de realizar el trabajo durante un periodo prolongado.','Se documenta según método, jornada y sistema de concesiones adoptado.'],['Postura y fuerza','Exigencias adicionales por trabajar de pie, inclinaciones o manipular cargas.','Se observa postura real, intensidad y frecuencia; no se añade sin evidencia.'],['Iluminación, ruido, temperatura','Exigencias ambientales que pueden aumentar esfuerzo o fatiga.','Se evalúan y corrigen riesgos antes de fijar un estándar; un porcentaje no vuelve seguro el puesto.'],['Concentración, tensión mental','Atención sostenida y precisión que requiere una tarea.','Se comprueba si la actividad exige realmente esa concentración y durante cuánto tiempo.'],['Monotonía y tedio','Repetición prolongada con poca variación o actividades muy rutinarias.','No sumar simultáneamente factores equivalentes sin analizar doble contabilización.'],['Contingencias o tareas especiales','Incidentes inevitables justificados, reposición periódica o limpieza obligatoria.','Registrar frecuencia y, cuando corresponda, medir como elemento separado en lugar de porcentaje.']];return `${lede('Paso 8 · Determinar los suplementos','Para planificar una tarea no basta con ajustar la velocidad. También debemos considerar las necesidades de descanso y las condiciones justificadas del trabajo.',11)}${stepBand(8)}${panel('¿Qué es un suplemento?',`<p>Es una <strong>concesión de tiempo adicional</strong> incorporada al tiempo normal para atender necesidades personales, recuperación de fatiga y determinadas circunstancias del método. Un estándar debe ser razonable, seguro y sostenible.</p><p>No debe utilizarse como excusa para ignorar una mala distribución del puesto, fallas habituales de mantenimiento, falta de material o riesgos de seguridad. Primero se analiza y corrige la causa.</p>${tbl(['Factor','Qué significa','Cuándo se considera'],rows)}`)}${panel('Tabla histórica de suplementos por descanso',`<p>La siguiente tabla presenta <strong>suplementos constantes y variables</strong>, con categorías y porcentajes históricos. Es una referencia didáctica y en la propia imagen se indica <strong>«Ejemplo sin valor normativo»</strong>.</p>${suppImage()}<p><strong>Cómo consultarla:</strong> identifica el factor observado, revisa la descripción y el valor de referencia, comprueba si corresponde al puesto, documenta por qué lo consideras y verifica que no se duplique con otro factor. Los porcentajes mostrados no se aplican automáticamente.</p><p>La clasificación histórica utiliza columnas de hombres y mujeres. Hoy una aplicación profesional debe fundamentarse en las exigencias reales, las condiciones del puesto, criterios de seguridad y trato no discriminatorio, no solo en esa división.</p>`)}${panel('Ejemplo: dos personas realizan una misma operación',`<p>Supón que, para un ejercicio matemático de lectura de la tabla histórica, una persona tiene 5 % de necesidades personales y 4 % de fatiga básica, mientras otra tiene 7 % y 4 %, respectivamente. Las sumas son 9 % y 11 %.</p><p><strong>Si ambas realizan independientemente el mismo método</strong>, con el mismo tiempo normal y el mismo número de unidades, el promedio aritmético ilustrativo es:</p>${formula(M('S = (9 % + 11 %) / 2 = 10 %'),'Promedio simple de porcentajes')}${explainVars([['S','suplemento medio del ejercicio'],['9 %, 11 %','porcentajes históricos supuestos para cada persona'],['2','cantidad de personas con igual participación']])}<p>Si una realiza el 70 % de las unidades y la otra el 30 %, manteniendo igual tiempo normal por unidad, el promedio ponderado ilustrativo será <strong>0,70 × 9 % + 0,30 × 11 % = 9,6 %</strong>.</p><p><strong>Pero si trabajan simultáneamente en una misma unidad</strong>, no corresponde promediar sin más: se deben medir las tareas y tiempos de cada persona y analizar los solapamientos. En una empresa real no debe asignarse un suplemento individual únicamente por sexo.</p>`)}${panel('Aplicación al caso guiado: matriz de concesiones',`<p>Para el escenario didáctico de empaque de cuadernos se adoptan los siguientes supuestos, que servirán para practicar el cálculo. <strong>No equivalen a una aprobación profesional de las condiciones del puesto.</strong></p>${tbl(['Concepto','Suplemento del escenario'],[['Necesidades personales','5 %'],['Fatiga básica','4 %'],['Trabajo de pie','4 %'],['Concentración','2 %'],['Monotonía','1 %'],['<strong>Total</strong>','<strong>16 %</strong>']])}<p>El 16 % es un escenario de práctica. Se debería verificar si cada factor se justifica en un puesto real, si existe recuperación ya incluida y si hay condiciones que deben corregirse. El estudiante aprenderá en el reto a registrar esos criterios.</p>${formula(M('S = (5 + 4 + 4 + 2 + 1) / 100 = 0,16'),'Suplemento total en forma decimal')}${explainVars([['S','proporción total de suplementos sobre el tiempo normal'],['5, 4, 4, 2, 1','porcentajes ilustrativos seleccionados'],['100','conversión de porcentaje a número decimal']])}`)}${achievement('Distinguimos los tipos de suplementos, aprendimos cuándo considerar cada uno, consultamos la tabla completa y adoptamos un 16 % como supuesto declarado del caso guiado.')}${nextLink('Ahora incorporaremos el suplemento al tiempo normal para calcular el tiempo estándar de la operación.')}`}
function scene13(){let s=.16,ts=GUIDE_SUM*s,te=GUIDE_SUM*(1+s);return `${lede('Paso 9 · Calcular el tiempo estándar','Ya tenemos el tiempo normal completo de la operación y la proporción total de suplementos del escenario.',12)}${stepBand(9)}${panel('Tiempo suplementario y tiempo estándar',`<p>El <strong>tiempo suplementario (TS)</strong> es la cantidad de tiempo adicional correspondiente a la concesión adoptada. El <strong>tiempo estándar (TE)</strong> es el tiempo normal más ese tiempo adicional.</p>${formula(M('TS = TN × S'),'Tiempo suplementario')}${explainVars([['TS','tiempo suplementario'],['TN','tiempo normal del ciclo'],['S','proporción total de suplementos en decimal']])}${formula(M('TE = TN + TS = TN × (1 + S)'),'Tiempo estándar')}${explainVars([['TE','tiempo estándar'],['TN','tiempo normal del ciclo'],['TS','tiempo suplementario'],['S','suplemento en forma decimal calculado sobre TN']])}<p>En este modelo el porcentaje se calcula <strong>sobre el tiempo normal</strong>; si se utilizara una base distinta habría que declarar y aplicar su fórmula correspondiente.</p>`)}${panel('Sustitución paso a paso',`<div class="steps-compact"><p><b>1. Tiempo normal:</b> TN = ${num(GUIDE_SUM,6)} min.</p><p><b>2. Suplemento:</b> S = 16 % = 0,16.</p><p><b>3. Tiempo adicional:</b> TS = ${num(GUIDE_SUM,6)} × 0,16 = <strong>${num(ts,6)} min</strong>.</p><p><b>4. Tiempo estándar:</b> TE = ${num(GUIDE_SUM,6)} + ${num(ts,6)} = <strong>${num(te,6)} min/unidad</strong>.</p></div><div class="twocol"><div class="stat"><small>Tiempo estándar del ciclo</small><b>${num(te,6)} min</b></div><div class="stat"><small>Equivalente en segundos</small><b>${num(te*60,3)} s</b></div></div><p>El suplemento no obliga a detenerse exactamente después de cada unidad; representa una asignación temporal incorporada al estándar.</p>`)}${panel('Explora el efecto del suplemento',`<p>Compara escenarios manteniendo el tiempo normal constante. El resultado cambia matemáticamente, pero el porcentaje debe justificarse técnicamente.</p><input class="controlrange" id="suppSlider" type="range" min="8" max="22" value="${state.suppScenario}" step="1" aria-label="Porcentaje de suplemento"><div class="threecol"><div class="stat"><small>Suplemento</small><b id="suppPct">${state.suppScenario}%</b></div><div class="stat"><small>TE (min/unidad)</small><b id="suppTE">${num(GUIDE_SUM*(1+state.suppScenario/100),6)}</b></div><div class="stat"><small>Unidades/hora</small><b id="suppUPH">${num(60/(GUIDE_SUM*(1+state.suppScenario/100)),2)}</b></div></div>`)}${achievement('Obtuvimos el tiempo estándar del ejemplo: '+num(te,6)+' minutos por unidad, con un suplemento didáctico del 16 % declarado sobre el tiempo normal.')}${nextLink('Con el tiempo estándar calculado, estimaremos la producción por hora y formularemos decisiones de mejora.')}`}
function scene14(){let te=GUIDE_SUM*1.16;return `${lede('Paso 10 · Estimar capacidad y tomar decisiones','Un tiempo estándar es útil cuando se traduce en una decisión empresarial, interpretando siempre los supuestos y limitaciones del estudio.',13)}${stepBand(10)}${panel('¿Cuántas unidades se podrían producir en una hora?',`<p>Para una sola estación, con un ciclo secuencial por unidad y condiciones estables, dividimos el tiempo disponible entre el tiempo estándar por unidad.</p>${explainedFormula('capacity','Capacidad estimada por hora')}<p><strong>Sustitución:</strong> 60 / ${num(te,6)} = <strong>${num(60/te,2)} unidades por hora</strong>. Se pueden completar aproximadamente 145 unidades enteras en una hora, bajo los supuestos del cálculo.</p><p>Este resultado es una <strong>referencia de capacidad</strong>, no una garantía absoluta: deben comprobarse abastecimiento, disponibilidad del puesto, calidad, restricciones de otros procesos y validez del estándar.</p>`)}${panel('¿Dónde tiene sentido estudiar una mejora?',`<p>El elemento E4 es el de mayor duración normal. Podemos analizar un rediseño del puesto, la ubicación de la bandeja y los movimientos necesarios para sellar y colocar. Solo después de comprobar calidad y seguridad podremos comparar el método nuevo con el anterior.</p><label for="improveSlide">Reducción hipotética del tiempo normal de E4 manteniendo el método seguro y la calidad:</label><input type="range" class="controlrange" id="improveSlide" min="0" max="20" value="0" step="1"><div class="threecol"><div class="stat"><small>Reducción simulada</small><b id="improveValue">0 %</b></div><div class="stat"><small>Nuevo TE</small><b id="improveTE">${num(te,6)} min</b></div><div class="stat"><small>Capacidad</small><b id="improveCap">${num(60/te,2)} u/h</b></div></div><p class="small">Los cambios mostrados son escenarios matemáticos, no mejoras de productividad demostradas en una empresa real.</p>`)}${panel('Interpretación que debe saber redactar un ingeniero',`<p>«Para la operación secuencial de empaque estudiada se obtuvo un tiempo normal de ${num(GUIDE_SUM,6)} minutos por unidad. Aplicando un suplemento didáctico del 16 % sobre el tiempo normal, el tiempo estándar estimado es ${num(te,6)} min/unidad, equivalente a una capacidad media de ${num(60/te,2)} unidades por hora. El elemento E4 concentra el mayor tiempo normal y debe ser investigado como posible oportunidad de mejora, sin concluir automáticamente que sea un cuello de botella. El estándar requiere verificación de las condiciones de trabajo y de la variabilidad real del proceso».</p>`)}${achievement('Convertimos el estándar en una estimación de capacidad y aprendimos a justificar una recomendación considerando limitaciones, condiciones y seguridad.')}${nextLink('Ahora comprobarás lo aprendido y luego desarrollarás un estudio independiente siguiendo exactamente la misma ruta de diez pasos.')}`}

let timerOn=false,timerStartAt=0,timerElapsed=0,timerInterval=null,calcOpen=false,calcInput='',lastNumericInput=null;
function nowClock(){return timerElapsed+(timerOn?performance.now()-timerStartAt:0)}
function formatClock(ms){let cs=Math.floor(Math.max(0,ms)/10);const secs=Math.floor(cs/100);return `${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')}.${String(cs%100).padStart(2,'0')}`}
function updateClock(){const el=document.getElementById('clockDigits');if(el)el.textContent=formatClock(nowClock());const stat=document.getElementById('clockStatus');if(stat)stat.textContent=timerOn?'Cronómetro en marcha. Marca el final de cada elemento.':nowClock()>0?'Medición pausada. Puedes continuar o reiniciar.':'Listo para medir.';}
function stopClock(){if(timerOn){timerElapsed=nowClock();timerOn=false}clearInterval(timerInterval);timerInterval=null}
function clockAction(cmd){if(cmd==='start'){if(timerOn)return;timerStartAt=performance.now();timerOn=true;timerInterval=setInterval(updateClock,50)}else if(cmd==='pause'){stopClock()}else if(cmd==='mark'){if(!timerOn){showToast('Inicia el cronómetro antes de marcar un elemento.');return}const mode=state.guideClockMode,arr=state.clockLog[mode],elapsed=nowClock()/1000,previous=mode==='continuous'&&arr.length?arr[arr.length-1].accum:0,duration=mode==='zero'?elapsed:elapsed-previous;if(duration<=0)return;arr.push({accum:mode==='zero'?elapsed:elapsed,duration});if(mode==='zero'){timerElapsed=0;timerStartAt=performance.now()}save();const area=document.getElementById('clockTable');if(area)area.innerHTML=clockTable();showToast(`Elemento ${arr.length} registrado: ${num(duration,2)} segundos.`)}else if(cmd==='reset'){stopClock();timerElapsed=0;state.clockLog[state.guideClockMode]=[];save();const area=document.getElementById('clockTable');if(area)area.innerHTML=clockTable()}updateClock()}

function caseValidate(step){const c=state.case,notes=[];
 if(step===0){if(String(c.selection||'').trim().length<20||String(c.methodReview||'').trim().length<20||!c.clockChoice||String(c.clockReason||'').trim().length<20)return{ok:false,txt:'Antes de calcular la muestra, completa en el expediente los pasos 1 a 4: selección, método, cronometraje y registro preliminar.'};for(let j=0;j<5;j++){let v=raw(c.n[j]);if(!Number.isFinite(v)||!Number.isInteger(v)||v!==Math.ceil(sampleCalc(col(CASE_TIMES,j).slice(0,5))))notes.push('E'+(j+1))}return notes.length?{ok:false,txt:`Revisa la muestra de ${notes.join(', ')}. Emplea solo las primeras cinco lecturas por elemento, suma cuadrados por separado y redondea al entero superior. No se muestra un solucionario anticipado.`}:{ok:true,txt:'Las cinco muestras preliminares coinciden con el cálculo. Las 20 observaciones originales están disponibles para elaborar el estudio.'}}
 if(step===1){for(let j=0;j<5;j++){let v=raw(c.to[j]);if(!Number.isFinite(v)||Math.abs(v-CASE_AVG[j])>0.00015)notes.push('E'+(j+1))}return notes.length?{ok:false,txt:`Revisa los promedios de ${notes.join(', ')}. Debes sumar los veinte registros del elemento y dividir entre 20; conserva suficientes decimales.`}:{ok:true,txt:'Tus cinco promedios corresponden a los 20 registros originales.'}}
 if(step===2){for(let j=0;j<5;j++){let vr=raw(c.vr[j]),tn=raw(c.tn[j]),to=raw(c.to[j]);if(!Number.isFinite(vr)||vr<70||vr>130||!Number.isFinite(tn)||!Number.isFinite(to)||Math.abs(tn-to*vr/100)>0.0002)notes.push('E'+(j+1))}let caveat=(raw(c.vr[0])<=100||raw(c.vr[2])<=100||raw(c.vr[4])>=100);return notes.length?{ok:false,txt:`Revisa ${notes.join(', ')}. Para cada elemento debe cumplirse TN = TO × VR / 100, en minutos. Comprueba también que el criterio cualitativo respalde la valoración.`}:caveat?{ok:false,txt:'Las operaciones aritméticas coinciden. Sin embargo, E1 y E3 se describen con ritmo superior a la referencia y E5 con ritmo inferior. Revisa si tus valores reflejan esas descripciones.'}:{ok:true,txt:'Tus tiempos normales corresponden a las valoraciones registradas. La valoración del ritmo exige observación y criterio técnico; no existe una sola cifra deducible de la descripción.'}}
 if(step===3){let vals=c.supp.map(raw);for(let j=0;j<5;j++){if(!Number.isFinite(vals[j])||vals[j]<0||vals[j]>30)notes.push(NAMES_ALLOW[j])}let total=sum(vals);const reasons=c.suppReasons.filter(x=>String(x).trim().length>=8).length;if(notes.length)return{ok:false,txt:`Revisa los porcentajes de ${notes.join(', ')}. Registra valores no negativos y justifica cada selección.`};if(total>35)return{ok:false,txt:'El suplemento total es muy alto para este supuesto didáctico. Verifica duplicaciones, condiciones de seguridad y criterios antes de continuar.'};if(String(c.allowJust).trim().length<20||reasons<3)return{ok:false,txt:'Explica las condiciones que requieren corrección y justifica los factores seleccionados; no basta con escribir porcentajes. Documenta también los factores que no aplican.'};return{ok:true,txt:`Has registrado una propuesta con ${num(total,2)} % sobre TN. La coherencia profesional del porcentaje depende de las evidencias y de corregir las condiciones inseguras.`}}
 if(step===4){let vals=c.tn.map(raw);if(vals.some(x=>!Number.isFinite(x)||x<=0))return{ok:false,txt:'Completa primero los cinco tiempos normales válidos.'};let supp=c.supp.map(raw);if(supp.some(x=>!Number.isFinite(x)||x<0))return{ok:false,txt:'Completa primero tu matriz de suplementos.'};let expected=sum(vals)*(1+sum(supp)/100),v=raw(c.standard),cap=raw(c.capacity);if(!Number.isFinite(v)||Math.abs(v-expected)>0.00025)return{ok:false,txt:'Revisa el TE: suma los tiempos normales y multiplica por (1 + suplemento total/100). Mantén la base del suplemento en el tiempo normal.'};if(!Number.isFinite(cap)||Math.abs(cap-60/expected)>0.2)return{ok:false,txt:'Revisa la capacidad: divide 60 minutos entre tu tiempo estándar expresado en minutos por unidad.'};return{ok:true,txt:'Tus operaciones de estándar y capacidad son consistentes con las valoraciones y suplementos que ingresaste. Recuerda explicar la validez y las condiciones de seguridad.'}}
 if(step===5){if(String(c.decision).trim().length<25||String(c.improvement).trim().length<25)return{ok:false,txt:'Escribe una conclusión técnica y una propuesta de mejora completas. Debes explicar el resultado, las condiciones de validez y una acción verificable.'};return{ok:true,txt:'Conclusión registrada. Antes de entregar, revisa que las mejoras tengan una justificación profesional y no impliquen reducir pausas sin fundamento.'}}
 return {ok:false,txt:'Revisa esta etapa.'};}
