<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#112A46">
<title>Biblioteca de laboratorios | Mg. Vicky Ruiz</title>
<style>
:root{--navy:#112A46;--teal:#176B80;--gold:#D6A84B;--cream:#F7F4EC;--ink:#303A46}
*{box-sizing:border-box}body{font:16px/1.65 Arial,system-ui,sans-serif;background:#fcfbf8;color:var(--ink);margin:0}
a{color:var(--teal)}a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
header{background:var(--navy);padding:38px 0;color:white}.wrap{width:min(1120px,calc(100% - 36px));margin:auto}h1,h2,h3{line-height:1.2;letter-spacing:-.025em}h1{font-size:clamp(28px,4vw,44px);margin:18px 0 12px}header a{color:#f1d084;text-decoration:none}header p{color:#e9edf1}
main{padding:35px 0 65px}.grupo{margin:0 0 40px}.grupo h2{color:var(--navy);margin:7px 0}.grupo>p{color:#596875}.ruta{color:var(--teal);font-size:13px;font-weight:bold}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.card{background:white;border:1px solid #dce5e8;border-top:6px solid var(--teal);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:12px;min-height:210px}.card h3{margin:0;font-size:20px;color:var(--navy)}.card p{font-size:14px;color:#596875;margin:0 0 8px}.state{background:#e6f3f0;color:#086754;font-size:12px;padding:5px 10px;border-radius:30px;font-weight:bold;align-self:flex-start}.btn{background:var(--teal);color:white;border-radius:8px;padding:10px 15px;text-decoration:none;font-weight:bold;align-self:flex-start;margin-top:auto}
footer{background:var(--cream);padding:22px 0} @media(max-width:500px){header{padding:22px 0}}
</style>
</head><body>
<header><div class="wrap"><a href="./">← Volver a Experiencias Académicas</a><h1>Biblioteca de laboratorios</h1><p>Explora los recursos disponibles por programa y asignatura. El catálogo se actualiza al publicar nuevos laboratorios.</p></div></header>
<main class="wrap"><div id="catalogo-contenido" aria-live="polite"><p>Cargando asignaturas y laboratorios…</p></div></main>
<footer><div class="wrap">Experiencias Académicas · <strong>Mg. Vicky Ruiz</strong></div></footer>
<script src="biblioteca.js" data-pagina="general" defer></script>
</body></html>
