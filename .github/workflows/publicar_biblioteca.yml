
name: Publicar biblioteca automatica

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - name: Leer repositorio
        uses: actions/checkout@v4

      - name: Preparar biblioteca
        run: |
          mkdir -p sitio
          tar --exclude=.git --exclude=.github --exclude=sitio -cf - . | tar -xf - -C sitio
          cp Biblioteca_Automatica_Para_GitHub/biblioteca.js sitio/biblioteca.js
          cp Biblioteca_Automatica_Para_GitHub/biblioteca.html sitio/biblioteca.html
          python3 Biblioteca_Automatica_Para_GitHub/herramientas/generar_catalogo.py --raiz sitio --salida catalogo.json

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos para publicar
        uses: actions/upload-pages-artifact@v4
        with:
          path: sitio

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar biblioteca
        id: deployment
        uses: actions/deploy-pages@v4
